  DB.insert('resources', { title:'5 Mistakes New Landlords Make', description:'Avoid the most common pitfalls when starting out as a rental property owner. This quick video covers tenant screening, rent pricing, insurance gaps, and more.', type:'video', url:'https://www.youtube.com/watch?v=dQw4w9WgXcQ', category:'all', tags:'beginner,landlord', created_at:new Date().toISOString() });
  DB.insert('resources', { title:'How to Screen Tenants Like a Pro', description:'A step-by-step guide to background checks, income verification, reference calls, and making the right decision on applicants.', type:'blog', readTime:'12 min read', eyebrow:'PM Academy \u2014 Landlord Fundamentals', location:'Canada \u2014 Alberta Focus', content:'<p>Choosing the wrong tenant is the most expensive mistake most first-time landlords make. Not because good judgment is hard, but because most people do not have a process. They look at one or two pieces of information, trust their gut, and hope for the best.</p><p>Professional property managers do something different. They follow the same consistent process with every applicant. They look at the same information in the same order. They make decisions based on documented evidence, not instinct. And when something goes wrong, they have a clear record showing they followed a defensible, objective process.</p><p>This guide walks you through that process, step by step, with the tools and resources to actually do each part of it. You do not need to be a professional property manager to screen like one. You just need a process you apply consistently.</p><div class="callout callout-warn"><p class="callout-label">Before You Start</p><p>Canadian landlords must comply with human rights legislation that prohibits denying a rental based on protected grounds including race, religion, family status, disability, age, gender identity, sexual orientation, and source of income. Your screening process must be consistent across all applicants. Apply the same criteria and ask the same questions of everyone. For a full list of protected grounds in Alberta, see the <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission rental housing guidelines</a>.</p></div><div class="toc-wrap"><h3>What we cover</h3><ol class="toc-list"><li><a href="#step1">Set your criteria before you advertise</a></li><li><a href="#step2">Use a consistent rental application</a></li><li><a href="#step3">Run a credit check</a></li><li><a href="#step4">Verify income and employment</a></li><li><a href="#step5">Check rental history</a></li><li><a href="#step6">Call the references properly</a></li><li><a href="#step7">Conduct a background check</a></li><li><a href="#step8">Make the decision and document it</a></li></ol></div><div id="step1" class="step-header"><div class="step-number">1</div><h2 class="step-title">Set Your Criteria Before You Advertise</h2></div><p>Most landlords start screening when applications come in. The problem with that approach is that without criteria decided in advance, you end up making ad-hoc judgments influenced by how much you liked someone in a viewing, whether they reminded you of yourself, or whether you were tired when you reviewed their paperwork.</p><p>Write your screening criteria down before the first showing. This protects you legally, keeps you consistent, and removes the emotional variability that leads to bad decisions. The criteria should be objective and financial, not personal.</p><h3>Standard criteria to define in advance:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Minimum credit score.</strong> Most landlords in Canada look for a score of 650 or above. A score between 600 and 650 warrants closer review. Below 600 is a risk signal that requires additional context.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Rent-to-income ratio.</strong> The standard benchmark is that monthly rent should not exceed one-third of gross monthly income. At $2,000/month rent, you are looking for income of at least $6,000/month.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Employment stability.</strong> You are looking for a clear income source, not necessarily a traditional employer. Employed, self-employed, retired, and receiving documented government benefits can all qualify.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Rental history standard.</strong> No evictions, no unpaid rent collections, and positive landlord references within the past three years.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Completed application required.</strong> Incomplete applications are not reviewed. This alone filters out applicants who are not serious or are trying to hide information.</span></li></ul><div class="callout callout-warn"><p class="callout-label">Important: Source of Income</p><p>In Alberta, the Human Rights Act prohibits discrimination based on source of income. You cannot refuse an applicant because they receive government assistance, AISH, disability benefits, or support payments. Your screening criteria must be applied to income level and stability, not its origin. For more detail, see the <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission guidance on rental housing</a>.</p></div><div id="step2" class="step-header"><div class="step-number">2</div><h2 class="step-title">Use a Consistent Rental Application</h2></div><p>A rental application is your foundational document. It collects the information you need to run the rest of your screening process and it creates a paper record that the applicant signed and attested to. If information on the application turns out to be false, you have grounds for rejection or, if discovered post-move-in, potential lease termination.</p><p>Every applicant should complete the same form. Not a modified version. The same form. This protects you from any claim that you applied different standards to different people.</p><h3>A complete rental application should collect:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Full legal name, date of birth, and government ID number (required for credit check)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current and previous addresses for the past three years, including dates</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current and previous landlord contact information</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current employer or income source, contact name and number for verification</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Monthly gross income (self-declared, to be verified)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Two personal references (not family members) with contact information</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Signed consent for credit check and background check</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Declaration that all information is truthful and complete</li></ul><div class="resource-block"><h4>Application Templates</h4><ul class="resource-list"><li><a href="https://www.rentfaster.ca/blog/what-to-look-for-when-screening-a-tenant/" target="_blank" rel="noopener">RentFaster.ca &mdash; Alberta-specific landlord screening overview and forms guidance</a></li><li><a href="https://www.landlordandtenant.org/legislation/" target="_blank" rel="noopener">Centre for Public Legal Education Alberta &mdash; Provincial tenancy legislation overview</a></li><li><a href="https://open.alberta.ca/publications/rta-handbook-for-landlords-and-tenants" target="_blank" rel="noopener">Government of Alberta &mdash; RTA Handbook for Landlords and Tenants (June 2025)</a></li></ul></div><div id="step3" class="step-header"><div class="step-number">3</div><h2 class="step-title">Run a Credit Check</h2></div><p>The credit report is the most important single document in your screening process. It tells you whether this person has a pattern of paying their financial obligations on time. That pattern is the strongest available predictor of whether they will pay you on time.</p><p>You cannot pull a credit report without the applicant&#39;s written consent. That consent should be part of your rental application. Once you have it, you have two ways to proceed: use a tenant screening service, or pull directly from one of Canada&#39;s two credit bureaus.</p><div class="callout callout-info"><p class="callout-label">November 2024 Policy Update</p><p>As of November 2024, both Equifax and TransUnion have classified rental credit checks as <strong>soft inquiries</strong>. This means running a credit check on a prospective tenant no longer affects their credit score. This is a meaningful change for tenants who were previously hesitant to authorize checks when applying to multiple properties. You can share this information openly with applicants to remove any friction around consent.</p></div><h3>What to look for in a credit report:</h3><table class="decision-table"><thead><tr><th>Item</th><th>What it tells you</th><th>What to watch for</th></tr></thead><tbody><tr><td>Credit score</td><td>Overall creditworthiness on a 300&ndash;900 scale</td><td>Below 600 is elevated risk. 650+ is a reasonable baseline. Context matters.</td></tr><tr><td>Payment history</td><td>Whether they pay bills on time</td><td>Patterns of late payments or missed accounts signal chronic financial stress</td></tr><tr><td>Collections</td><td>Accounts sent to collections agencies</td><td>A rent collection specifically is a serious red flag</td></tr><tr><td>Rent tradelines</td><td>History of reported rent payments (Equifax only)</td><td>Equifax accepts rent payment reporting &mdash; unpaid rent may appear here</td></tr><tr><td>Outstanding debt</td><td>Total debt load relative to income</td><td>High debt with moderate income compresses what is available for rent</td></tr><tr><td>Bankruptcies</td><td>Prior financial restructuring</td><td>Recent bankruptcy is a risk signal. Discharged bankruptcy several years ago is less concerning.</td></tr><tr><td>Addresses</td><td>Cross-reference with application history</td><td>Significant gaps or addresses not disclosed on the application warrant questions</td></tr></tbody></table><div class="callout callout-pro"><p class="callout-label">Pro Tip: Run Both Bureaus</p><p>Equifax and TransUnion pull data from different lenders. Research shows that in more than 40% of cases, there is a 40-point or greater difference between the two scores. Running both gives you a more complete picture and reduces the chance of missing a significant red flag on one bureau that does not appear on the other. Equifax is particularly useful for rent-related tradelines and collections.</p></div><div class="resource-block"><h4>Tenant Credit Check Services (Canada)</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/en-ca/tenant-report/" target="_blank" rel="noopener">SingleKey &mdash; Full Equifax and TransUnion dual reports, eviction records, public document scan</a></li><li><a href="https://frontlobby.com/frontlobby-tenant-credit-check/" target="_blank" rel="noopener">FrontLobby &mdash; Equifax credit reports with rental tradeline data</a></li><li><a href="https://www.tenantverification.ca/tenant-screening.html" target="_blank" rel="noopener">TVS (Tenant Verification Service) &mdash; Canadian credit and criminal screening</a></li><li><a href="https://learn.openroom.ca/post/equifax-vs-tranunion" target="_blank" rel="noopener">Openroom &mdash; Guide to understanding Equifax vs TransUnion for landlords</a></li></ul></div><div id="step4" class="step-header"><div class="step-number">4</div><h2 class="step-title">Verify Income and Employment</h2></div><p>A credit score tells you about past behaviour. Income verification tells you about current capacity. Even an applicant with an excellent credit history can end up unable to pay rent if their financial situation has recently changed. You need both.</p><p>The standard benchmark is that gross monthly income should be at least three times the monthly rent. At $1,800/month, you are looking for income of $5,400/month or better. Use this as a starting floor, not an absolute threshold &mdash; a well-qualified applicant with strong credit and a slightly lower income ratio may still be an excellent choice.</p><h3>Documents to request based on income type:</h3><table class="decision-table"><thead><tr><th>Applicant type</th><th>What to request</th></tr></thead><tbody><tr><td>Traditionally employed</td><td>Last two or three pay stubs, plus an employment letter on company letterhead confirming position, salary, and start date</td></tr><tr><td>Recently hired</td><td>Signed offer letter from employer on company letterhead, stating salary and start date; most recent pay stubs from previous employer</td></tr><tr><td>Self-employed / freelance</td><td>Last two years of CRA Notice of Assessment (NOA) or T1 General, plus three to six months of bank statements showing consistent deposits</td></tr><tr><td>Retired</td><td>Pension statement or government benefit letter, plus bank statements confirming regular deposits</td></tr><tr><td>Receiving benefits or support</td><td>Official government benefit documentation or court-ordered support documents; bank statements confirming receipt</td></tr><tr><td>Gig / platform worker</td><td>Three to six months of bank statements showing deposit consistency, platform payout statements if available</td></tr></tbody></table><h3>How to verify the documents are real:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Cross-reference pay stubs with bank statements.</strong> The net pay on the stub should match the deposit amounts in the account. If the numbers do not align, ask about it directly.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Call the employer directly.</strong> Do not call the number on the letter. Look up the company independently and call their HR or main line. Ask to confirm the person&#39;s employment and salary. Most employers will confirm this with the employee&#39;s written consent, which you already have from the application.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Watch for document red flags.</strong> Pay stubs with round numbers and no cents, inconsistent fonts, missing year-to-date totals, or addresses that do not match public records are common signs of altered documents.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Do not rely on a single document.</strong> Request at least two different types for every applicant. A pay stub alone does not confirm employment. A bank statement alone does not confirm the income source. Together, they do.</span></li></ul><div class="callout callout-info"><p class="callout-label">CRA Verification for Self-Employed Applicants</p><p>Self-employed applicants can request a <strong>Proof of Income Statement</strong> or <strong>Notice of Assessment (NOA)</strong> directly from the Canada Revenue Agency. These documents are difficult to falsify and provide a reliable picture of declared income. Applicants can request their own documents at <a href="https://www.canada.ca/en/revenue-agency/services/e-services/e-services-individuals/account-individuals.html" target="_blank" rel="noopener">CRA My Account</a>.</p></div><div class="resource-block"><h4>Income Verification Resources</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/income-verification-rental-app/" target="_blank" rel="noopener">SingleKey &mdash; Canadian landlord&#39;s guide to income verification by applicant type</a></li><li><a href="https://royalyorkpropertymanagement.ca/news-article/how-do-you-prove-income-to-rent-in-canada" target="_blank" rel="noopener">Royal York Property Management &mdash; How tenants prove income in Canada</a></li><li><a href="https://www.canada.ca/en/revenue-agency/services/e-services/e-services-individuals/account-individuals.html" target="_blank" rel="noopener">Canada Revenue Agency &mdash; CRA My Account (for applicants to request NOA)</a></li><li><a href="https://rentals.ca/blog/what-are-some-alternatives-for-proof-of-income" target="_blank" rel="noopener">Rentals.ca &mdash; Alternative income verification options for non-traditional earners</a></li></ul></div><div id="step5" class="step-header"><div class="step-number">5</div><h2 class="step-title">Check Rental History</h2></div><p>Rental history is the most direct predictor of how someone will behave as a tenant. Someone who paid on time, communicated well, and left a unit in good condition for the past five years is more likely to do the same for you than someone about whom you know nothing beyond their credit score.</p><p>Rental history also catches things that credit checks sometimes miss. A landlord who was not paid may not have reported it to a credit bureau. But they will usually tell you directly if you call them.</p><h3>What to look up before you call:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Search the applicant&#39;s name on <a href="https://openroom.ca" target="_blank" rel="noopener">Openroom</a>, which aggregates publicly available court-ordered landlord-tenant dispute records across Canada</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Check for past eviction orders on <a href="https://www.canlii.org/en/" target="_blank" rel="noopener">CanLII</a>, which contains publicly searchable tribunal and court decisions including landlord-tenant board rulings</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Verify that the previous landlord names and addresses on the application match the applicant&#39;s credit report address history</span></li></ul><div class="callout callout-warn"><p class="callout-label">Important: &quot;Bad Tenant&quot; Lists</p><p>Alberta&#39;s Office of the Information and Privacy Commissioner advises landlords to avoid using informal &quot;bad tenant&quot; lists circulated on social media or private forums. These lists raise significant privacy concerns under PIPA and the information may be inaccurate, unverified, or collected without proper consent. Stick to public records platforms like CanLII and Openroom. See the <a href="https://oipc.ab.ca/resource/guidance-for-landlords-and-tenants/" target="_blank" rel="noopener">OIPC guidance for landlords and tenants</a> for detail.</p></div><div id="step6" class="step-header"><div class="step-number">6</div><h2 class="step-title">Call the References Properly</h2></div><p>Most landlords either skip reference calls entirely or treat them as a formality. Neither approach is defensible. A reference call, done correctly, is one of the most valuable pieces of information in your screening process.</p><p>The key is asking the right questions. Most previous landlords are willing to tell you exactly what you need to know if you give them clear, specific questions to answer. Vague questions get vague answers. Specific questions get useful ones.</p><div class="pull-quote"><p>A previous landlord who hesitates, deflects, or sticks to bare minimum confirmation is telling you something. Pay attention to what people do not say.</p></div><h3>For previous landlords, ask:</h3><div class="question-grid"><div class="q-card"><strong>On-time payment</strong>&quot;Did they pay rent on time consistently? Were there ever months where you had to follow up?&quot;</div><div class="q-card"><strong>Property condition</strong>&quot;What was the condition of the unit when they moved out? Were there any damage charges beyond normal wear and tear?&quot;</div><div class="q-card"><strong>Communication</strong>&quot;How did they communicate when something came up? Were they responsive and easy to reach?&quot;</div><div class="q-card"><strong>Neighbours and building</strong>&quot;Were there any noise complaints or issues with other residents during their tenancy?&quot;</div><div class="q-card"><strong>The direct question</strong>&quot;Would you rent to them again? If not, why not?&quot;</div><div class="q-card"><strong>Closing</strong>&quot;Is there anything I should know about them as a tenant that I have not asked about?&quot;</div></div><h3>For employers (income verification call), ask:</h3><div class="question-grid"><div class="q-card"><strong>Confirm employment</strong>&quot;Can you confirm that [name] is currently employed with your organization?&quot;</div><div class="q-card"><strong>Confirm income</strong>&quot;Can you confirm their approximate salary or hourly rate? They have authorized this inquiry in writing.&quot;</div><div class="q-card"><strong>Employment type</strong>&quot;Is their employment full-time, permanent? Or is it contract or seasonal?&quot;</div></div><h3>Red flags on reference calls:</h3><ul class="red-flags"><li><span class="flag-dot"></span>Previous landlord will only confirm dates and nothing else</li><li><span class="flag-dot"></span>Previous landlord says they would not rent to the person again but cannot or will not explain why</li><li><span class="flag-dot"></span>Phone numbers for previous landlords are disconnected, personal mobile phones only, or go to voicemail with no callback</li><li><span class="flag-dot"></span>The contact at the previous landlord address is the applicant&#39;s friend or family member, not an actual landlord</li><li><span class="flag-dot"></span>Employment line number does not match the company&#39;s publicly listed number</li><li><span class="flag-dot"></span>Employer cannot confirm the applicant&#39;s role or salary even with signed written consent provided</li><li><span class="flag-dot"></span>Applicant listed only personal friends or family members as references rather than professional contacts or landlords</li></ul><div class="callout callout-pro"><p class="callout-label">Pro Tip: The Current Landlord Problem</p><p>Applicants who know they are problem tenants sometimes list their current landlord knowing the landlord will say nice things to get them out. Ask about the landlord before their current one as well. Two data points are more reliable than one. Also note whether the previous tenancy ended by the tenant&#39;s choice or the landlord&#39;s.</p></div><div id="step7" class="step-header"><div class="step-number">7</div><h2 class="step-title">Conduct a Background Check</h2></div><p>A background check broadens the picture beyond financial history and rental track record. For most residential landlords with standard properties, a credit check, income verification, and thorough reference calls will be sufficient. A background check adds an additional layer that is worth considering for higher-risk situations.</p><p>Background checks in Canada can cover criminal history, public court records, and eviction records. They must be conducted with written consent and must comply with PIPA and provincial privacy legislation.</p><h3>What a background check typically covers:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Criminal record searches via the Canadian Police Information Centre (CPIC)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Publicly available court decisions including prior eviction orders</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Fraud history from public documents and court records</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Previous addresses verified against stated history</li></ul><div class="callout callout-warn"><p class="callout-label">Human Rights Caution</p><p>A criminal record is not an automatic basis for rejecting a tenant. Alberta&#39;s Human Rights Act requires landlords to assess each situation individually. A conviction for a minor offence from fifteen years ago is different from a recent conviction for property-related violence. If a criminal record is a factor in your decision, make sure the connection to tenancy risk is clear, direct, and documented. For detailed guidance, see <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission &mdash; Rental Housing</a>.</p></div><div class="resource-block"><h4>Background Check Services (Canada)</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/en-ca/tenant-report/" target="_blank" rel="noopener">SingleKey &mdash; Background checks including criminal, fraud, and 200,000+ public databases</a></li><li><a href="https://www.tenantverification.ca/tenant-screening.html" target="_blank" rel="noopener">TVS Tenant Verification Service &mdash; Credit and criminal checks for Canadian landlords</a></li><li><a href="https://openroom.ca" target="_blank" rel="noopener">Openroom &mdash; Eviction record search from LTB decisions across Canada</a></li><li><a href="https://www.canlii.org/en/" target="_blank" rel="noopener">CanLII &mdash; Free searchable database of Canadian court and tribunal decisions</a></li><li><a href="https://oipc.ab.ca/resource/guidance-for-landlords-and-tenants/" target="_blank" rel="noopener">Alberta OIPC &mdash; Privacy guidance for landlords using third-party screening services</a></li></ul></div><div id="step8" class="step-header"><div class="step-number">8</div><h2 class="step-title">Make the Decision and Document It</h2></div><p>You have run the process. Now you need to decide. And however you decide, you need to document the reason.</p><p>Documentation protects you. If an unsuccessful applicant later claims they were rejected for a discriminatory reason, your documentation showing the objective criteria that led to your decision is your defence. It does not need to be elaborate. It needs to exist.</p><h3>How to evaluate what you have:</h3><table class="decision-table"><thead><tr><th>Signal</th><th>Weight it carries</th><th>What to do with it</th></tr></thead><tbody><tr><td>Strong credit + verified income + positive landlord references</td><td>High confidence</td><td>Approve. Document what you confirmed and how.</td></tr><tr><td>Low credit score but strong income and excellent rental history</td><td>Acceptable with context</td><td>Ask about the credit history. A specific past event explains differently than a chronic pattern.</td></tr><tr><td>Great income but no rental history (first-time renter)</td><td>Moderate risk, manageable</td><td>Consider a co-signer or larger security deposit (subject to provincial limits). Weighted income requirement.</td></tr><tr><td>Prior eviction on record</td><td>Serious risk signal</td><td>Ask directly. Understand the circumstances. Recent evictions for non-payment are a dealbreaker for most landlords.</td></tr><tr><td>Incomplete application or inability to verify key information</td><td>Automatic disqualification</td><td>Do not proceed. Document that the application was incomplete or unverifiable.</td></tr><tr><td>Inconsistencies between documents and application</td><td>High-risk signal</td><td>Ask for clarification in writing. If the explanation is unsatisfactory, decline and document.</td></tr></tbody></table><h3>For every applicant, keep on file:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>The completed and signed rental application</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Credit report and the score or condition that informed your decision</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Income documents received and verified</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Notes from all reference and employer calls, including who you spoke with and when</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>A brief written note explaining the reason for approval or denial, referencing your objective criteria</li></ul><div class="callout callout-info"><p class="callout-label">Declining an Application</p><p>In Alberta, you are not required to provide a reason for declining an applicant, but you are required to ensure your decision was not based on a protected ground. A written note for your own records that states the objective basis for denial (such as &quot;income below the minimum ratio&quot; or &quot;negative landlord reference from most recent tenancy&quot;) is good practice even when not shared with the applicant.</p></div><div class="art-divider"></div><h2>The Bigger Picture</h2><p>Tenant screening is not about finding a perfect person. It is about gathering enough reliable information to make an informed, defensible decision. The landlords who struggle most with tenants are usually the ones who skipped a step, moved too fast, or let optimism substitute for process.</p><p>A screening process also signals something to good tenants. Applicants who pay on time, maintain properties well, and communicate honestly are generally happy to provide documentation. The process itself filters for people who take the relationship seriously.</p><p>Run the same process with every applicant. Document what you find and what you decided. Keep those records for the duration of the tenancy and for a reasonable period after. That habit, done consistently, is what separates landlords who handle problems well from landlords who are surprised by them.</p><div class="kru-note"><div class="kru-note-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><p><strong>Once a tenant moves in, the next challenge is maintenance coordination.</strong> Kru helps landlords manage maintenance requests, approvals, contractor communication, and documentation in one place &mdash; so you are not chasing updates or rebuilding history from text threads. <a href="https://mykru.ca" target="_blank" rel="noopener">Learn how Kru works at mykru.ca</a>.</p></div><div class="art-cta"><h3>More guides like this, in your inbox</h3><p>PM Academy covers the operational side of being a landlord. Tenant screening, maintenance coordination, documentation, and what professional property management actually looks like.</p><a href="https://mykru.ca" class="art-cta-btn" target="_blank" rel="noopener">Visit PM Academy at mykru.ca</a></div>', category:'all', tags:'screening,beginner', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Understanding the Residential Tenancies Act', description:'A beginner-friendly breakdown of your rights and responsibilities as a landlord under Canadian tenancy law.', type:'blog', content:'<h3>Know Your Legal Obligations</h3><p>Every province in Canada has its own Residential Tenancies Act (RTA) governing the landlord-tenant relationship. While the specifics vary, the core principles are consistent across all jurisdictions. Understanding these rules is not optional — it is a legal requirement, and ignorance is not a defense.</p><h3>What the RTA Covers</h3><p>The RTA defines the rights and responsibilities of both landlords and tenants. It covers everything from how you collect rent to how you enter the unit, handle repairs, increase rent, and end a tenancy. If you manage even one rental unit in Canada, the RTA applies to you.</p><h3>Right to Quiet Enjoyment</h3><p>Tenants have the right to reasonable peace and privacy in their home. You cannot enter without proper written notice — typically 24 hours in most provinces. Exceptions exist for genuine emergencies (e.g., a burst pipe or fire), but casual drop-ins or surprise inspections are not permitted. Repeated unauthorized entry can result in complaints to the tribunal and potential fines.</p><h3>Maintenance and Repair Standards</h3><p>Landlords must keep the property in a good state of repair, meeting all applicable health, safety, and housing standards. This includes structural elements, plumbing, heating, electrical systems, and common areas. You cannot pass these responsibilities to the tenant through the lease — the obligation is statutory and cannot be contracted away. When a tenant reports a maintenance issue, you are expected to respond within a reasonable timeframe. Failure to maintain the property can lead to rent abatement orders or municipal enforcement.</p><h3>Rent Increases</h3><p>Most provinces cap annual rent increases to a government-published guideline amount, and require written notice — typically 90 days before the increase takes effect. In Ontario, the guideline for 2024 was 2.5%. Some newer buildings may be exempt from rent control depending on when they were first occupied. Always verify the rules in your specific province, as the details differ significantly.</p><h3>Security Deposits</h3><p>Rules around deposits vary dramatically by province. Ontario does not allow security or damage deposits at all — only a last month\'s rent deposit, which must be applied to the final month of tenancy. British Columbia allows a damage deposit of up to half a month\'s rent and a pet damage deposit of the same amount. Alberta allows a security deposit of up to one month\'s rent. Know your province\'s rules before collecting anything beyond first and last month\'s rent.</p><h3>The Eviction Process</h3><p>You cannot simply evict a tenant because you want them out. There are specific legal grounds for eviction, and a formal process must be followed. Common grounds include: persistent late payment, causing damage, illegal activity, the landlord or their family moving in, or major renovations that require the unit to be vacant. In every case, proper notice must be served using the correct provincial form. If the tenant disputes the notice, the matter goes to a hearing at the provincial tribunal (e.g., the Landlord and Tenant Board in Ontario). Self-help evictions — such as changing the locks or shutting off utilities — are illegal everywhere in Canada.</p><h3>Lease Agreements and the RTA</h3><p>Any clause in a lease that contradicts the RTA is void and unenforceable, even if the tenant signed it. For example, a clause saying "no guests after 10 PM" or "tenant is responsible for all repairs" would not hold up. The RTA sets the floor — you can offer more than the minimum, but never less. Use a province-specific standard lease form where one is required (Ontario mandates this).</p><h3>Provincial Differences at a Glance</h3><ul><li><strong>Ontario</strong> — Landlord and Tenant Board (LTB) handles disputes. No security deposits. Standard lease required. Rent control on most units.</li><li><strong>British Columbia</strong> — Residential Tenancy Branch (RTB) handles disputes. Damage deposit up to half a month. Rent increase limited to annual guideline.</li><li><strong>Alberta</strong> — Residential Tenancy Dispute Resolution Service (RTDRS). Security deposit up to one month. No rent control — landlords can increase rent with proper notice.</li><li><strong>Quebec</strong> — Tribunal administratif du logement (TAL). Unique rules including automatic lease renewal and restrictions on lease transfers.</li></ul><h3>Staying Compliant</h3><p>The best way to stay out of trouble is to treat the RTA as your operating manual. Keep written records of everything — notices, communications, repair requests, inspections. Use proper provincial forms for notices. Respond to maintenance requests promptly. Never attempt to resolve disputes through self-help measures. When in doubt, consult your provincial tribunal\'s website or seek legal advice before acting.</p><p>Staying informed about your local RTA is not just good practice — it is the foundation of professional property management.</p>', category:'all', tags:'legal,beginner', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'The PM Playbook: From 1 Unit to 50', description:'Real strategies from property managers who scaled their portfolio. Covers systems, hiring, technology, and mindset shifts.', type:'blog', content:'<h3>Scaling Your Portfolio</h3><h3>1-5 Units: The DIY Phase</h3><p>Handle most things yourself. Focus on basics of tenant relations and bookkeeping.</p><h3>5-15 Units: The Systems Phase</h3><p>Build repeatable processes. Use software, standardize leases, build a contractor network.</p><h3>15-50 Units: The Team Phase</h3><p>Hire help. Use platforms like Kru to automate maintenance. Focus on acquisitions and strategy.</p>', category:'all', tags:'scaling,strategy', created_at:new Date().toISOString() });
  DB.insert('resources', { title:'Setting Up Your First Rental Property', description:'A complete walkthrough for first-time landlords — from finding the right property to getting your first tenant.', type:'guide', content:'<h3>Your First Rental Checklist</h3><ol><li>Research your market — rents, vacancy rates, demographics.</li><li>Run the numbers — mortgage, taxes, insurance, maintenance reserves.</li><li>Prepare the property — safety codes, smoke detectors, secure entries.</li><li>Get landlord insurance and consider umbrella coverage.</li><li>Create a province-specific lease agreement.</li><li>List and market with quality photos.</li><li>Screen tenants thoroughly.</li><li>Do a move-in inspection with signed documentation.</li></ol>', category:'all', tags:'beginner,setup', created_at:new Date().toISOString() });

  // --- COURSE: The Maintenance Coordination Masterclass ---
  const mc = DB.insert('courses', { title:'The Maintenance Coordination Masterclass', description:'Build the maintenance system your portfolio actually needs. 5 modules, 15 implementation lessons, and downloadable templates covering workflow design, contractor management, communication, emergency protocols, and financial tracking. Created by Jeff Kiers, VP of Growth & Partnerships at Kru.', category:'Maintenance', difficulty:'intermediate', is_free:false, price:149.00, is_published:true, created_by:1, created_at:new Date().toISOString() });

  // Module 1: Diagnosing Your Current State
  const mc_m1 = DB.insert('modules', { course_id:mc.id, title:'Module 1: Diagnosing Your Current State', description:'Before you build, know what you are working with. Audit your operations and identify gaps.', sort_order:0 });
  DB.insert('lessons', { module_id:mc_m1.id, title:'Lesson 1.1: The Maintenance Audit', description:'Map how maintenance actually flows through your operations today', content_type:'text', text_content:'<h3>The Maintenance Audit</h3><p>Most property managers have never mapped their own maintenance process. The gap between how you think things work and how they actually work is where time, money, and tenant satisfaction disappear.</p><h3>The Audit Process</h3><p><strong>Step 1:</strong> List every channel through which maintenance requests reach you — phone, text, email, portal, in-person, social media, front desk, other staff. Most PMs discover 6-8 channels.</p><p><strong>Step 2:</strong> Estimate how many requests arrive through each channel per week. Approximate percentages work.</p><p><strong>Step 3:</strong> Trace the path of a typical request from arrival to resolution. Who receives it? Who triages? Who approves? Who assigns the contractor? How do you know when it is done?</p><p><strong>Step 4:</strong> Identify failure points. Where do requests stall? Where does information get lost? Where do tenants call asking what is happening?</p><h3>Exercise</h3><p>Download the Maintenance Operations Audit Template. Block 60 minutes this week to complete it. Do not try to do it from memory — spend a few days observing how requests actually flow before filling it in.</p>', duration:20, sort_order:0, is_free_preview:true });
  DB.insert('lessons', { module_id:mc_m1.id, title:'Lesson 1.2: Channel Mapping', description:'Document every communication pathway and make consolidation decisions', content_type:'text', text_content:'<h3>Channel Mapping</h3><p>Channel fragmentation is the root cause of most maintenance coordination failures. A request that arrives by text at 7 AM gets buried by the time you have checked email, listened to voicemails, and handled an in-person report.</p><h3>How to Map Your Channels</h3><p>For each channel, document four things:</p><ol><li><strong>Who uses it</strong> — Tenants, contractors, owners, staff?</li><li><strong>What information flows through it</strong> — Requests, updates, approvals, or all three?</li><li><strong>Whether it creates a record</strong> — A text is not searchable, not attached to a unit, not accessible to your team.</li><li><strong>What happens when you are unavailable</strong> — If nobody sees a text while you are on vacation, that channel is a single point of failure.</li></ol><h3>The Consolidation Decision</h3><p>You have three options: <strong>Manual</strong> (log everything into a spreadsheet), <strong>Platform</strong> (use a tool like Kru that centralizes everything), or <strong>Hybrid</strong> (multiple entry points, one system of record). The principle is non-negotiable: one system of record, regardless of how many channels feed into it.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m1.id, title:'Lesson 1.3: Measuring Your Current Performance', description:'Five metrics that matter and how to estimate them today', content_type:'text', text_content:'<h3>Five Metrics That Matter</h3><p>You cannot improve what you do not measure. Here are the five maintenance metrics every PM should track:</p><ol><li><strong>Average Response Time</strong> — Time from request submission to tenant acknowledgment. Tenants care more about knowing they have been heard than the speed of the actual repair.</li><li><strong>Average Resolution Time</strong> — Time from submission to job completion. Break down by category: emergency (hours), urgent (days), routine (business days).</li><li><strong>Follow-up Ratio</strong> — For every 10 requests, how many require you to chase the contractor for a status update? If more than 3, your communication system has gaps.</li><li><strong>Documentation Completeness</strong> — Pull your last 10 jobs. For each, check: original request, approval, assignment, estimate, completion confirmation, photos, invoice. Score each out of 7.</li><li><strong>Repeat Request Rate</strong> — How often does the same issue return within 90 days? Above 10% suggests contractor quality issues or deferred maintenance being patched rather than resolved.</li></ol><h3>Exercise</h3><p>Estimate each metric for your portfolio now. Write them down as your baseline. After implementing your new system, measure again to see improvement.</p>', duration:15, sort_order:2, is_free_preview:false });

  // Module 2: Building Your Maintenance Workflow
  const mc_m2 = DB.insert('modules', { course_id:mc.id, title:'Module 2: Building Your Maintenance Workflow', description:'The seven steps every maintenance request should follow, from submission to close-out.', sort_order:1 });
  DB.insert('lessons', { module_id:mc_m2.id, title:'Lesson 2.1: The Seven-Step Workflow', description:'Build a complete, documented maintenance workflow', content_type:'text', text_content:'<h3>The Seven-Step Maintenance Workflow</h3><p>Every request, regardless of complexity, passes through the same seven stages. Skipping a stage is how things fall through.</p><ol><li><strong>Request Submission</strong> — Logged with timestamp, description, unit, photos, and reporter name. If it is not logged, it does not exist.</li><li><strong>Triage and Classification</strong> — Emergency (active damage/safety risk, immediate response), Urgent (affects function, 24-48h), Routine (can be scheduled, 5-10 business days).</li><li><strong>Approval</strong> — Clear pre-agreed thresholds: PM approves up to $500, owner approval $500-$2,000, formal estimate above $2,000, emergency pre-authorized up to $1,000.</li><li><strong>Contractor Assignment</strong> — Includes scope, access instructions, tenant availability, budget cap, and special considerations.</li><li><strong>Estimate and Approval</strong> — For non-emergency work above threshold. Scope, materials, labor, timeline, exclusions.</li><li><strong>Work Execution and Documentation</strong> — Before/after photos, work description, deviations, materials used. Built into the workflow, not a separate step.</li><li><strong>Close-Out and Invoicing</strong> — Tenant notified, invoice submitted, documentation attached to unit record. A job is not done until the record is complete.</li></ol>', duration:25, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m2.id, title:'Lesson 2.2: The Triage Decision Matrix', description:'Remove judgment from triage with a classification reference document', content_type:'text', text_content:'<h3>The Triage Decision Matrix</h3><p>Classification errors are expensive in both directions. Treating routine as emergency wastes money. Treating emergency as routine causes damage and legal exposure.</p><p>The matrix lists specific scenarios and their correct classification. Your team does not need to decide — they look it up:</p><ul><li>Dripping faucet, no water damage → <strong>Routine</strong></li><li>Dripping faucet with visible water damage to ceiling below → <strong>Urgent</strong></li><li>Active water flow that cannot be stopped → <strong>Emergency</strong></li></ul><p>The template covers the 30 most common scenarios across plumbing, electrical, HVAC, structural, appliance, pest, and exterior categories. Customize it for your specific properties.</p><h3>Exercise</h3><p>Download the Triage Decision Matrix template. Review the 30 pre-built scenarios, adjust for your portfolio, add property-specific scenarios. Print it and keep it accessible.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m2.id, title:'Lesson 2.3: Approval Thresholds', description:'Formalize spending authority with property owners', content_type:'text', text_content:'<h3>Approval Thresholds</h3><p>This is one of the most important conversations you will have with a property owner. It determines how fast you can move and where the handoff points are.</p><h3>Recommended Starting Framework</h3><ul><li><strong>PM approval:</strong> Work up to $500</li><li><strong>Owner notification:</strong> Work between $500 and $1,500</li><li><strong>Owner approval required:</strong> Work above $1,500</li><li><strong>Emergency pre-authorization:</strong> Up to $1,000 for stabilization</li></ul><h3>How to Present It</h3><p>The framing that works: "I want to respond quickly to small issues without slowing things down for you. Here is a structure so you stay in control of larger decisions while I handle the day-to-day efficiently."</p><h3>Exercise</h3><p>Complete the Approval Threshold Guide for each property. Schedule a conversation with each owner or board to formalize and get it in writing.</p>', duration:15, sort_order:2, is_free_preview:false });

  // Module 3: Contractor Management System
  const mc_m3 = DB.insert('modules', { course_id:mc.id, title:'Module 3: Contractor Management System', description:'Build reliable vendor relationships through structure, not luck.', sort_order:2 });
  DB.insert('lessons', { module_id:mc_m3.id, title:'Lesson 3.1: Contractor Vetting', description:'The five-point vetting checklist for every new contractor', content_type:'text', text_content:'<h3>The Five-Point Vetting Checklist</h3><p>Never add a contractor to your preferred list without verifying these five areas:</p><ol><li><strong>Insurance Verification</strong> — Confirm current liability insurance and workers compensation coverage. Request certificates directly from the insurer, not the contractor.</li><li><strong>Licensing Confirmation</strong> — Verify all required trade licenses are current and valid for your jurisdiction.</li><li><strong>Reference Checks</strong> — Contact other property managers who use this contractor. Ask about reliability, communication, and quality.</li><li><strong>Test Job Protocol</strong> — Assign a small job before committing to ongoing work. Evaluate quality, communication, documentation, and invoicing.</li><li><strong>Financial Stability</strong> — Look for indicators that the business is stable: how long in operation, consistent crew, proper equipment, professional invoicing.</li></ol><h3>Exercise</h3><p>Use the Contractor Vetting Checklist to evaluate every contractor currently on your preferred list. You may find some do not meet the standard you thought they did.</p>', duration:15, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m3.id, title:'Lesson 3.2: Contractor Onboarding', description:'Set expectations before the first job, not after the first problem', content_type:'text', text_content:'<h3>Contractor Onboarding</h3><p>A contractor who receives a clear onboarding package on day one performs better than one who learns your expectations through trial and error over six months.</p><h3>The Onboarding Package Includes:</h3><ul><li><strong>Communication Standards</strong> — How and when to update the PM on job status</li><li><strong>Documentation Requirements</strong> — Photos required, completion reports, what to capture</li><li><strong>Invoicing Procedures</strong> — Payment terms, format, submission process</li><li><strong>Access Protocols</strong> — How to enter tenant units, key management, security procedures</li><li><strong>Professional Conduct Standards</strong> — Behavior expectations in tenant-occupied spaces</li></ul><p>Contractors who know when they get paid perform better. Set clear payment terms and honor them consistently.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m3.id, title:'Lesson 3.3: Performance Tracking', description:'Evaluate contractors with data instead of gut feeling', content_type:'text', text_content:'<h3>The Performance Scorecard</h3><p>Evaluate each contractor quarterly across five dimensions:</p><ol><li><strong>Response Time</strong> — How quickly they accept and schedule assigned work</li><li><strong>Quality of Work</strong> — Callbacks and tenant complaints within 30 days of completion</li><li><strong>Communication</strong> — Timeliness and clarity of status updates</li><li><strong>Documentation Compliance</strong> — Photos, completion reports, proper invoicing</li><li><strong>Reliability</strong> — Jobs completed on time vs. rescheduled or no-showed</li></ol><p>Quarterly reviews using this scorecard give you data to have honest, productive conversations about what is working and what needs to change. It also protects you — when you need to replace a contractor, you have documentation showing why.</p>', duration:15, sort_order:2, is_free_preview:false });

  // Module 4: Communication and Documentation
  const mc_m4 = DB.insert('modules', { course_id:mc.id, title:'Module 4: Communication and Documentation', description:'Reduce noise, build the record, and keep all stakeholders informed.', sort_order:3 });
  DB.insert('lessons', { module_id:mc_m4.id, title:'Lesson 4.1: Tenant Communication Templates', description:'10 ready-to-use messages for every common maintenance situation', content_type:'text', text_content:'<h3>10 Tenant Communication Templates</h3><p>Each template includes the logic behind it — why the message exists, when to send it, and what it accomplishes for the tenant relationship.</p><ol><li><strong>Request Acknowledgment</strong> — Sent immediately when a request is logged. Confirms receipt and sets timeline expectations.</li><li><strong>Status Update During Repair</strong> — Proactive update so tenants do not have to call and ask.</li><li><strong>Job Completion Notification</strong> — Confirms work is done, invites feedback.</li><li><strong>Scheduled Maintenance Notice</strong> — Advance notice for planned work with access requirements.</li><li><strong>Emergency Communication</strong> — Clear, calm messaging during active situations.</li><li><strong>Seasonal Maintenance Reminders</strong> — Proactive tips that prevent requests (furnace filters, drain maintenance).</li><li><strong>Move-in Maintenance Orientation</strong> — How to submit requests, what to expect, emergency procedures.</li><li><strong>Lease Renewal Maintenance Summary</strong> — Shows the tenant what you have done for them this year.</li><li><strong>After-Hours Emergency Instructions</strong> — What qualifies as an emergency, who to call, what to do.</li><li><strong>Satisfaction Follow-up</strong> — Sent 48h after completion. Builds trust and catches incomplete work early.</li></ol>', duration:20, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m4.id, title:'Lesson 4.2: Owner Reporting', description:'Build monthly maintenance reports that owners actually value', content_type:'text', text_content:'<h3>Monthly Owner Report</h3><p>The framing is critical: maintenance spending is reported as <strong>asset protection</strong>, not as a cost center. This reframe changes how owners perceive every dollar spent.</p><h3>Report Structure</h3><ul><li><strong>Activity Summary</strong> — Jobs completed, in progress, and pending</li><li><strong>Financial Summary</strong> — Spending by category and by property</li><li><strong>Key Metrics</strong> — Response time, resolution time, open items</li><li><strong>Notable Items</strong> — Issues requiring owner attention or decision</li><li><strong>Forward-Looking</strong> — Upcoming maintenance needs, seasonal preparation, capital planning</li></ul><p>Owners who receive consistent, professional reporting trust you more, question invoices less, and renew management agreements at higher rates.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m4.id, title:'Lesson 4.3: Unit-Level Maintenance History', description:'Build documentation that protects you legally and financially', content_type:'text', text_content:'<h3>Building Unit-Level Maintenance History</h3><p>Every completed job updates the unit record with: what was done, who did it, when, what it cost, and photographic evidence.</p><h3>Why This Matters Long-Term</h3><p>Over time, this creates a maintenance history that supports:</p><ul><li><strong>Insurance Claims</strong> — Timestamped documentation of condition and repairs</li><li><strong>Legal Protection</strong> — Evidence of maintenance standards and response times</li><li><strong>Refinancing</strong> — Demonstrated property care supports valuations</li><li><strong>Property Sales</strong> — Due diligence documentation for buyers</li><li><strong>Capital Planning</strong> — Historical data informs replacement schedules and budgets</li></ul><h3>The Key Principle</h3><p>Documentation must happen as part of the workflow, not as a separate step. If it depends on someone remembering, it will be inconsistent. If it is built into the process — photos required before marking a job complete — it becomes automatic.</p>', duration:15, sort_order:2, is_free_preview:false });

  // Module 5: Emergency Protocols and Financial Tracking
  const mc_m5 = DB.insert('modules', { course_id:mc.id, title:'Module 5: Emergency Protocols & Financial Tracking', description:'Prepare for the worst and track the numbers that matter.', sort_order:4 });
  DB.insert('lessons', { module_id:mc_m5.id, title:'Lesson 5.1: Emergency Response SOP', description:'Build a complete emergency standard operating procedure', content_type:'text', text_content:'<h3>Emergency Response SOP</h3><p>This goes deeper than the free Emergency Response Guide. You will build a complete SOP that includes:</p><ul><li><strong>Emergency Classification Criteria</strong> — Specific definitions with examples</li><li><strong>Pre-approved Emergency Contractors</strong> — By trade, with primary and backup contacts</li><li><strong>Escalation Procedures</strong> — What happens when the PM cannot be reached</li><li><strong>Pre-authorized Spending Limits</strong> — Documented authority for emergency stabilization</li><li><strong>Communication Protocols</strong> — Who gets notified, in what order, through what channel</li><li><strong>Documentation Requirements</strong> — What to capture during and after the event</li><li><strong>Post-Emergency Review</strong> — Debrief process to improve the protocol</li></ul><p>Emergencies reveal whether you have a system or just think you do. Build the SOP before the 2 AM call comes.</p>', duration:20, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m5.id, title:'Lesson 5.2: Emergency Authorization Framework', description:'Get written emergency authority from owners before you need it', content_type:'text', text_content:'<h3>Emergency Authorization Framework</h3><p>Having written emergency authority from property owners <strong>before</strong> an emergency occurs is both a legal and operational necessity.</p><h3>The Authorization Form Establishes:</h3><ul><li>The PM\'s authority to act during emergencies</li><li>The scope and limits of that authority</li><li>The owner\'s financial responsibility for emergency costs</li><li>Documentation and communication commitments</li><li>Conditions under which emergency authority applies</li></ul><h3>How to Present This to Owners</h3><p>Frame it as mutual protection: "This document protects both of us. It ensures I can act quickly when your property is at risk, and it gives you clear boundaries on what I can and cannot authorize without your approval."</p><p>Most owners appreciate the professionalism. The ones who resist usually come around after their first emergency where delayed action caused additional damage.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:mc_m5.id, title:'Lesson 5.3: Maintenance Budget Tracking', description:'Connect maintenance activity to budgeting and owner reporting', content_type:'text', text_content:'<h3>Maintenance Budget Tracking</h3><p>The Budget Tracking system tracks spending across four dimensions:</p><ul><li><strong>By Property</strong> — Total maintenance spend per asset</li><li><strong>By Unit</strong> — Identify units with disproportionate maintenance costs</li><li><strong>By Trade Category</strong> — Plumbing, electrical, HVAC, general — where is the money going?</li><li><strong>By Month</strong> — Seasonal patterns, anomalies, and trends</li></ul><h3>What to Track</h3><ul><li>Variance against budget — are you over or under?</li><li>Year-over-year comparison — is spending trending up or down?</li><li>Anomaly detection — sudden spikes that may indicate systemic issues</li></ul><h3>Using the Data</h3><p>This data powers owner reports, budget planning conversations, and capital expenditure forecasting. A PM who can show an owner that maintenance spending decreased 15% year-over-year while response times improved is a PM who keeps that management agreement.</p>', duration:15, sort_order:2, is_free_preview:false });

  // --- 3 FREE RESOURCES from PDFs ---
  DB.insert('resources', { title:'Emergency Maintenance Response Guide', description:'A structured decision framework for classifying, responding to, and documenting maintenance emergencies. Covers emergency classification, common situations with immediate actions, the 6-step response protocol, and a post-emergency checklist. Print it and keep it accessible.', type:'guide', content:'<h3>Emergency Maintenance Response Guide</h3><p>Emergencies reveal whether you have a system or just think you do. This guide gives you a structured decision framework for classifying, responding to, and documenting maintenance emergencies.</p><h3>Step 1: Classify the Situation</h3><p>Before you act, classify. Ask three questions:</p><ol><li><strong>Is there active damage happening right now?</strong> Water flowing, fire burning, gas leaking, structure failing.</li><li><strong>Is there an immediate risk to safety or habitability?</strong> No heat in freezing conditions, electrical hazard, sewage backup.</li><li><strong>Will the situation materially worsen if delayed 24 hours?</strong> A slow leak becomes a flood.</li></ol><p><strong>Yes to any = EMERGENCY</strong> (immediate). No to all but impacts use = <strong>URGENT</strong> (24h). No to all = <strong>ROUTINE</strong> (5-10 days).</p><h3>Step 2: Emergency Response Protocol</h3><ol><li><strong>Ensure Safety</strong> — Evacuate if necessary. Call 911 for fire, gas, or structural danger.</li><li><strong>Mitigate Damage</strong> — Shut off water, gas, or breaker. Stop the bleeding, not perform surgery.</li><li><strong>Contact Emergency Contractor</strong> — Call pre-approved vendor. Use backup if unavailable.</li><li><strong>Attempt Owner Contact</strong> — Call, text, email. Document timestamps. Do not delay mitigation waiting for approval.</li><li><strong>Limit Scope</strong> — Stabilization and temporary repairs only. No reconstruction without owner approval.</li><li><strong>Document Everything</strong> — Photos, timestamps, contractor reports, cost estimates. Essential for insurance claims.</li></ol><h3>Post-Emergency Checklist (24-48h)</h3><ul><li>Compile all documentation: photos, reports, timelines, communication logs</li><li>Send written summary to property owner with actions and costs</li><li>Notify insurer if damage may result in a claim</li><li>Follow up with affected tenants on habitability</li><li>Update unit maintenance history</li><li>Debrief: what worked, what was slow, what needs to change</li></ul>', category:'all', tags:'emergency,maintenance,guide', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Maintenance Operations Self-Assessment', description:'Score your current maintenance systems across 6 categories and 30 questions. Identify exactly where coordination gaps are costing you time, money, and tenant satisfaction. Takes about 10 minutes to complete.', type:'guide', content:'<h3>Maintenance Operations Self-Assessment</h3><p>Score yourself from 1 (not in place) to 5 (fully operational) on each statement. Be honest — this only helps if it reflects reality, not aspiration.</p><h3>Section 1: Request Management</h3><ul><li>All requests arrive through a single, defined channel</li><li>Every request is logged with timestamp, description, photos, and unit ID</li><li>Tenants can submit requests without calling or texting you personally</li><li>You can see every open request in one place</li><li>No request has been lost in the past 90 days</li></ul><h3>Section 2: Triage and Approval</h3><ul><li>Clear written definition of emergency vs. urgent vs. routine</li><li>Defined approval process with dollar thresholds</li><li>Approvals happen within 24 hours for non-emergency</li><li>Owners can see and approve without you as middleman</li><li>No requests sitting in limbo waiting for decisions</li></ul><h3>Section 3: Contractor Coordination</h3><ul><li>Preferred contractor for every major trade category</li><li>Every contractor has verified current insurance and licensing</li><li>Contractors receive clear scope, access instructions, and timeline</li><li>Updates come through a defined channel, not random texts</li><li>You know status of every active job without calling to ask</li></ul><h3>Section 4: Documentation</h3><ul><li>Every completed job has photos, description, and invoice attached</li><li>Complete maintenance history for any unit in under 2 minutes</li><li>Documentation happens automatically as part of workflow</li><li>Records include timestamps, contractor ID, and approval history</li><li>Documentation would hold up in insurance or legal inquiry</li></ul><h3>Section 5: Communication & Visibility</h3><ul><li>Tenants get status updates without calling to ask</li><li>Owners can see work without requesting reports</li><li>No duplicated communication across channels</li><li>Someone else can see all active maintenance without your help</li><li>Less than 30% of time spent on follow-ups and status checks</li></ul><h3>Section 6: Financial Tracking</h3><ul><li>Know exact maintenance spend per property this year</li><li>Tracked by unit, trade category, and month</li><li>Can compare costs period over period</li><li>Regular financial reports with maintenance context</li><li>Budget with real-time actual tracking</li></ul><h3>Interpreting Your Score (/150)</h3><p><strong>120-150:</strong> Strong operations. Focus on optimization and scaling.<br><strong>90-119:</strong> Solid foundation with gaps. Your weak sections show where you are losing time.<br><strong>60-89:</strong> Functional but fragile. Systems depend on personal effort rather than process.<br><strong>Below 60:</strong> Rebuilding required. You need coordination infrastructure.</p>', category:'all', tags:'assessment,maintenance,self-evaluation', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'The First 90 Days: PM Operational Checklist', description:'Whether stepping into your first PM role, taking over a new portfolio, or launching your own business, this checklist covers the operational foundations for Days 1-30, 31-60, and 61-90 that experienced PMs wish they had on day one.', type:'guide', content:'<h3>The First 90 Days: PM Operational Checklist</h3><h3>Days 1-30: Build Your Foundation</h3><h4>Property & Portfolio Setup</h4><ul><li>Walk every property. Document condition with photos and notes.</li><li>Collect and organize all existing leases. Note expiry dates and special clauses.</li><li>Identify all tenants. Create contact list with unit numbers and lease dates.</li><li>Obtain copies of all property insurance policies.</li><li>Review existing maintenance records and outstanding work orders.</li><li>Locate all building system info: HVAC schedules, boiler service, roof warranty.</li></ul><h4>Vendor & Contractor Setup</h4><ul><li>Identify current contractors. Collect names, contact info, trade categories.</li><li>Verify insurance and licensing for every active contractor.</li><li>Establish preferred vendor list: plumbing, electrical, HVAC, general, roofing.</li><li>Set clear communication expectations with each contractor.</li><li>Establish payment terms. Contractors who know when they get paid perform better.</li></ul><h4>Legal & Compliance</h4><ul><li>Read your province\'s residential tenancy legislation.</li><li>Understand security deposit rules.</li><li>Review notice requirements for entry, inspections, rent increases.</li><li>Confirm errors and omissions insurance if managing for third-party owners.</li></ul><h3>Days 31-60: Build Your Systems</h3><h4>Maintenance Workflow</h4><ul><li>Establish a single channel for maintenance requests.</li><li>Define triage process: urgent, non-urgent, emergency.</li><li>Set approval thresholds with owners.</li><li>Create standard process for contractor assignment and sign-off.</li><li>Establish documentation standards: photos, timestamps, invoices.</li><li>Define your emergency protocol.</li></ul><h4>Tenant Communication</h4><ul><li>Introduce yourself to every tenant in writing.</li><li>Set clear expectations for maintenance request submission.</li><li>Establish and communicate response time standards.</li><li>Create templates for common communications.</li></ul><h4>Financial Setup</h4><ul><li>Set up rent collection — automate where possible.</li><li>Create operating budget per property with maintenance reserves.</li><li>Establish late payment policy.</li><li>Set up monthly financial reporting for owners.</li><li>Track all maintenance spending by unit, category, and month.</li></ul><h3>Days 61-90: Optimize & Stabilize</h3><h4>Operational Review</h4><ul><li>Review all maintenance requests from past 60 days. Identify patterns.</li><li>Evaluate contractor performance against expectations.</li><li>Assess your response times against communicated standards.</li><li>Review documentation completeness.</li><li>Identify deferred maintenance. Create prioritized plan.</li></ul><h4>Relationship Building</h4><ul><li>Share 90-day summary with property owners.</li><li>Follow up with tenants on resolved maintenance requests.</li><li>Meet with top contractors. Strengthen relationships.</li><li>Ask for feedback from owners, tenants, and contractors.</li></ul><h4>Planning Ahead</h4><ul><li>Create 6-month maintenance forecast.</li><li>Identify upcoming lease renewals. Start early.</li><li>Evaluate if your systems are scaling.</li><li>Set operational priorities for the next quarter.</li></ul>', category:'all', tags:'checklist,beginner,new-pm,operations', created_at:new Date().toISOString() });
