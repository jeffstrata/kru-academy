  // ---- Module 5 of Course 2: Practical Tenant Management ----
  const c2_m5 = DB.insert('modules', { course_id:c2.id, title:'Practical Tenant Management', description:'The operational playbook for finding, vetting, installing, and managing tenants. Covers listing strategy, showing protocol, application analysis, lease execution, and move-in procedure. Built from patterns eviction specialists see when tenancies fail.', sort_order:4 });

  DB.insert('lessons', { module_id:c2_m5.id, title:'Lesson 5.1: Writing the Right Ad and Attracting the Right Applicant', description:'Your listing is your first filter. Learn how to write rental ads that attract quality applicants before the first showing.', content_type:'text', duration:12, sort_order:0, is_free_preview:true, text_content:
    '<h3>Governing Legislation</h3>' +
    '<p>This module draws on Alberta\'s core landlord-tenant legislative framework. Familiarity with these documents underpins every practice covered in the lessons ahead:</p>' +
    '<ul>' +
    '<li><strong>Residential Tenancies Act (RTA)</strong> — the primary governance document for all landlord-tenant matters in Alberta. Critical sections: 9–16 (lease formation and terms), 19–24 (obligations and rent), 43–47 (notices and termination)</li>' +
    '<li><strong>RTA Handbook</strong> — the Service Alberta plain-language guide to the RTA</li>' +
    '<li><strong>Condo Act (Alberta)</strong> — additional governance for condominium properties</li>' +
    '<li><strong>Innkeepers Act</strong> — relevant for short-term and transient accommodations</li>' +
    '<li><strong>Civil Enforcement Act</strong> — the enforcement mechanism for RTDRS orders and court judgments</li>' +
    '<li><strong>Ministerial Regulation Sections 1–4</strong> — prescribe the forms, timelines, and procedures required under the RTA</li>' +
    '</ul>' +
    '<h3>Your Listing Is Your First Filter</h3>' +
    '<p>The quality of your applicant pool is determined before the showing, not during it. A vague, generic ad attracts vague, generic applicants. A specific, well-written listing attracts tenants who read carefully, follow instructions, and self-select because the property genuinely matches their needs and situation.</p>' +
    '<div class="content-callout"><strong>Key principle:</strong> Your listing is not a description of the property. It is a job posting for the role of tenant. Write it accordingly.</div>' +
    '<h4>State Who the Property Is For</h4>' +
    '<p>Be specific about the tenant profile this property suits. If the unit is ideal for a working professional, say so. If it is a family-friendly property near schools and parks, describe that. If it is a quiet building suited for single occupants, set that expectation upfront. You are not excluding anyone — you are describing the fit. Tenants who identify with your description self-select in; those who do not, self-select out.</p>' +
    '<p>Know your demographics. A unit near a university will attract students regardless of how you write the ad. A three-bedroom near parks and schools draws families. Write the listing for the tenant the property actually suits, and mismatches reduce before the first inquiry arrives.</p>' +
    '<h4>Describe the Neighbourhood From the Tenant\'s Perspective</h4>' +
    '<p>Tenants are not just renting a unit — they are choosing a location. Proximity to transit, schools, grocery stores, employment hubs, and entertainment matters. Describe it specifically. A tenant who values walkability and works downtown will respond to "two blocks from the LRT and a 15-minute commute to the core." Give them enough information to know whether this location serves their life — so the applicants who book a showing are already a good geographic fit.</p>' +
    '<h4>State Your Non-Negotiables Upfront</h4>' +
    '<p>Be direct about the rules that will appear in the lease: no smoking policy, pets, quiet hours, guest rules. These are not punitive conditions — they are fair expectations that belong in the listing so applicants who cannot comply do not waste your time or theirs. Discovering incompatible tenants at move-in is an entirely preventable problem.</p>' +
    '<h4>Use Quality Photos and Video</h4>' +
    '<p>Poor photos attract unserious applicants. An applicant who accepts blurry, dark photos of a unit they are considering as their home does not have high standards for where they live — and that standard correlates directly with how they will treat your property. Professional-quality photos and a short video walkthrough attract applicants who are genuinely interested in the specific unit, which filters casual inquiries before they consume your time.</p>' +
    '<h4>Require Text or Email Inquiry</h4>' +
    '<p>Do not list a phone number for direct calls. Require applicants to text or email their inquiry. This is a simple but effective filter: an applicant who cannot follow a straightforward instruction in a listing will not follow lease terms. It also gives you a written record of the first contact, time to evaluate before responding, and a baseline for consistency checking later in the process.</p>' +
    '<h4>Set Rent at the Right Market Rate</h4>' +
    '<p>Pricing too low attracts desperation — applicants who cannot qualify elsewhere. Pricing too high attracts only those with no other options. Both are screening failures disguised as pricing decisions. Research comparable units actively listed in the same neighbourhood, bedroom count, and condition. Your rent should sit at market: competitive enough to generate qualified interest without attracting the bottom of the applicant pool.</p>' +
    '<div class="content-warning"><strong>Important:</strong> A vacancy held for one or two months while waiting for the right tenant costs far less than installing the wrong tenant and spending a year managing the consequences. Do not rush the listing to fill the unit.</div>'
  });

  DB.insert('lessons', { module_id:c2_m5.id, title:'Lesson 5.2: The Showing — What to Observe and What to Avoid', description:'Structure the showing as an evaluation, not a sales presentation. Learn what to watch for, what not to do, and how to stay safe.', content_type:'text', duration:15, sort_order:1, is_free_preview:false, text_content:
    '<h3>The Showing Is an Evaluation — In Both Directions</h3>' +
    '<p>By the time an applicant arrives for a showing, they have passed your listing filter. They read the ad, followed your inquiry instructions, and scheduled a viewing. Now you have 20–30 minutes to observe, ask questions, and gather information that will inform your screening decision. Approach the showing as a structured evaluation, not a sales presentation of the unit\'s features.</p>' +
    '<h4>Meet at the Curb, Not at the Door</h4>' +
    '<p>Arrive early and greet the applicant outside before they enter the building. Observe before you invite them in. How they arrive tells you something. What the inside of their vehicle looks like tells you something. Whether they are composed and punctual, or rushed and apologetic, tells you something. These are the same signals you would register in any business meeting. You are not judging the person — you are paying attention to observable patterns that are consistently predictive of how someone manages their environment.</p>' +
    '<h4>Ask Consistent Questions and Listen for Consistency</h4>' +
    '<p>You likely spoke to this applicant during the inquiry stage. At the showing, revisit some of the same questions: How long have you been at your current address? What is your current employment situation? What is driving your move? You are not re-interviewing them from scratch — you are checking whether the story holds. If the details change between the phone call and the showing, the application has a problem.</p>' +
    '<p>Listen carefully. People tell you who they are if you pay attention. The applicant who complains about their current landlord, their neighbours, and the condition of their current unit is giving you information about how they engage with housing situations generally. Note it.</p>' +
    '<h4>Answer Questions With Questions</h4>' +
    '<p>Rather than defending the property or rushing to close the showing, respond to applicant questions by learning what matters to them. If they ask about parking, ask whether they have one vehicle or two. If they ask about storage, ask what they need to store. This keeps you in the listening role and reveals priorities and lifestyle signals you can factor into your screening decision.</p>' +
    '<p>Watch where they go in the unit. What features draw their attention first tells you about their priorities. Someone who immediately checks storage space and closet depth has different concerns than someone who focuses on natural light and outdoor access.</p>' +
    '<h3>What Not to Do at a Showing</h3>' +
    '<div class="content-warning"><strong>Do not appear desperate.</strong> A vacant unit creates pressure to fill it quickly, but desperation is visible and it attracts tenants who exploit it. Present the unit professionally regardless of how long it has been vacant.</div>' +
    '<ul>' +
    '<li><strong>Do not accept money or make commitments on the spot.</strong> Take the application, go home, and run the full process. An applicant who pressures you to accept payment or commit at the door is applying tactics that will not stop at lease signing.</li>' +
    '<li><strong>Do not trust documents presented on-site.</strong> Any paperwork — pay stubs, reference letters, bank statements — must be verified independently. Documents shown at a showing have not been verified through independent sources.</li>' +
    '<li><strong>Do not agree to a tenant doing repairs in exchange for reduced rent.</strong> This arrangement creates liability issues, quality disputes, and complications under the RTA. If repairs are needed before possession, coordinate them yourself.</li>' +
    '<li><strong>Do not let one prospect monopolize your time.</strong> If you have scheduled multiple viewings, keep to the schedule. This signals genuine interest in the unit and is respectful to all applicants.</li>' +
    '</ul>' +
    '<h3>Personal Safety at Showings</h3>' +
    '<p>Showings present real personal safety considerations, particularly for vacant properties and evening appointments. These precautions are not paranoia — they are standard practice among experienced landlords and property managers:</p>' +
    '<ul>' +
    '<li><strong>Bring someone with you</strong> whenever possible, especially for vacant unit showings or appointments scheduled in the evening</li>' +
    '<li><strong>Watch for adults gathering behind you.</strong> If additional people arrive who were not part of the original inquiry, pay close attention to where they position themselves during the showing</li>' +
    '<li><strong>Trust your instincts.</strong> If something feels wrong — the applicant\'s behaviour, unexpected individuals present, or a general sense of discomfort — end the showing professionally and leave</li>' +
    '<li><strong>Your safety is the priority.</strong> No property decision, however urgent the vacancy, justifies putting yourself in an unsafe situation</li>' +
    '</ul>' +
    '<div class="content-callout"><strong>Key principle:</strong> End the showing by handing the applicant an application form — not a verbal commitment. Tell them you are reviewing all applications over the next 24–48 hours and will be in touch. This keeps you in control of the process and the timeline.</div>'
  });

  DB.insert('lessons', { module_id:c2_m5.id, title:'Lesson 5.3: Analyzing the Application', description:'Run a consistent five-step verification process on every application — and know what red flags to watch for.', content_type:'text', duration:15, sort_order:2, is_free_preview:false, text_content:
    '<h3>The Application Form Is Not Optional</h3>' +
    '<div class="content-stat"><div class="stat-num">85%</div><div class="stat-text">of landlords do not use an application form. They rely on conversation, gut feeling, and informal vetting — with no documented process, no consistent criteria, and no evidence trail if a dispute reaches the RTDRS.</div></div>' +
    '<p>If the applicant seemed like a good fit at the showing, hand them an application form before they leave. The form collects the information you need to verify identity, employment, rental history, and references. Without it, you have no consistent, defensible screening process.</p>' +
    '<h3>The Five-Step Verification Process</h3>' +
    '<h4>Step 1: Call the Former Landlord</h4>' +
    '<p>This is the single most important verification call you will make. Introduce yourself as a prospective landlord and ask the one question that matters above all others: <strong>"Would you rent to this person again?"</strong></p>' +
    '<p>Listen for hesitation. A pause before the answer is an answer. A reference who says "yes, absolutely" without hesitation is different from one who says "well, they always paid rent eventually." Listen for tone, qualifications, and what is not said. A former landlord who will only confirm dates of tenancy — and nothing more — is communicating something worth noting.</p>' +
    '<h4>Step 2: Independent Employment Verification</h4>' +
    '<p>Do not use the phone number the applicant provided for employer verification. Look up the employer\'s contact information independently — search the company name, find the main office number, and call HR or the front desk directly. Ask to confirm that the applicant is currently employed and their tenure with the company. You do not need income details. You need confirmation of employment status and stability.</p>' +
    '<p>An applicant who lists a friend as their employer — or who provides a number that routes back to their own phone — will not pass independent verification. That is precisely the point of the process.</p>' +
    '<h4>Step 3: Pull and Review the Credit Report</h4>' +
    '<p>A credit score is one data point. The payment behaviour history is the story. When reviewing the report, look at: the full payment timeline across all accounts, any outstanding collections and the type of creditor initiating them, total debt load relative to stated income, and any previous bankruptcies or consumer proposals. A moderate score with consistent on-time payments often tells a stronger story than a high score with recent missed payments.</p>' +
    '<h4>Step 4: Debt Analysis</h4>' +
    '<p>Review credit utilization and recurring payment obligations. An applicant with high stated income and maximized credit lines carries a different risk profile than one with moderate income and a clean payment pattern. As a general guideline, total housing costs should not exceed 35% of gross monthly income. Calculate this against their visible debt obligations before approving the application.</p>' +
    '<h4>Step 5: Social Check</h4>' +
    '<p>Review publicly available social media. This is not about judging the applicant\'s personal life or choices. It is about verifying consistency between how they presented themselves during the inquiry and showing, and how they present themselves publicly. Significant inconsistencies in employment, location, or lifestyle — compared to what the application states — are worth factoring into your decision.</p>' +
    '<h3>Application Red Flags</h3>' +
    '<ul>' +
    '<li><strong>Incomplete application.</strong> Missing fields are not accidental. If an applicant cannot complete a standard form, they will not complete maintenance requests or respect documented lease terms.</li>' +
    '<li><strong>Unsigned application.</strong> An unsigned application is not a legal document. It also signals the applicant is not fully committed to the process.</li>' +
    '<li><strong>Illegible or missing witness information.</strong> A witness who cannot be independently contacted is not a useful reference.</li>' +
    '<li><strong>Missing key identifiers.</strong> No date of birth or SIN raises identity verification concerns and makes credit and background checks impossible.</li>' +
    '<li><strong>Inconsistent answers</strong> between the inquiry call, the showing, and the written application.</li>' +
    '</ul>' +
    '<div class="content-stat"><div class="stat-num">20/80</div><div class="stat-text">20% of all tenants cause 80% of all landlord-tenant problems. The entire purpose of screening is to identify that 20% before they have your keys. A rigorous, consistent five-step verification process is how you do it.</div></div>' +
    '<div class="content-callout"><strong>Key principle:</strong> Apply the same five verification steps to every applicant, every time. Inconsistent screening exposes you to human rights complaints and produces unreliable results.</div>'
  });

  DB.insert('lessons', { module_id:c2_m5.id, title:'Lesson 5.4: The Lease, the Move-In, and the File', description:'Execute the lease correctly, complete every move-in step before releasing keys, and build the file that protects you at the RTDRS.', content_type:'text', duration:15, sort_order:3, is_free_preview:false, text_content:
    '<h3>Use a Fixed-Term Lease</h3>' +
    '<p>Always begin a tenancy with a <strong>fixed-term lease</strong>. A fixed term gives the landlord better control over the tenancy lifecycle. At the end of a fixed term, if the landlord chooses not to renew, no grounds are required — the tenancy simply ends on the agreed date. Periodic tenancies (month-to-month from the start) provide fewer clean exit options if the tenancy does not work out. One-year terms are the standard in Alberta.</p>' +
    '<h4>Property-Specific Addendums</h4>' +
    '<p>Your standard lease must be supplemented with written addendums covering property-specific rules. If the building has a pool, shared laundry, parking rules, HOA requirements, or specific quiet hours, those rules go in a signed addendum. Verbal agreements about smoking, noise, cleanliness standards, and guest policies are unenforceable under the RTA. If it matters to you as a landlord, put it in writing and get a signature acknowledging receipt.</p>' +
    '<h4>Tenant Insurance Requirement</h4>' +
    '<p>Require a minimum <strong>$2 million liability coverage</strong> tenant insurance policy as a condition of tenancy. Include the requirement in the lease and collect the insurance certificate before key release — not after. Tenant insurance protects both parties: the tenant\'s personal property and the landlord\'s exposure if a tenant-caused incident damages the property or injures a third party. This is industry best practice across Canada and takes five minutes for the tenant to arrange.</p>' +
    '<h3>The Move-In Checklist: All Items Done or No Keys</h3>' +
    '<p>Complete every item before releasing keys. No exceptions. If any item is incomplete at the scheduled possession time, reschedule rather than hand over keys to an incomplete process.</p>' +
    '<ol>' +
    '<li><strong>First month\'s rent collected.</strong> Collect at the point of approval to confirm commitment. If the approved applicant backs out after paying, the first month\'s rent is non-refundable under the RTA. This separates committed tenants from uncertain ones.</li>' +
    '<li><strong>Unit prepared to RTA Section 16 standard.</strong> The unit must be clean, inspected, and move-in ready before the tenant takes possession. If the unit is not finished, push the possession date rather than hand over keys to an unready space.</li>' +
    '<li><strong>Security deposit collected.</strong> Collect before giving possession. Maximum one month\'s rent under the Alberta RTA. The deposit must be placed in an interest-bearing trust account within two banking days of receipt.</li>' +
    '<li><strong>Tenant insurance certificate obtained.</strong> Minimum $2 million liability coverage. Verify the policy number and expiry date on the certificate before accepting it.</li>' +
    '<li><strong>Move-in inspection completed.</strong> Complete a written, room-by-room inspection signed by both landlord and tenant. Include date-stamped photographs of every room, appliance, and notable surface. This document is your primary evidence in any deposit dispute at the RTDRS.</li>' +
    '<li><strong>Lease agreement signed.</strong> Review key sections with the tenant before signing: rent amount and due date, notice periods, the maintenance reporting process, the insurance requirement, and any property-specific addendums.</li>' +
    '<li><strong>All pages initialed.</strong> Both landlord and tenant initial every page of the lease. This prevents future claims that pages were added or modified after the signing date.</li>' +
    '<li><strong>Copies distributed.</strong> One complete signed copy to each tenant. One complete copy for your file. File it immediately.</li>' +
    '</ol>' +
    '<h3>Start the File on Day One</h3>' +
    '<div class="content-stat"><div class="stat-num">95%</div><div class="stat-text">of landlords with four or fewer units keep no records. When a dispute arises, they have nothing to present to an eviction specialist or the RTDRS except memory.</div></div>' +
    '<p>Your tenant file should contain: the signed lease and all addendums, the move-in inspection with photographs, a rent ledger showing every payment by date and amount and method, expense invoices related to the unit, all communications of concern (texts, emails, written notices), and documentation of any maintenance requests or complaints.</p>' +

      '<p>Spring is lease renewal season for many Alberta landlords. Tenancies that started in the fall or winter come up for their first or second anniversary, and landlords face a decision: renew on the same terms, propose a rent increase, or let the tenancy convert to month-to-month.</p>' +

      '<p>A spring lease audit is a two-hour investment that can prevent a costly dispute later. Here\'s what to look for.</p>' +

      '<h3>Use the Alberta Standard Lease as Your Baseline</h3>' +
      '<p>The Government of Alberta publishes a standard residential tenancy agreement that reflects current RTA requirements. Even if you\'re not using this exact document, it\'s a useful reference point. Compare your current lease against the standard version and note any significant divergences.</p>' +
      '<p>The standard lease is available through the Alberta government\'s website. It covers the key provisions, explains what is and isn\'t negotiable under the RTA, and flags areas where additional terms may be added.</p>' +

      '<h3>Key Areas to Audit</h3>' +

      '<h4>1. Security Deposit Terms</h4>' +
      '<p>Under the Alberta RTA, the maximum security deposit is one month\'s rent. This limit is frequently misunderstood. Landlords sometimes attempt to collect "first and last month\'s rent" as they might in other provinces, but that practice is not permitted in Alberta. The security deposit cannot exceed one month\'s rent, period.</p>' +
      '<p><strong>What to check in your lease:</strong></p>' +
      '<ul>' +
      '<li>Is the security deposit amount within the legal limit?</li>' +
      '<li>Does the lease specify that the deposit must be held in a separate account?</li>' +
      '<li>Did you provide the tenant with a receipt for the deposit?</li>' +
      '</ul>' +
      '<div class="content-callout">The receipt requirement is often missed. Under the RTA, landlords are required to provide a receipt for the security deposit. Failing to do so can complicate the end-of-tenancy accounting.</div>' +

      '<h4>2. Rent Increase Notice Requirements</h4>' +
      '<p>Under the Alberta RTA, landlords must provide at least <strong>3 months written notice</strong> before a rent increase. This notice period applies to both fixed-term and periodic tenancies.</p>' +
      '<p><strong>What to check:</strong></p>' +
      '<ul>' +
      '<li>Does your lease accurately describe the notice requirement for rent increases, or does it cite a different number?</li>' +
      '<li>Does your standard notice template meet the "written" requirement in terms of how it\'s delivered and confirmed?</li>' +
      '</ul>' +
      '<div class="content-warning"><strong>Common error:</strong> Landlords send a text message or email saying "rent goes up in three months." Under the RTA, written notice has a specific meaning. The safer standard is a dated, written document delivered in a way that creates a record — whether printed and handed to the tenant, emailed with a read receipt, or delivered via a documented channel.</div>' +

      '<h4>3. Notice to Enter</h4>' +
      '<p>Under the RTA, landlords must provide at least <strong>24 hours written notice</strong> before entering a rental premises for non-emergency purposes, such as inspections or repairs. Emergency entry (where there is immediate risk to health or safety) is excepted.</p>' +
      '<p><strong>What to check:</strong></p>' +
      '<ul>' +
      '<li>Does your lease correctly describe the notice to enter requirement?</li>' +
      '<li>Does it specify what "written" means and how notice is to be delivered?</li>' +
      '<li>Does it define the permitted hours of entry consistent with the RTA?</li>' +
      '</ul>' +
      '<p>Under the Act, the permitted hours for entry are generally <strong>8:00 am to 8:00 pm</strong>. Entry outside those hours requires the tenant\'s consent.</p>' +

      '<h4>4. Repair and Maintenance Obligations</h4>' +
      '<p>The RTA places maintenance obligations on landlords regardless of what a lease says. A landlord cannot contract out of the obligation to maintain a rental unit in a state of adequate repair and to comply with applicable health, safety, and housing standards.</p>' +
      '<p><strong>What to check:</strong></p>' +
      '<ul>' +
      '<li>Does your lease define repair obligations in a way that contradicts the RTA? If so, those contradictory clauses are unenforceable.</li>' +
      '<li>Does your lease clearly describe the tenant\'s obligations for minor maintenance — replacing light bulbs, maintaining cleanliness — in a way that is reasonable and consistent with the RTA?</li>' +
      '<li>Does your lease describe the process for reporting maintenance issues? A defined process creates a paper trail that benefits both parties.</li>' +
      '</ul>' +

      '<h4>5. Move-Out Notice Requirements</h4>' +
      '<p>For a periodic (month-to-month) tenancy in Alberta, the tenant is required to provide one full tenancy period of notice to terminate. For monthly tenancies, that\'s one full month\'s notice. The landlord is required to provide <strong>three months notice</strong> to terminate a periodic tenancy (unless the termination is for cause).</p>' +
      '<p><strong>What to check:</strong></p>' +
      '<ul>' +
      '<li>Does your lease accurately describe notice requirements for both tenant and landlord termination?</li>' +
      '<li>Does it distinguish between termination for cause and termination without cause?</li>' +
      '<li>Does it describe the proper format for notice?</li>' +
      '</ul>' +
      '<div class="content-warning"><strong>Common problem:</strong> Leases that say "60 days notice" when the RTA specifies one full tenancy period. For a monthly tenancy, one full tenancy period means notice must be given before the start of the period it\'s intended to cover. Depending on the calendar, this can effectively mean more than 30 days.</div>' +

      '<h4>6. Prohibited Clauses</h4>' +
      '<p>Some clauses that appear in leases are unenforceable because they contradict the RTA. Common examples include:</p>' +
      '<ul>' +
      '<li>Clauses that prohibit tenants from having guests</li>' +
      '<li>Clauses that limit tenant use of common areas beyond what\'s reasonable</li>' +
      '<li>Clauses that require the tenant to waive their right to proper notice before entry</li>' +
      '<li>Clauses that allow the landlord to terminate the tenancy for reasons not permitted under the RTA</li>' +
      '</ul>' +
      '<p>Including these clauses in a lease doesn\'t make them legal. Under the RTA, any provision that purports to waive or reduce a right granted to a tenant is void. Review your lease for clauses that may fall into this category and remove them. A clean lease is a better lease.</p>' +

      '<h3>The Condition Inspection Report</h3>' +
      '<p>The spring audit is also a good time to review your condition inspection reports. Under the RTA, landlords are required to complete a written condition inspection report at the start and end of each tenancy. This document, signed by both parties, is the primary evidence base for any security deposit dispute.</p>' +
      '<p>If you\'ve been using a standardized inspection form consistently, verify that:</p>' +
      '<ul>' +
      '<li>The form captures all relevant areas of the unit</li>' +
      '<li>You have copies signed by the tenant</li>' +
      '<li>The move-in inspection is dated and filed</li>' +
      '</ul>' +
      '<div class="content-callout">If you\'ve been doing inspections informally, or not at all, building this into your process now is one of the highest-ROI improvements you can make. The condition inspection report is often the difference between recovering damages and eating the cost.</div>' +

      '<h3>A Note on Addenda</h3>' +
      '<p>Many landlords use addenda to cover things not addressed in the standard lease: pet policies, parking rules, smoking restrictions, storage assignments. Addenda are generally permitted under the RTA as long as they don\'t contradict the Act\'s provisions.</p>' +
      '<p>Spring is a good time to review your addenda for clarity and enforceability. Vague addenda create disputes. Specific addenda — <em>"the tenant is permitted to keep one cat in the unit; no other pets are permitted without written consent from the landlord"</em> — are more useful than general ones.</p>' +

      '<h3>What to Do If You Find Problems</h3>' +
      '<p>If your lease audit reveals clauses that are incorrect, unenforceable, or contradicted by the current RTA, you have options:</p>' +
      '<ul>' +
      '<li><strong>For current tenancies:</strong> You generally cannot unilaterally change the terms of an existing lease. Changes require mutual agreement. If a clause is simply unenforceable, it\'s void regardless of whether it\'s removed — but update the document going forward.</li>' +
      '<li><strong>For renewals:</strong> A renewal is an opportunity to put a corrected lease in place. Use that opportunity.</li>' +
      '<li><strong>For new tenancies:</strong> Start clean. Use an updated lease that accurately reflects current RTA requirements and your actual practices.</li>' +
      '</ul>' +

      '<h3>The Bigger Picture</h3>' +
      '<p>A lease is not just a legal formality. It\'s the operating agreement for a relationship that may last for years. Landlords who treat it as such — who read it, update it, and ensure it accurately reflects both their obligations and the tenant\'s — have significantly fewer disputes than landlords who sign it once and put it in a drawer.</p>' +
      '<div class="content-formula">' +
      '<div class="formula-text">Two hours now &gt; one RTDRS proceeding later</div>' +
      '<div class="formula-sub">The spring renewal window is the natural time for this work. A lease audit is the highest-leverage legal task a landlord can complete before renewal season starts.</div>' +
      '</div>',
    tags: 'blog,legal,lease,Alberta,RTA,renewal,beginner',
    category: 'all',
    is_published: true,
    created_at: new Date().toISOString()
  });

}

    content:
      '<div class="content-callout"><strong>A question I get often in sales conversations:</strong> "Our property management software has a maintenance module. Why would we use something separate?"<br><br>Fair question. Here is how I think about it.</div>' +

      '<h3>This Is Not a Feature Question. It Is an Architecture Question.</h3>' +
      '<p>Most property management software platforms include a maintenance module. That does not mean maintenance is what they are built for.</p>' +
      '<p>Platforms built around accounting, leasing, and tenant management treat maintenance as an adjacent workflow. It works. It is functional. It captures the request, assigns the vendor, closes the ticket. But it was designed as one of twelve things the system does, not as the thing the system does.</p>' +

      '<h3>The Other Modules Behave Predictably. Maintenance Does Not.</h3>' +
      '<p>Accounting is rules-based and predictable. Leasing follows a defined lifecycle. Tenant management is relational but structured. These workflows were built for software. A platform that handles them well handles them well because the logic is clean and the rules are stable.</p>' +
      '<p>Maintenance is none of these things. It is chaotic, urgent, vendor-dependent, safety-sensitive, and subject to provincial legislation that varies in unforgiving ways. When something breaks at 2 AM in a condo building with 40 units, the coordination layer needs to be purpose-built, not adapted.</p>' +
      '<div class="content-warning"><strong>The real cost of coordination failure is rarely the repair.</strong> It is the ticket that sat too long, the vendor who never got the approval, the emergency that happened outside business hours when no one had a documented protocol, or the legal claim that hinges on a photo that was never taken.</div>' +

      '<h3>Why This Matters for Boards and Operators</h3>' +
      '<p>For governance-minded boards and property management firms, this distinction matters more than it seems. Fiduciary responsibility does not allow for "good enough" when the category carries legal exposure, tenant safety implications, and significant dollar flow.</p>' +
      '<p>The platforms that serve the accounting function well were not designed with that weight in mind. They were designed to process transactions. Maintenance is not a transaction. It is a sequence of high-stakes judgment calls made across multiple parties under time pressure.</p>' +

      '<h3>The Honest Conversation</h3>' +
      '<p>The conversation with a property management firm or condo board is not about replacing their existing stack. It is about recognizing which workflows deserve dedicated tooling.</p>' +
      '<p>Accounting deserves one tool. Leasing deserves another. Maintenance deserves its own. Forcing all three into the same system serves the vendor, not the operator.</p>' +
      '<div class="content-formula"><div class="formula-text">A modern operational stack is built around purpose, not consolidation.</div><div class="formula-sub">The workflows that carry the most risk deserve the most specialized tools.</div></div>' +

      '<h3>Where Kru Fits</h3>' +

      '<p>For boards, operators, and property management firms who have outgrown "good enough" in this category, the conversation starts with recognizing that maintenance is not a minor module of an adjacent system. It is the workflow that most directly determines tenant safety, asset preservation, and legal exposure over time.</p>' +

// ================================================================
const App = {
  state: {
    user: JSON.parse(localStorage.getItem('kru_current_user') || 'null'),
    page: 'home',
    courses: [],
    currentCourse: null,
    currentLesson: null,
    currentQuiz: null,
    quizAnswers: {},
    quizResults: null,
    courseProgress: null,
    showNotifPanel: false,
    showUserMenu: false,
    mobileNav: false,
    quizTimerId: null,
    quizTimeLeft: 0,
    adminTab: 'courses',
    resourceFilter: 'all',
    currentResource: null,
    legalCountry: null,
    legalRegion: '',
    showChatbot: false,
    chatbotStep: 0,
    chatbotProfile: null,
  },

  // Helpers
  esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; },
  timeAgo(d){ const s=Math.floor((Date.now()-new Date(d))/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<604800) return Math.floor(s/86400)+'d ago'; return new Date(d).toLocaleDateString(); },
  toast(msg, type='info'){ const c=document.getElementById('toasts'), t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; c.appendChild(t); setTimeout(()=>t.remove(),4000); },

  go(page, extra={}){
    if(this.state.quizTimerId){ clearInterval(this.state.quizTimerId); this.state.quizTimerId=null; }
    Object.assign(this.state, { page, showNotifPanel:false, showUserMenu:false, mobileNav:false, ...extra });
    // Dynamic SEO: update title and meta description per page
    const seo = {
      'home':            ['Landlord Academy — Canadian Landlord Courses, Guides & Legal Resources', 'Free and premium courses for Canadian landlords. Tenant screening, Alberta RTA compliance, lease execution, maintenance systems, and investment analysis.'],
      'courses':         ['Landlord Courses — Landlord Academy', 'Browse free and paid online courses for Canadian landlords. Topics include Alberta RTA, tenant screening, maintenance, and portfolio scaling.'],
      'resources':       ['Free Landlord Resources & Guides — Landlord Academy', 'Free checklists, guides, and articles for Canadian landlords. Alberta RTA reference, tenant screening, security deposits, RTDRS, and more.'],
      'ebook':           ['Free Landlord Playbook — The New Canadian Landlord Playbook', 'Get your free copy of The New Canadian Landlord Playbook. 9 chapters covering financing, tenant screening, Alberta RTA compliance, and operations setup.'],
      'get-started':     ['Start Here: Become a Property Manager — Landlord Academy', 'Your roadmap to becoming a professional property manager in Canada. Free course, guides, and the Kru platform.'],
      'legal-hub':       ['Canadian Landlord Legal Reference Hub — Landlord Academy', 'Province-by-province guide to Canadian landlord-tenant legislation. Alberta RTA, BC RTA, Ontario RTA, AHRA, PIPA, and RTDRS reference.'],
      'login':           ['Log In — Landlord Academy', 'Log in to your Landlord Academy account to access your courses, certificates, and notes.'],
      'register':        ['Sign Up Free — Landlord Academy', 'Create your free Landlord Academy account and start learning today.'],
      'dashboard':       ['My Dashboard — Landlord Academy', 'Your Landlord Academy learning dashboard.'],
      'my-courses':      ['My Courses — Landlord Academy', 'Your enrolled courses on Landlord Academy.'],
      'course-detail':   [this.state.currentCourse ? this.state.currentCourse.title + ' — Landlord Academy' : 'Course — Landlord Academy', this.state.currentCourse ? this.state.currentCourse.description : 'Landlord Academy course details.'],
      'resource-detail': [this.state.currentResource ? this.state.currentResource.title + ' — Landlord Academy' : 'Resource — Landlord Academy', this.state.currentResource ? this.state.currentResource.description : 'Free landlord resource from Landlord Academy.'],
    };
    const [title, desc] = seo[page] || ['Landlord Academy', 'Canadian landlord training and resources.'];
    document.title = title;
    const metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute('content', desc);
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if(ogTitle) ogTitle.setAttribute('content', title);
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if(ogDesc) ogDesc.setAttribute('content', desc);
    const ogUrl = document.querySelector('meta[property="og:url"]');
    if(ogUrl) ogUrl.setAttribute('content', 'https://landlordacademy.ca/#' + page);

    history.pushState({
      page,
      courseId: this.state.currentCourse ? this.state.currentCourse.id : null,
      lessonId: this.state.currentLesson ? this.state.currentLesson.id : null,
      resourceId: this.state.currentResource ? this.state.currentResource.id : null
    }, title, '#' + page);
    window.scrollTo(0,0);
    this.render();
  },

  // Auth
  login(email, pw){
    const u = DB.find('users', x=>x.email===email && x.password===pw);
    if(!u) return this.toast('Invalid email or password','error');
    DB.update('users', u.id, { last_active: new Date().toISOString() });
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Welcome back, '+u.first_name+'!','success');
    this.go(u.role==='admin'?'admin':'dashboard');
  },
  register(data){
    if(!data.first_name||!data.last_name||!data.email||!data.password) return this.toast('All fields required','error');
    if(DB.find('users', x=>x.email===data.email)) return this.toast('Email already registered','error');
    const u = DB.insert('users', { ...data, role:'student', email_notif:true, sms_notif:true, push_notif:true, created_at:new Date().toISOString(), last_active:new Date().toISOString() });
    DB.insert('notifications', { user_id:u.id, title:'Welcome to Landlord Academy!', message:'Start exploring our courses to build your property management skills.', type:'info', is_read:false, created_at:new Date().toISOString() });
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Welcome to Landlord Academy, '+u.first_name+'!','success');
    this.go('dashboard');
  },
  logout(){ this.state.user=null; localStorage.removeItem('kru_current_user'); this.go('home'); },
  updateProfile(d){
    const u = DB.update('users', this.state.user.id, d);
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Profile updated!','success');
    this.render();
  },

  // Courses
  getCourses(){ return DB.filter('courses', c=>c.is_published); },
  getCourse(id){ return DB.find('courses', c=>c.id===id); },
  getModules(courseId){ return DB.filter('modules', m=>m.course_id===courseId).sort((a,b)=>a.sort_order-b.sort_order); },
  getLessons(moduleId){ return DB.filter('lessons', l=>l.module_id===moduleId).sort((a,b)=>a.sort_order-b.sort_order); },
  getQuizzes(courseId){ return DB.filter('quizzes', q=>q.course_id===courseId); },
  getQuestions(quizId){ return DB.filter('questions', q=>q.quiz_id===quizId).sort((a,b)=>a.sort_order-b.sort_order); },
  getAnswers(qId){ return DB.filter('answers', a=>a.question_id===qId).sort((a,b)=>a.sort_order-b.sort_order); },

  // Enrollment
  isEnrolled(courseId){ return !!DB.find('enrollments', e=>e.user_id===this.state.user?.id && e.course_id===courseId); },
  enroll(courseId){
    if(!this.state.user) return this.go('register');
    const c = this.getCourse(courseId);
    if(this.isEnrolled(courseId)) return this.toast('Already enrolled','error');
    DB.insert('enrollments', { user_id:this.state.user.id, course_id:courseId, payment_status:c.is_free?'free':'pending', payment_amount:c.price, enrolled_at:new Date().toISOString(), completed_at:null });
    DB.insert('notifications', { user_id:this.state.user.id, title:'Enrolled Successfully!', message:'You are now enrolled in "'+c.title+'". Start learning today!', type:'achievement', is_read:false, created_at:new Date().toISOString() });
    if(!c.is_free){ this.go('payment', { paymentCourse:c }); }
    else{ this.toast('Enrolled successfully!','success'); this.render(); }
  },
  pay(courseId){
    DB.update('enrollments', DB.find('enrollments', e=>e.user_id===this.state.user.id && e.course_id===courseId).id, { payment_status:'paid', payment_date:new Date().toISOString() });
    this.toast('Payment successful!','success');
    this.state.currentCourse = this.getCourse(courseId);
    this.go('course-view', { currentLesson:null });
  },

  // Progress
  getProgress(courseId){
    const uid = this.state.user?.id;
    if(!uid) return null;
    const modules = this.getModules(courseId);
    let totalLessons = 0, completedLessons = 0, lessonProgress = {};
    modules.forEach(m=>{ this.getLessons(m.id).forEach(l=>{ totalLessons++; const p=DB.find('lesson_progress', x=>x.user_id===uid&&x.lesson_id===l.id&&x.completed); if(p){ completedLessons++; lessonProgress[l.id]=true; } }); });
    return { totalLessons, completedLessons, progress: totalLessons>0?Math.round(completedLessons/totalLessons*100):0, lessonProgress };
  },
  completeLesson(lessonId){
    const existing = DB.find('lesson_progress', x=>x.user_id===this.state.user.id&&x.lesson_id===lessonId);
    if(existing) DB.update('lesson_progress', existing.id, { completed:true, completed_at:new Date().toISOString() });
    else DB.insert('lesson_progress', { user_id:this.state.user.id, lesson_id:lessonId, completed:true, completed_at:new Date().toISOString() });
    this.toast('Lesson completed!','success');
    this.render();
  },

  // Quiz
  startQuiz(quizId){
    const quiz = DB.find('quizzes', q=>q.id===quizId);
    const attempts = DB.count('quiz_attempts', a=>a.user_id===this.state.user.id&&a.quiz_id===quizId);
    this.state.currentQuiz = quiz;
    this.state.currentQuiz._attempts = attempts;
    this.state.quizAnswers = {};
    this.state.quizResults = null;
    if(quiz.time_limit > 0){
      this.state.quizTimeLeft = quiz.time_limit * 60;
      this.state.quizTimerId = setInterval(()=>{
        this.state.quizTimeLeft--;
        const el = document.getElementById('quiz-timer');
        if(el) el.textContent = Math.floor(this.state.quizTimeLeft/60)+':'+String(this.state.quizTimeLeft%60).padStart(2,'0');
        if(this.state.quizTimeLeft<=0) this.submitQuiz();
      }, 1000);
    }
    this.go('quiz');
  },
  selectAnswer(qId, aId, multi){
    if(multi){
      if(!this.state.quizAnswers[qId]) this.state.quizAnswers[qId]=[];
      const idx=this.state.quizAnswers[qId].indexOf(aId);
      if(idx>-1) this.state.quizAnswers[qId].splice(idx,1); else this.state.quizAnswers[qId].push(aId);
    } else { this.state.quizAnswers[qId]=[aId]; }
    this.render();
  },
  submitQuiz(){
    if(this.state.quizTimerId){ clearInterval(this.state.quizTimerId); this.state.quizTimerId=null; }
    const quiz = this.state.currentQuiz;
    const questions = this.getQuestions(quiz.id);
    let totalPts=0, earnedPts=0, results=[];
    questions.forEach(q=>{
      totalPts+=q.points;
      const correct = DB.filter('answers', a=>a.question_id===q.id&&a.is_correct).map(a=>a.id);
      const user = this.state.quizAnswers[q.id]||[];
      const ok = correct.length===user.length && correct.every(a=>user.includes(a));
      if(ok) earnedPts+=q.points;
      results.push({ questionId:q.id, correct:ok, correctAnswers:correct, userAnswers:user, explanation:q.explanation });
    });
    const score = totalPts>0?Math.round(earnedPts/totalPts*100):0;
    const passed = score>=quiz.passing_score;
    DB.insert('quiz_attempts', { user_id:this.state.user.id, quiz_id:quiz.id, score, passed, created_at:new Date().toISOString() });

    if(quiz.quiz_type==='final_exam' && passed){
      if(!DB.find('certificates', c=>c.user_id===this.state.user.id&&c.course_id===quiz.course_id)){
        const certNum = 'KRU-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
        DB.insert('certificates', { user_id:this.state.user.id, course_id:quiz.course_id, certificate_number:certNum, issued_at:new Date().toISOString() });
        const enr = DB.find('enrollments', e=>e.user_id===this.state.user.id&&e.course_id===quiz.course_id);
        if(enr) DB.update('enrollments', enr.id, { completed_at:new Date().toISOString() });
        DB.insert('notifications', { user_id:this.state.user.id, title:'Congratulations! Certificate Earned!', message:'You earned your Landlord Academy Certificate! #'+certNum, type:'achievement', is_read:false, created_at:new Date().toISOString() });
      }
    }
    this.state.quizResults = { score, passed, totalPts, earnedPts, results, passing_score:quiz.passing_score };
    this.render();
  },

  // COURSE VIEW (learning)
  renderCourseView(){
    const c=this.state.currentCourse; if(!c) return '';
    const modules = this.getModules(c.id);
    const prog = this.getProgress(c.id);
    const quizzes = this.getQuizzes(c.id);
    let lesson = this.state.currentLesson;
    if(!lesson && modules.length){ const lessons=this.getLessons(modules[0].id); if(lessons.length) lesson=lessons[0]; }

    return `<div class="course-layout">
      <div class="course-sidebar">
        <div class="sidebar-header">
          <button class="btn btn-sm btn-outline" onclick="App.state.currentCourse=App.getCourse(${c.id});App.go('course-detail')" style="margin-bottom:12px">&larr; Back to Overview</button>
          <h3 style="font-size:15px">${this.esc(c.title)}</h3>
          ${prog?`<div class="progress-text" style="margin-top:8px">${prog.progress}% complete</div><div class="progress-bar"><div class="fill" style="width:${prog.progress}%"></div></div>`:''}
        </div>
        ${modules.map((m,i)=>{
          const lessons=this.getLessons(m.id);
          return `<div class="module-group">
            <div class="module-title">Module ${i+1}: ${this.esc(m.title)}</div>
            ${lessons.map(l=>{
              const active=lesson&&lesson.id===l.id;
              const done=prog&&prog.lessonProgress[l.id];
              return `<div class="lesson-item ${active?'active':''} ${done?'completed':''}" onclick="App.state.currentLesson=DB.find('lessons',x=>x.id===${l.id});App.render()">
                <span class="check-icon">${done?'&#10003;':''}</span><span>${this.esc(l.title)}</span><span class="duration">${l.duration}m</span>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
        ${quizzes.map(q=>`<div class="module-group"><div class="lesson-item" onclick="App.startQuiz(${q.id})" style="padding:16px 24px">
          <span style="font-size:16px">${q.quiz_type==='final_exam'?'&#127942;':'&#128221;'}</span>
          <span style="font-weight:600">${this.esc(q.title)}</span>
        </div></div>`).join('')}
      </div>
      <div class="course-content">
        ${lesson?this.renderLessonContent(lesson):`<div class="empty-state"><h3>Select a lesson to begin</h3></div>`}
      </div></div>`;
  },

  renderLessonContent(l){
    const done = this.getProgress(this.state.currentCourse.id)?.lessonProgress[l.id];
    let h='';
    if(l.content_type==='youtube'&&l.youtube_url){
      h+=`<div class="video-container"><iframe src="https://www.youtube.com/embed/${this.ytId(l.youtube_url)}" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`;
    } else if(l.content_type==='video'&&l.video_url){
      h+=`<div class="video-container"><video controls src="${this.esc(l.video_url)}"></video></div>`;
    } else if(l.content_type==='social'&&l.social_url){
      h+=`<div class="social-embed"><p style="font-size:48px;margin-bottom:16px">&#128241;</p><p style="margin-bottom:16px">Visit our social media for the latest tips and updates</p><a href="${this.esc(l.social_url)}" target="_blank" rel="noopener">Open Link &#8594;</a></div>`;
    }
    if(l.content_type==='text'&&l.text_content) h+=`<button class="pdf-download-btn" onclick="App.exportPDF('${this.esc(l.title)}','.lesson-content-text')"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download as PDF</button><div class="lesson-content-text">${l.text_content}</div>`;
    h+=`<div style="margin-bottom:24px"><h2 style="font-size:24px;margin-bottom:8px">${this.esc(l.title)}</h2><p style="color:var(--text-mid)">${this.esc(l.description)}</p></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">
        ${!done?`<button class="btn btn-success" onclick="App.completeLesson(${l.id})">&#10003; Mark as Complete</button>`
        :`<span style="color:var(--success);font-weight:600;padding:12px 0">&#10003; Completed</span>`}
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('note-sec').hidden=!document.getElementById('note-sec').hidden">&#128221; Add Note</button>
      </div>
      <div id="note-sec" hidden style="margin-top:20px">
        <div class="card card-body"><h3 style="font-size:16px;margin-bottom:12px">Add a Note</h3>
        <textarea id="note-input" placeholder="Write your notes here..." style="margin-bottom:12px;min-height:100px"></textarea>
        <button class="btn btn-primary btn-sm" onclick="App.saveNote(document.getElementById('note-input').value,${l.id},${this.state.currentCourse.id})">Save Note</button></div>
      </div>`;
    return h;
  },

  // QUIZ
  renderQuizPage(){
    const q=this.state.currentQuiz; if(!q) return '';
    if(this.state.quizResults) return this.renderQuizResults();
    const questions = this.getQuestions(q.id);
    return `<div class="container" style="max-width:800px">
      <div class="quiz-header"><h2>${this.esc(q.title)}</h2>
        <p>${this.esc(q.description)} | Passing: ${q.passing_score}% | Attempt ${(q._attempts||0)+1}/${q.max_attempts||'&#8734;'}</p>
        ${q.time_limit?`<div style="margin-top:12px;font-size:18px;font-weight:700">&#9200; <span id="quiz-timer">${q.time_limit}:00</span></div>`:''}
      </div>
      <div class="quiz-body">
        ${questions.map((question,i)=>{
          const answers = this.getAnswers(question.id);
          const multi = question.type==='multi_select';
          return `<div style="margin-bottom:32px">
            <div class="q-text"><span class="q-number">${i+1}</span><span style="margin-top:4px">${this.esc(question.text)}</span></div>
            ${answers.map(a=>{
              const sel=(this.state.quizAnswers[question.id]||[]).includes(a.id);
              return `<div class="answer-option ${sel?'selected':''}" onclick="App.selectAnswer(${question.id},${a.id},${multi})">
                ${multi?`<span class="answer-checkbox">${sel?'&#10003;':''}</span>`:`<span class="answer-radio"></span>`}
                <span>${this.esc(a.text)}</span></div>`;
            }).join('')}
          </div>`;
        }).join('')}
        <div style="display:flex;gap:12px;justify-content:space-between;margin-top:16px">
          <button class="btn btn-outline" onclick="App.state.currentLesson=null;App.go('course-view')">Cancel</button>
          <button class="btn btn-primary btn-lg" onclick="App.submitQuiz()">Submit Answers</button>
        </div>
      </div></div>`;
  },

  renderQuizResults(){
    const q=this.state.currentQuiz, r=this.state.quizResults;
    const questions = this.getQuestions(q.id);
    return `<div class="container" style="max-width:800px">
      <div class="card" style="text-align:center;padding:48px 32px">
        <div class="results-score ${r.passed?'passed':'failed'}">${r.score}%</div>
        <h2 style="font-size:28px;margin-bottom:8px">${r.passed?'Congratulations!':'Keep Trying!'}</h2>
        <p style="color:var(--text-mid);margin-bottom:8px">You scored ${r.earnedPts} out of ${r.totalPts} points (${r.score}%)</p>
        <p style="color:var(--text-mid);margin-bottom:24px">Passing score: ${r.passing_score}%</p>
        ${r.passed&&q.quiz_type==='final_exam'?`<div style="background:rgba(34,197,94,0.1);border-radius:var(--radius);padding:20px;margin-bottom:24px">
          <p style="font-size:24px;margin-bottom:8px">&#127942;</p><p style="font-weight:600;color:var(--success)">You earned your Landlord Academy Certificate!</p>
          <button class="btn btn-success" style="margin-top:12px" onclick="App.go('certificates')">View Certificate</button></div>`:''}
      </div>
      <h3 style="margin:24px 0 16px">Review Your Answers</h3>
      ${r.results.map((res,i)=>{
        const question = questions[i];
        const answers = this.getAnswers(question.id);
        return `<div class="card card-body" style="margin-bottom:12px">
          <div class="q-text"><span class="q-number" style="background:${res.correct?'var(--success)':'var(--danger)'}">${res.correct?'&#10003;':'&#10007;'}</span>
          <span style="margin-top:4px">${this.esc(question.text)}</span></div>
          ${answers.map(a=>{
            const isCor=res.correctAnswers.includes(a.id), wasSel=res.userAnswers.includes(a.id);
            return `<div class="answer-option ${isCor?'correct':wasSel?'incorrect':''}" style="cursor:default">${isCor?'&#10003;':wasSel?'&#10007;':'&nbsp;&nbsp;'}&nbsp;&nbsp;${this.esc(a.text)}</div>`;
          }).join('')}
          ${res.explanation?`<div class="explanation">${this.esc(res.explanation)}</div>`:''}
        </div>`;
      }).join('')}
      <div style="margin-top:24px;display:flex;gap:12px">
        <button class="btn btn-primary" onclick="App.state.currentLesson=null;App.go('course-view')">Back to Course</button>
        ${!r.passed?`<button class="btn btn-outline" onclick="App.startQuiz(${q.id})">Retry Quiz</button>`:''}
      </div></div>`;
  },

          <span class="cb-icon">&#127968;</span>
          <div><div class="cb-label">Self-Managing Owner (1-5 Units)</div>
            <div class="cb-desc">I own a few properties and handle everything myself — tenants, repairs, the works.</div></div>

      const emojis = { 'aspiring':'&#127793;', 'self-manage-small':'&#127968;', 'self-manage-large':'&#127959;', 'professional':'&#128188;' };

          <h3>&#128075; Hey there! I'm your Landlord Academy Guide</h3>
          <p>Let me help you find the right content for your journey.</p>
          <button class="chatbot-close" onclick="App.closeChatbot()">&times;</button>

          <div style="display:inline-block;background:rgba(100,165,173,0.18);border:1px solid rgba(100,165,173,0.35);color:#80c8cf;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:6px 18px;border-radius:20px;margin-bottom:18px">Landlord Resource</div>
          <h1 style="font-size:clamp(26px,4vw,42px);font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-.02em">Legal Reference Hub</h1>
          <div style="width:56px;height:4px;background:linear-gradient(90deg,#64A5AD,#2e6db4);border-radius:2px;margin:0 auto 20px"></div>
          <p style="color:rgba(255,255,255,0.6);font-size:17px;max-width:580px;margin:0 auto;line-height:1.6">Select your country and region to instantly access the landlord-tenant laws and housing acts that apply to you.</p>
        </div>
      </div>
      <div style="background:#f4f6f8;min-height:60vh">
        <div style="max-width:700px;margin:0 auto;padding:0 20px">
          <div style="background:#fff;border-radius:16px;box-shadow:0 4px 28px rgba(0,0,0,0.09);padding:32px;margin-top:-32px;position:relative;z-index:10">
            <div style="display:flex;gap:12px">${countryBtns}</div>
            ${regionDropdown}
          </div>
        </div>
        <div style="margin-top:40px">${results}</div>
      </div>`;
  },

  exportPDF(title, contentSelector){
    const content = document.querySelector(contentSelector);
    if(!content) return;
    const printWindow = window.open('','_blank');
    printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title} — Landlord Academy</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Jost',sans-serif;color:#1B1B1B;line-height:1.7;padding:48px;max-width:800px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pdf-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:3px solid #3C595D;margin-bottom:32px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:32px;height:32px;background:#3C595D;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}.brand-text{font-weight:700;font-size:14px;color:#3C595D}.url{font-size:12px;color:#6A8A8F}.pdf-title{font-size:28px;font-weight:800;color:#233538;letter-spacing:-0.03em;margin-bottom:8px}.pdf-subtitle{font-size:15px;color:#6A8A8F;margin-bottom:32px;line-height:1.6}h3{color:#233538;font-size:18px;font-weight:700;padding-bottom:10px;border-bottom:2px solid rgba(60,89,93,0.1);margin:28px 0 16px}h4{color:#3C595D;font-size:15px;font-weight:700;padding-left:12px;border-left:3px solid #64A5AD;margin:24px 0 12px}p{margin-bottom:14px;font-size:14px;line-height:1.75}strong{color:#233538}ul,ol{padding-left:22px;margin:14px 0}li{margin:8px 0;font-size:14px;line-height:1.7}.content-callout{background:#f0f7f8;border-left:4px solid #64A5AD;border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:13.5px}.content-warning{background:#FFF3E0;border-left:4px solid #F59E0B;border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#92400E}.content-tip{background:#E8F5E9;border-left:4px solid #22C55E;border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#166534}.content-stat{display:flex;align-items:center;gap:16px;background:#F7F8FA;border-radius:8px;padding:18px;margin:14px 0;border:1px solid #E2E8F0}.stat-num{font-size:32px;font-weight:800;color:#233538;min-width:70px;text-align:center}.stat-text{font-size:13.5px;color:#6A8A8F}.content-step{display:flex;align-items:flex-start;gap:14px;padding:14px;border:1px solid #E2E8F0;border-radius:8px;margin:8px 0}.step-num{width:30px;height:30px;border-radius:50%;background:#3C595D;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}.step-body h5{font-size:14px;color:#233538;margin-bottom:3px}.step-body p{font-size:13px;color:#6A8A8F;margin:0}.content-formula{background:#233538;border-radius:8px;padding:22px;text-align:center;margin:20px 0}.formula-text{font-size:16px;font-weight:700;color:#64A5AD}.formula-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px}.content-bridge{background:#233538;border-radius:8px;padding:18px 22px;margin-top:28px;color:#fff}.content-bridge strong{color:#64A5AD}.content-bridge p{color:rgba(255,255,255,0.75);font-size:13.5px;margin:0}.content-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.content-card{background:#F7F8FA;border:1px solid #E2E8F0;border-radius:8px;padding:14px}.content-card h5{font-size:13px;color:#233538;margin-bottom:4px}.content-card p{font-size:12px;color:#6A8A8F;margin:0}hr.content-divider{height:1px;background:#E2E8F0;border:none;margin:28px 0}.pdf-footer{margin-top:40px;padding-top:20px;border-top:2px solid #E2E8F0;text-align:center;font-size:12px;color:#6A8A8F}.pdf-download-btn,button,.btn{display:none!important}@media print{body{padding:24px}.content-stat,.content-step,.content-callout,.content-warning,.content-tip,.content-card{break-inside:avoid}}</style></head><body><div class="pdf-header"><div class="brand"><div class="brand-icon">LA</div><div class="brand-text">Landlord Academy</div></div><div class="url">landlordacademy.ca</div></div><div class="pdf-title">${title}</div><div class="pdf-subtitle">A Landlord Academy Resource</div>${content.innerHTML}<div class="pdf-footer">Landlord Academy &mdash; landlordacademy.ca &mdash; Powered by Kru<br>&copy; ${new Date().getFullYear()} Landlord Academy. All rights reserved.</div></body></html>`);
    printWindow.document.close();
    setTimeout(()=>{ printWindow.print(); }, 600);
  },

  init(){
    this.initClickHandler();
    // Seed the initial history entry so the first page is part of the back stack
    history.replaceState({ page: this.state.page, courseId: null, lessonId: null, resourceId: null }, '', location.href);
    // Handle browser back / forward
    window.addEventListener('popstate', (e) => {
      if(e.state && e.state.page){
        if(this.state.quizTimerId){ clearInterval(this.state.quizTimerId); this.state.quizTimerId=null; }
        Object.assign(this.state, {
          page: e.state.page,
          showNotifPanel: false, showUserMenu: false, mobileNav: false,
          currentCourse:   e.state.courseId   ? DB.find('courses',   x=>x.id===e.state.courseId)   : null,
          currentLesson:   e.state.lessonId   ? DB.find('lessons',   x=>x.id===e.state.lessonId)   : null,
          currentResource: e.state.resourceId ? DB.find('resources', x=>x.id===e.state.resourceId) : null
        });
        window.scrollTo(0,0);
        this.render();
      }
    });
    this.render();
    // Show chatbot for first-time visitors after a short delay
    if(!localStorage.getItem('kru_chatbot_seen')){
      setTimeout(()=>{ this.state.showChatbot = true; this.render(); }, 1500);
    }
  }
};

App.init();
</script>
