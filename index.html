    const amc_m2 = DB.insert('modules', { course_id:amc.id, title:'Module 2: Preventive Maintenance Programs', description:'Shift from reactive to proactive. Build a preventive schedule that reduces costs, extends asset life, and impresses owners.', sort_order:1 });
    DB.insert('lessons', { module_id:amc_m2.id, title:'Lesson 2.1: Why Preventive Maintenance Changes Your Economics', description:'Understand the real cost difference between reactive and preventive maintenance', content_type:'text', text_content:'<h3>The Economics of Prevention</h3><p>Reactive maintenance is expensive &mdash; not just in dollars, but in time, tenant satisfaction, and the compounding cost of deferred problems. The industry benchmark is that every dollar spent on preventive maintenance saves approximately three dollars in reactive repairs. That ratio varies by property type, but the direction is always the same.</p><h3>Three Ways Prevention Improves Your Numbers</h3><p><strong>1. Emergency call-out premiums disappear.</strong> Emergency contractor rates run 40 to 100 percent above standard rates. A plumber at 11 PM on a Saturday costs significantly more than one scheduled on a Tuesday morning. Reducing genuine emergencies directly reduces contractor spend.</p><p><strong>2. Building systems last longer.</strong> An HVAC unit with annual service and filter changes lasts 15 to 20 years. The same unit neglected runs 8 to 12. On a portfolio scale, that difference in replacement cycles is substantial.</p><p><strong>3. Documentation protects you.</strong> A logged history of inspections, filter replacements, and service dates is evidence of reasonable care. It is your defence against tenant damage claims and liability arguments.</p><h3>Where to Start</h3><p>Most portfolios have more deferred maintenance than the owner realizes. Prioritize the systems most likely to cause a costly failure if neglected: HVAC, water heater, roof drainage, exterior sealing, and appliances approaching end of useful life. These are your first preventive targets.</p>', duration:20, sort_order:0, is_free_preview:true });
    DB.insert('lessons', { module_id:amc_m2.id, title:'Lesson 2.2: Building Your Preventive Maintenance Schedule', description:'Create a 12-month preventive maintenance calendar tailored to your portfolio', content_type:'text', text_content:'<h3>The 12-Month Preventive Calendar</h3><p>A preventive maintenance program is only as good as its schedule. Without date-anchored tasks, good intentions stay intentions. The goal is a written calendar that triggers specific inspections and work at the right time of year.</p><h3>Seasonal Framework for Alberta Portfolios</h3><p><strong>Spring (March&ndash;May):</strong> Exterior inspection after freeze-thaw (foundation, driveway, roof, walkways). Eavestroughs and downspouts cleared. Sump pump tested. Air conditioning start-up and filter change.</p><p><strong>Summer (June&ndash;August):</strong> Landscaping and exterior drainage review. Window and door seal inspection. Common area condition assessment. Attic ventilation check.</p><p><strong>Fall (September&ndash;November):</strong> Furnace and boiler service with filter replacement. Exterior weatherproofing and caulking. Roof inspection before snow season. Water heater and anode rod check. Fireplace and chimney sweep. Outdoor tap winterization.</p><p><strong>Winter (December&ndash;February):</strong> Building envelope monitoring. Attic and ceiling checks for ice dams. Snow and ice management system review. Interior humidity and condensation monitoring.</p><h3>Building Your Property-Specific Calendar</h3><p>Customize the seasonal framework with unit-specific items: appliance ages, roof replacement schedules, elevator service contracts. For each item, record the frequency, the responsible party, the estimated cost, and the documentation requirement. A completed calendar should answer at any point: What needs to happen this month? Who is responsible? How do we confirm it was done?</p>', duration:25, sort_order:1, is_free_preview:false });
    DB.insert('lessons', { module_id:amc_m2.id, title:'Lesson 2.3: Communicating Preventive ROI to Owners', description:'Present your preventive program in terms that earn owner buy-in and budget approval', content_type:'text', text_content:'<h3>The Owner Conversation</h3><p>Preventive maintenance costs money now to save money later. Owners understand this intellectually but often push back when they see the invoice. Your job is to reframe the cost as asset protection, not as a discretionary expense.</p><h3>The Framing That Works</h3><p>Present each preventive item in three parts: what it is, what it costs, and what failure would cost. The third part is what changes the conversation.</p><p>Instead of: "The furnace service is $180."</p><p>Say: "Annual furnace service is $180. It extends the life of a $4,500 system by five or more years and prevents emergency call-outs that run $400 or higher. Missing one service risks the entire heating season for a fraction of the prevention cost."</p><h3>Building the Annual Maintenance Budget</h3><p>A complete preventive maintenance budget for a single-family property in Alberta typically runs 1 to 1.5 percent of property value annually. Present this as a reserve budget, not a guaranteed spend. Unused reserves stay in the property account. This gives owners visibility and control while giving you a framework to act on routine preventive items without approval delays.</p><h3>The Documentation Advantage</h3><p>Owners who see a preventive log with dates, contractor names, and completed items trust their property manager more and question invoices less. Consistent reporting is both a professional credibility signal and a practical tool for property valuation and insurance.</p>', duration:20, sort_order:2, is_free_preview:false });

    // Module 3: Technology and Reporting
    const amc_m3 = DB.insert('modules', { course_id:amc.id, title:'Module 3: Technology and Reporting', description:'Use platform tools and data to run a faster, more transparent maintenance operation.', sort_order:2 });
    DB.insert('lessons', { module_id:amc_m3.id, title:'Lesson 3.1: Platform-Based Maintenance Coordination', description:'How a centralized platform eliminates the friction that costs you time and money', content_type:'text', text_content:'<h3>The Platform Advantage</h3><p>Managing maintenance through a combination of texts, emails, calls, and spreadsheets creates friction at every step. Requests get missed. Updates get lost. Contractors receive incomplete information. Owners ask questions you cannot answer without checking four different places.</p><p>A platform like Kru centralizes the entire flow: request submission, triage, contractor assignment, approval, documentation, and close-out. Every stakeholder sees what they need to see. Nothing falls between channels.</p><h3>What Changes When You Use a Platform</h3><p><strong>Tenants:</strong> Submit requests with photos through one channel. Receive automatic status updates. No longer need to call asking what is happening.</p><p><strong>Contractors:</strong> Receive job assignments with full context &mdash; scope, access instructions, tenant availability, budget cap. Fewer back-and-forth calls before the job starts.</p><p><strong>Owners:</strong> See job status, costs, and documentation without waiting for a report. Approve work above threshold in one step. Review maintenance history by unit or by property.</p><p><strong>You:</strong> All active work in one view. No duplicate data entry. No chasing updates. Status of every request visible without making a call.</p><h3>Making the Transition</h3><p>The biggest barrier to platform adoption is changing the habits of tenants and contractors used to texting you directly. Set a clear start date, communicate the change in advance, and consistently redirect off-channel requests to the platform for the first 60 days. After that, the behavior is typically established.</p>', duration:20, sort_order:0, is_free_preview:false });
    DB.insert('lessons', { module_id:amc_m3.id, title:'Lesson 3.2: Building Your Maintenance Reporting System', description:'Track the right metrics and report in a way that builds owner confidence', content_type:'text', text_content:'<h3>The Metrics That Matter</h3><p>Good maintenance reporting is not a list of completed work orders. It is a clear picture of operational performance that tells owners what is happening with their asset and why they should trust you to manage it.</p><h3>Five Metrics to Track and Report</h3><p><strong>1. Open vs. Closed Requests:</strong> How many requests came in, how many were resolved, and what is outstanding. This tells you and owners whether operations are keeping pace or falling behind.</p><p><strong>2. Average Resolution Time by Category:</strong> Emergency (hours), urgent (business days), routine (calendar days). Improving resolution times over time are evidence of operational improvement.</p><p><strong>3. Cost per Unit per Month:</strong> Total maintenance spend divided by number of units. Benchmark across your portfolio to identify outlier properties. A unit costing three times the portfolio average warrants investigation.</p><p><strong>4. Preventive vs. Reactive Spend Ratio:</strong> As your preventive program matures, preventive spend should increase as a percentage of total, and reactive spend should decrease. This ratio is the clearest evidence your program is working.</p><p><strong>5. Repeat Request Rate:</strong> Requests on the same issue within 90 days of a completed job. Above 10 percent suggests contractor quality issues or patch repairs instead of root-cause fixes.</p><h3>Monthly Reporting Format</h3><p>A one-page monthly summary per property covers: activity (requests in, resolved, open), financial summary (spend by category), key metrics snapshot, and forward-looking items (upcoming preventive work, decisions needed). Consistent format every month is more valuable than a complex report that changes shape each time.</p>', duration:20, sort_order:1, is_free_preview:false });

  // New blog resource: The Move-Out Process
  DB.insert('resources', { title:'The Move-Out Process: Deposits, Disputes, and Documentation in Alberta', description:'A step-by-step guide to move-out inspections, security deposit deductions, Alberta&#39;s deposit return rules, and how to handle RTDRS disputes.', type:'blog', readTime:'14 min read', eyebrow:'PM Academy \u2014 Landlord Fundamentals', location:'Canada \u2014 Alberta Focus', category:'all', tags:'move-out,deposits,documentation,alberta', created_at:new Date().toISOString(), content:'<p>The move-out process is where most landlord-tenant disputes are born. Not because the law is unclear, but because most landlords do not follow a consistent process. They skip the joint inspection, fail to document condition at move-in, estimate rather than itemize deductions, or return the deposit late. Any one of those gaps creates exposure. Together, they create the conditions for a dispute.</p><p>In Alberta, the Residential Tenancies Act sets out specific requirements for inspections, deductions, and deposit timelines. This guide walks through the complete move-out process, step by step, with the documentation practices that hold up at the RTDRS.</p><div class="callout callout-warn"><p class="callout-label">Alberta-Specific Content</p><p>This guide is written for Alberta landlords operating under the Residential Tenancies Act. Rules around deposits, timelines, and dispute resolution differ by province. For other provinces, refer to your applicable tenancy legislation.</p></div><div class="toc-wrap"><h3>What we cover</h3><ol class="toc-list"><li><a href="#step1">Notice requirements and move-out communication</a></li><li><a href="#step2">The joint move-out inspection</a></li><li><a href="#step3">Wear and tear vs. damage</a></li><li><a href="#step4">Calculating and documenting deductions</a></li><li><a href="#step5">Returning the deposit: Alberta&#39;s timeline rules</a></li><li><a href="#step6">Disputes and the RTDRS</a></li></ol></div><div id="step1" class="step-header"><div class="step-number">1</div><h2 class="step-title">Notice Requirements and Move-Out Communication</h2></div><p>Most move-out disputes begin before the tenant leaves. Clear written communication of expectations during the notice period prevents the most common misunderstandings about cleaning standards, key return, and final utility responsibilities.</p><h3>Notice timelines under the Alberta RTA:</h3><table class="decision-table"><thead><tr><th>Tenancy type</th><th>Tenant&#39;s notice</th><th>Landlord&#39;s notice</th></tr></thead><tbody><tr><td>Month-to-month</td><td>1 full tenancy month before the last day</td><td>3 full tenancy months before the last day</td></tr><tr><td>Fixed-term (with end date)</td><td>No notice required &mdash; lease ends on the stated date</td><td>No notice required unless converting to month-to-month</td></tr><tr><td>Weekly tenancy</td><td>1 week minimum</td><td>1 week minimum</td></tr></tbody></table><h3>What to send when you receive notice:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Written acknowledgment of the notice with the confirmed move-out date</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Move-out checklist outlining cleaning and restoration expectations</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Joint inspection scheduling request with proposed date and time</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Key return instructions &mdash; date, method, and contact</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Final utility transfer instructions if utilities are in the tenant&#39;s name</span></li></ul><div id="step2" class="step-header"><div class="step-number">2</div><h2 class="step-title">The Joint Move-Out Inspection</h2></div><p>The joint inspection is the most important step in the move-out process. In Alberta, landlords and tenants both have the right to attend a move-out inspection together. A landlord who makes deductions without conducting a joint inspection &mdash; or without offering the tenant the opportunity for one &mdash; risks losing the ability to enforce those deductions.</p><div class="callout callout-warn"><p class="callout-label">Alberta Law: The Inspection Requirement</p><p>Under the Alberta RTA, a landlord who intends to deduct from a security deposit must conduct a move-out inspection and provide a written inspection report. If the landlord fails to offer the tenant the opportunity to attend a joint inspection, the landlord&#39;s ability to claim deductions may be limited. The inspection report must be completed at or near the end of the tenancy.</p></div><h3>Conducting a thorough move-out inspection:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Bring your move-in condition report and compare room by room</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Take timestamped photos of every room, wall, appliance, and fixture</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Note specific items you intend to deduct for with location and damage type</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Have the tenant review and sign the report &mdash; if they disagree, record their objection in writing</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Collect all keys, fobs, and garage remotes at the inspection</span></li></ul><div class="callout callout-pro"><p class="callout-label">Pro Tip: Video Walk-Through</p><p>A short video walk-through at both move-in and move-out is the strongest documentation you can have. Video captures continuity and ambient condition in ways that photos sometimes miss &mdash; and it is difficult to dispute. Keep files organized by unit and date.</p></div><div id="step3" class="step-header"><div class="step-number">3</div><h2 class="step-title">Wear and Tear vs. Damage: Drawing the Line</h2></div><p>This is the source of most security deposit disputes. Alberta law allows deductions for damage beyond normal wear and tear. It does not allow deductions for the natural aging of the unit that would have happened regardless of the tenancy.</p><div class="pull-quote"><p>The question is not whether something looks worse than when it was new. The question is whether it looks worse than it should, given the length of the tenancy and what normal use would produce.</p></div><table class="decision-table"><thead><tr><th>Item</th><th>Normal wear &amp; tear (landlord absorbs)</th><th>Deductible damage</th></tr></thead><tbody><tr><td>Paint</td><td>Fading, minor scuffs, small nail holes</td><td>Large holes, deep gouges, unauthorized colour changes, stains</td></tr><tr><td>Carpet</td><td>Traffic flattening, sunlight fading, minor wear</td><td>Stains, burns, pet odour damage, torn seams</td></tr><tr><td>Hardwood floors</td><td>Light surface scratches from foot traffic</td><td>Deep gouges, water damage, missing finish from dragged furniture</td></tr><tr><td>Walls</td><td>Small nail holes (1&ndash;2 per wall), minor scuffs near switches</td><td>Large holes, anchor damage, excessive holes, graffiti</td></tr><tr><td>Appliances</td><td>Normal wear consistent with age, light scratches</td><td>Burned elements, broken knobs, interior damage from misuse</td></tr><tr><td>Cleaning</td><td>Normal dust accumulation between professional cleans</td><td>Unit left requiring professional cleaning beyond standard turnover</td></tr></tbody></table><div class="callout callout-info"><p class="callout-label">The Age-Depreciation Principle</p><p>Deductions should reflect the remaining useful life of a damaged item, not its full replacement cost. A carpet installed eight years ago with a ten-year useful life cannot be claimed at full replacement cost &mdash; the deduction should reflect the remaining two years (20 percent of replacement cost). Tribunals apply this principle when assessing disputed claims.</p></div><div id="step4" class="step-header"><div class="step-number">4</div><h2 class="step-title">Calculating and Documenting Deductions</h2></div><p>If deductions are warranted, they must be documented specifically. A line that says "cleaning &mdash; $150" is unlikely to hold up at the RTDRS. A contractor invoice attached to a specific inspection notation showing what was cleaned and why it exceeded normal turnover is a different matter.</p><h3>For each deduction, document:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>The specific item and location (e.g., "master bedroom carpet &mdash; stain approximately 40cm x 60cm near closet")</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Move-in photos showing pre-tenancy condition of that item</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Move-out photos showing the damage</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Contractor quote or invoice for the repair or replacement</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Depreciation calculation if the item was not new at the start of the tenancy</span></li></ul><h3>Common deduction mistakes:</h3><ul class="red-flags"><li><span class="flag-dot"></span>Deducting for items already damaged at move-in (why move-in documentation is non-negotiable)</li><li><span class="flag-dot"></span>Claiming full replacement cost for items with years of useful life already consumed</li><li><span class="flag-dot"></span>Deducting for normal cleaning that is part of standard unit turnover</li><li><span class="flag-dot"></span>Failing to provide receipts or invoices supporting the deduction amount</li><li><span class="flag-dot"></span>Deducting for items not documented during the move-out inspection</li></ul><div id="step5" class="step-header"><div class="step-number">5</div><h2 class="step-title">Returning the Deposit: Alberta&#39;s Timeline Rules</h2></div><p>Alberta law is specific on timing. After the tenancy ends, a landlord must return the security deposit &mdash; or provide a written itemized statement of deductions &mdash; within a set timeline. Missing this deadline can result in losing the right to make any deductions at all.</p><div class="callout callout-warn"><p class="callout-label">Alberta Security Deposit Return Deadlines</p><p>Under the Alberta Residential Tenancies Act, a landlord must return the deposit or provide an itemized statement of deductions within <strong>10 days</strong> of the end of the tenancy if the tenant provided a forwarding address, or within <strong>30 days</strong> if no forwarding address was given. Alberta also caps security deposits at one month&#39;s rent. Landlords who miss these deadlines without a reasonable excuse may forfeit the right to make deductions.</p></div><h3>What the written statement must include:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>The original deposit amount received</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>An itemized list of each deduction with description and amount</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>The balance being returned, or a statement that the full deposit is retained with reasons</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>The method and timeline for returning any remaining balance</span></li></ul><div id="step6" class="step-header"><div class="step-number">6</div><h2 class="step-title">Disputes and the RTDRS</h2></div><p>If a tenant disputes your deductions &mdash; or if you need to pursue damages beyond the deposit &mdash; Alberta&#39;s Residential Tenancy Dispute Resolution Service (RTDRS) is the primary resolution mechanism. It is faster and less formal than Provincial Court, and most deposit disputes can be handled there.</p><div class="callout callout-info"><p class="callout-label">About the RTDRS</p><p>The Residential Tenancy Dispute Resolution Service provides an alternative to court for resolving disputes under the Alberta RTA. Applications can be submitted online. Hearings are conducted by a tenancy dispute officer and typically scheduled within a few weeks of application. Filing fees apply. Decisions are binding and enforceable. Find the application at <a href="https://www.alberta.ca/residential-tenancy-dispute-resolution-service" target="_blank" rel="noopener">alberta.ca/rtdrs</a>.</p></div><h3>What makes a landlord&#39;s RTDRS position strong:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>A signed move-in condition report documenting pre-tenancy condition</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>A signed move-out inspection report with tenant acknowledgment</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Timestamped before-and-after photos for every claimed deduction</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Contractor invoices supporting each deduction amount</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>A timely itemized statement provided within the statutory deadline</span></li></ul><div class="resource-block"><h4>Alberta Move-Out and Deposit Resources</h4><ul class="resource-list"><li><a href="https://www.alberta.ca/security-deposits" target="_blank" rel="noopener">Government of Alberta &mdash; Security Deposits: Rights and Responsibilities</a></li><li><a href="https://www.alberta.ca/residential-tenancy-dispute-resolution-service" target="_blank" rel="noopener">Government of Alberta &mdash; RTDRS Application and Information</a></li><li><a href="https://open.alberta.ca/publications/rta-handbook-for-landlords-and-tenants" target="_blank" rel="noopener">Government of Alberta &mdash; RTA Handbook for Landlords and Tenants</a></li><li><a href="https://www.cplea.ca/questions/security-deposit-rules-alberta/" target="_blank" rel="noopener">Centre for Public Legal Education Alberta &mdash; Security Deposit Rules in Alberta</a></li></ul></div><div class="art-divider"></div><h2>Build the Record Before You Need It</h2><p>The move-out process is straightforward when the documentation exists. Move-in report, photos, inspection report, invoices &mdash; each document makes the next step cleaner. The landlords who end up in disputes are almost always the ones who skipped documentation at the beginning of the tenancy, not the end.</p><p>Make the move-in inspection as thorough as the move-out. Get signatures on both. Keep the records. A 45-minute inspection at move-in costs far less than a contested RTDRS application and the time it takes to see it through.</p><div class="kru-note"><div class="kru-note-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><p><strong>Kru makes move-out documentation part of your maintenance workflow.</strong> Log inspection notes, attach photos, and keep unit condition records alongside your maintenance history &mdash; all in one place. <a href="https://mykru.ca" target="_blank" rel="noopener">Learn more at mykru.ca</a>.</p></div><div class="art-cta"><h3>More landlord guides, every week</h3><p>PM Academy covers the practical side of owning rental property in Canada: tenant screening, maintenance coordination, documentation, and the legal framework that protects you.</p><a href="https://mykru.ca" class="art-cta-btn" target="_blank" rel="noopener">Visit PM Academy at mykru.ca</a></div>' });

// ================================================================
//  APP STATE & CONTROLLER
// ================================================================
const App = {
  state: {
    user: JSON.parse(localStorage.getItem('kru_current_user') || 'null'),
    page: 'home',
    courses: [],
    currentCourse: null,
    currentLesson: null,
    currentQuiz: null,
    quizAnswers: {},
    quizResults: null,
    courseProgress: null,
    showNotifPanel: false,
    showUserMenu: false,
    mobileNav: false,
    quizTimerId: null,
    quizTimeLeft: 0,
    adminTab: 'courses',
    resourceFilter: 'all',
    currentResource: null,
    legalCountry: null,
    legalRegion: '',
    showChatbot: false,
    chatbotStep: 0,
    chatbotProfile: null,
  },

  // Helpers
  esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; },
  timeAgo(d){ const s=Math.floor((Date.now()-new Date(d))/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<604800) return Math.floor(s/86400)+'d ago'; return new Date(d).toLocaleDateString(); },
  toast(msg, type='info'){ const c=document.getElementById('toasts'), t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; c.appendChild(t); setTimeout(()=>t.remove(),4000); },

  go(page, extra={}){
    if(this.state.quizTimerId){ clearInterval(this.state.quizTimerId); this.state.quizTimerId=null; }
    Object.assign(this.state, { page, showNotifPanel:false, showUserMenu:false, mobileNav:false, ...extra });
    window.scrollTo(0,0);
    this.render();
  },

  // Auth
  login(email, pw){
    const u = DB.find('users', x=>x.email===email && x.password===pw);
    if(!u) return this.toast('Invalid email or password','error');
    DB.update('users', u.id, { last_active: new Date().toISOString() });
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Welcome back, '+u.first_name+'!','success');
    this.go(u.role==='admin'?'admin':'dashboard');
  },
  register(data){
    if(!data.first_name||!data.last_name||!data.email||!data.password) return this.toast('All fields required','error');
    if(DB.find('users', x=>x.email===data.email)) return this.toast('Email already registered','error');
    const u = DB.insert('users', { ...data, role:'student', email_notif:true, sms_notif:true, push_notif:true, created_at:new Date().toISOString(), last_active:new Date().toISOString() });
    DB.insert('notifications', { user_id:u.id, title:'Welcome to PM Academy!', message:'Start exploring our courses to build your property management skills.', type:'info', is_read:false, created_at:new Date().toISOString() });
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Welcome to PM Academy, '+u.first_name+'!','success');
    this.go('dashboard');
  },
  logout(){ this.state.user=null; localStorage.removeItem('kru_current_user'); this.go('home'); },
  updateProfile(d){
    const u = DB.update('users', this.state.user.id, d);
    this.state.user = u;
    localStorage.setItem('kru_current_user', JSON.stringify(u));
    this.toast('Profile updated!','success');
    this.render();
  },

  // Courses
  getCourses(){ return DB.filter('courses', c=>c.is_published); },
  getCourse(id){ return DB.find('courses', c=>c.id===id); },
  getModules(courseId){ return DB.filter('modules', m=>m.course_id===courseId).sort((a,b)=>a.sort_order-b.sort_order); },
  getLessons(moduleId){ return DB.filter('lessons', l=>l.module_id===moduleId).sort((a,b)=>a.sort_order-b.sort_order); },
  getQuizzes(courseId){ return DB.filter('quizzes', q=>q.course_id===courseId); },
  getQuestions(quizId){ return DB.filter('questions', q=>q.quiz_id===quizId).sort((a,b)=>a.sort_order-b.sort_order); },
  getAnswers(qId){ return DB.filter('answers', a=>a.question_id===qId).sort((a,b)=>a.sort_order-b.sort_order); },

  // Enrollment
  isEnrolled(courseId){ return !!DB.find('enrollments', e=>e.user_id===this.state.user?.id && e.course_id===courseId); },
  enroll(courseId){
    if(!this.state.user) return this.go('register');
    const c = this.getCourse(courseId);
    if(this.isEnrolled(courseId)) return this.toast('Already enrolled','error');
    DB.insert('enrollments', { user_id:this.state.user.id, course_id:courseId, payment_status:c.is_free?'free':'pending', payment_amount:c.price, enrolled_at:new Date().toISOString(), completed_at:null });
    DB.insert('notifications', { user_id:this.state.user.id, title:'Enrolled Successfully!', message:'You are now enrolled in "'+c.title+'". Start learning today!', type:'achievement', is_read:false, created_at:new Date().toISOString() });
    if(!c.is_free){ this.go('payment', { paymentCourse:c }); }
    else{ this.toast('Enrolled successfully!','success'); this.render(); }
  },
  pay(courseId){
    DB.update('enrollments', DB.find('enrollments', e=>e.user_id===this.state.user.id && e.course_id===courseId).id, { payment_status:'paid', payment_date:new Date().toISOString() });
    this.toast('Payment successful!','success');
    this.state.currentCourse = this.getCourse(courseId);
    this.go('course-view', { currentLesson:null });
  },

  // Progress
  getProgress(courseId){
    const uid = this.state.user?.id;
    if(!uid) return null;
    const modules = this.getModules(courseId);
    let totalLessons = 0, completedLessons = 0, lessonProgress = {};
    modules.forEach(m=>{ this.getLessons(m.id).forEach(l=>{ totalLessons++; const p=DB.find('lesson_progress', x=>x.user_id===uid&&x.lesson_id===l.id&&x.completed); if(p){ completedLessons++; lessonProgress[l.id]=true; } }); });
    return { totalLessons, completedLessons, progress: totalLessons>0?Math.round(completedLessons/totalLessons*100):0, lessonProgress };
  },
  completeLesson(lessonId){
    const existing = DB.find('lesson_progress', x=>x.user_id===this.state.user.id&&x.lesson_id===lessonId);
    if(existing) DB.update('lesson_progress', existing.id, { completed:true, completed_at:new Date().toISOString() });
    else DB.insert('lesson_progress', { user_id:this.state.user.id, lesson_id:lessonId, completed:true, completed_at:new Date().toISOString() });
    this.toast('Lesson completed!','success');
    this.render();
  },

  // Quiz
  startQuiz(quizId){
    const quiz = DB.find('quizzes', q=>q.id===quizId);
    const attempts = DB.count('quiz_attempts', a=>a.user_id===this.state.user.id&&a.quiz_id===quizId);
    this.state.currentQuiz = quiz;
    this.state.currentQuiz._attempts = attempts;
    this.state.quizAnswers = {};
    this.state.quizResults = null;
    if(quiz.time_limit > 0){
      this.state.quizTimeLeft = quiz.time_limit * 60;
      this.state.quizTimerId = setInterval(()=>{
        this.state.quizTimeLeft--;
        const el = document.getElementById('quiz-timer');
        if(el) el.textContent = Math.floor(this.state.quizTimeLeft/60)+':'+String(this.state.quizTimeLeft%60).padStart(2,'0');
        if(this.state.quizTimeLeft<=0) this.submitQuiz();
      }, 1000);
    }
    this.go('quiz');
  },
  selectAnswer(qId, aId, multi){
    if(multi){
      if(!this.state.quizAnswers[qId]) this.state.quizAnswers[qId]=[];
      const idx=this.state.quizAnswers[qId].indexOf(aId);
      if(idx>-1) this.state.quizAnswers[qId].splice(idx,1); else this.state.quizAnswers[qId].push(aId);
    } else { this.state.quizAnswers[qId]=[aId]; }
    this.render();
  },
  submitQuiz(){
    if(this.state.quizTimerId){ clearInterval(this.state.quizTimerId); this.state.quizTimerId=null; }
    const quiz = this.state.currentQuiz;
    const questions = this.getQuestions(quiz.id);
    let totalPts=0, earnedPts=0, results=[];
    questions.forEach(q=>{
      totalPts+=q.points;
      const correct = DB.filter('answers', a=>a.question_id===q.id&&a.is_correct).map(a=>a.id);
      const user = this.state.quizAnswers[q.id]||[];
      const ok = correct.length===user.length && correct.every(a=>user.includes(a));
      if(ok) earnedPts+=q.points;
      results.push({ questionId:q.id, correct:ok, correctAnswers:correct, userAnswers:user, explanation:q.explanation });
    });
    const score = totalPts>0?Math.round(earnedPts/totalPts*100):0;
    const passed = score>=quiz.passing_score;
    DB.insert('quiz_attempts', { user_id:this.state.user.id, quiz_id:quiz.id, score, passed, created_at:new Date().toISOString() });

    if(quiz.quiz_type==='final_exam' && passed){
      if(!DB.find('certificates', c=>c.user_id===this.state.user.id&&c.course_id===quiz.course_id)){
        const certNum = 'KRU-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
        DB.insert('certificates', { user_id:this.state.user.id, course_id:quiz.course_id, certificate_number:certNum, issued_at:new Date().toISOString() });
        const enr = DB.find('enrollments', e=>e.user_id===this.state.user.id&&e.course_id===quiz.course_id);
        if(enr) DB.update('enrollments', enr.id, { completed_at:new Date().toISOString() });
        DB.insert('notifications', { user_id:this.state.user.id, title:'Congratulations! Certificate Earned!', message:'You earned your Property Manager Academy Certificate! #'+certNum, type:'achievement', is_read:false, created_at:new Date().toISOString() });
      }
    }
    this.state.quizResults = { score, passed, totalPts, earnedPts, results, passing_score:quiz.passing_score };
    this.render();
  },

  // Notes
  saveNote(content, lessonId, courseId){
    if(!content.trim()) return;
    DB.insert('notes', { user_id:this.state.user.id, lesson_id:lessonId, course_id:courseId, content, created_at:new Date().toISOString() });
    this.toast('Note saved!','success');
    this.render();
  },
  deleteNote(id){ DB.remove('notes', id); this.render(); },

  adminSendReminder(userId){
    DB.insert('notifications', { user_id:userId, title:'We Miss You!', message:'It has been a while since your last visit. Your courses are waiting for you!', type:'reminder', is_read:false, created_at:new Date().toISOString() });

  adminSendBulk(){

    let sent=0;
    DB.filter('users', u=>u.role==='student'&&new Date(u.last_active)<week).forEach(u=>{
      DB.insert('notifications', { user_id:u.id, title:'We Miss You!', message:'Come back and continue your learning journey at PM Academy!', type:'reminder', is_read:false, created_at:new Date().toISOString() });

  // COURSE DETAIL
  renderCourseDetail(){
    const c=this.state.currentCourse; if(!c) return '';
    const enrolled = this.isEnrolled(c.id);
    const prog = enrolled ? this.getProgress(c.id) : null;
    const modules = this.getModules(c.id);
    const quizzes = this.getQuizzes(c.id);
    let totalLessons=0; modules.forEach(m=>totalLessons+=this.getLessons(m.id).length);
    return `<div style="background:var(--dark);color:#fff;padding:56px 24px">
      <div style="max-width:800px;margin:0 auto">
        <span class="badge badge-${c.difficulty}" style="margin-bottom:12px">${c.difficulty[0].toUpperCase()+c.difficulty.slice(1)}</span>
        <h1 style="font-size:38px;margin-bottom:14px;font-weight:800;letter-spacing:-.02em">${this.esc(c.title)}</h1>
        <p style="font-size:17px;opacity:.6;margin-bottom:24px;line-height:1.6">${this.esc(c.description)}</p>
        <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:14px;opacity:.8;margin-bottom:24px">
          <span>&#128218; ${modules.length} modules</span><span>&#127909; ${totalLessons} lessons</span><span>&#128221; ${quizzes.length} quizzes</span>
        </div>
        ${enrolled?`
          <div style="background:rgba(255,255,255,.15);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:600">Your Progress</span><span>${prog.progress}%</span></div>
            <div class="progress-bar" style="background:rgba(255,255,255,.2)"><div class="fill" style="width:${prog.progress}%"></div></div>
          </div>
          <button class="btn btn-accent btn-lg" onclick="App.state.currentLesson=null;App.go('course-view')">Continue Learning</button>`
        :`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <span style="font-size:28px;font-weight:800">${c.is_free?'Free':'$'+c.price.toFixed(2)}</span>
          ${this.state.user?`<button class="btn btn-accent btn-lg" onclick="App.enroll(${c.id})">${c.is_free?'Enroll Free':'Enroll Now'}</button>`
          :`<button class="btn btn-accent btn-lg" onclick="App.go('register')">Sign Up to Enroll</button>`}

      </div></div>
      <div class="container" style="max-width:800px">
        <h2 style="font-size:24px;margin-bottom:20px">Course Curriculum</h2>
        ${modules.map((m,i)=>{
          const lessons=this.getLessons(m.id);
          return `<div class="card" style="margin-bottom:12px">
            <div class="module-title" style="padding:20px 24px"><span>Module ${i+1}: ${this.esc(m.title)}</span><span style="font-size:13px;color:var(--text-mid)">${lessons.length} lessons</span></div>
            ${lessons.map(l=>`<div class="lesson-item" style="padding:14px 24px 14px 48px">

              <span>${this.esc(l.title)}</span>
              ${l.is_free_preview?'<span class="badge badge-free" style="font-size:10px;padding:2px 8px">Preview</span>':''}
              <span class="duration">${l.duration} min</span>

            <span style="font-size:24px">&#127942;</span><div><strong>${this.esc(q.title)}</strong>
            <div style="font-size:13px;color:var(--text-mid)">${this.esc(q.description)} | Passing: ${q.passing_score}%${q.time_limit?' | '+q.time_limit+' min':''}</div></div>

  // COURSE VIEW (learning)
  renderCourseView(){
    const c=this.state.currentCourse; if(!c) return '';
    const modules = this.getModules(c.id);
    const prog = this.getProgress(c.id);
    const quizzes = this.getQuizzes(c.id);
    let lesson = this.state.currentLesson;
    if(!lesson && modules.length){ const lessons=this.getLessons(modules[0].id); if(lessons.length) lesson=lessons[0]; }

    return `<div class="course-layout">
      <div class="course-sidebar">
        <div class="sidebar-header">
          <button class="btn btn-sm btn-outline" onclick="App.state.currentCourse=App.getCourse(${c.id});App.go('course-detail')" style="margin-bottom:12px">&larr; Back to Overview</button>
          <h3 style="font-size:15px">${this.esc(c.title)}</h3>
          ${prog?`<div class="progress-text" style="margin-top:8px">${prog.progress}% complete</div><div class="progress-bar"><div class="fill" style="width:${prog.progress}%"></div></div>`:''}
        </div>
        ${modules.map((m,i)=>{
          const lessons=this.getLessons(m.id);
          return `<div class="module-group">
            <div class="module-title">Module ${i+1}: ${this.esc(m.title)}</div>
            ${lessons.map(l=>{
              const active=lesson&&lesson.id===l.id;
              const done=prog&&prog.lessonProgress[l.id];
              return `<div class="lesson-item ${active?'active':''} ${done?'completed':''}" onclick="App.state.currentLesson=DB.find('lessons',x=>x.id===${l.id});App.render()">
                <span class="check-icon">${done?'&#10003;':''}</span><span>${this.esc(l.title)}</span><span class="duration">${l.duration}m</span>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
        ${quizzes.map(q=>`<div class="module-group"><div class="lesson-item" onclick="App.startQuiz(${q.id})" style="padding:16px 24px">
          <span style="font-size:16px">${q.quiz_type==='final_exam'?'&#127942;':'&#128221;'}</span>
          <span style="font-weight:600">${this.esc(q.title)}</span>
        </div></div>`).join('')}
      </div>
      <div class="course-content">
        ${lesson?this.renderLessonContent(lesson):`<div class="empty-state"><h3>Select a lesson to begin</h3></div>`}
      </div></div>`;
  },

  renderLessonContent(l){
    const done = this.getProgress(this.state.currentCourse.id)?.lessonProgress[l.id];
    let h='';
    if(l.content_type==='youtube'&&l.youtube_url){
      h+=`<div class="video-container"><iframe src="https://www.youtube.com/embed/${this.ytId(l.youtube_url)}" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`;
    } else if(l.content_type==='video'&&l.video_url){
      h+=`<div class="video-container"><video controls src="${this.esc(l.video_url)}"></video></div>`;
    } else if(l.content_type==='social'&&l.social_url){
      h+=`<div class="social-embed"><p style="font-size:48px;margin-bottom:16px">&#128241;</p><p style="margin-bottom:16px">Visit our social media for the latest tips and updates</p><a href="${this.esc(l.social_url)}" target="_blank" rel="noopener">Open Link &#8594;</a></div>`;
    }
    if(l.content_type==='text'&&l.text_content) h+=`<div class="lesson-content-text">${l.text_content}</div>`;
    h+=`<div style="margin-bottom:24px"><h2 style="font-size:24px;margin-bottom:8px">${this.esc(l.title)}</h2><p style="color:var(--text-mid)">${this.esc(l.description)}</p></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">
        ${!done?`<button class="btn btn-success" onclick="App.completeLesson(${l.id})">&#10003; Mark as Complete</button>`
        :`<span style="color:var(--success);font-weight:600;padding:12px 0">&#10003; Completed</span>`}
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('note-sec').hidden=!document.getElementById('note-sec').hidden">&#128221; Add Note</button>
      </div>
      <div id="note-sec" hidden style="margin-top:20px">
        <div class="card card-body"><h3 style="font-size:16px;margin-bottom:12px">Add a Note</h3>
        <textarea id="note-input" placeholder="Write your notes here..." style="margin-bottom:12px;min-height:100px"></textarea>
        <button class="btn btn-primary btn-sm" onclick="App.saveNote(document.getElementById('note-input').value,${l.id},${this.state.currentCourse.id})">Save Note</button></div>
      </div>`;
    return h;
  },

  // QUIZ
  renderQuizPage(){
    const q=this.state.currentQuiz; if(!q) return '';
    if(this.state.quizResults) return this.renderQuizResults();
    const questions = this.getQuestions(q.id);
    return `<div class="container" style="max-width:800px">
      <div class="quiz-header"><h2>${this.esc(q.title)}</h2>

    } else if(cntry){
      results = `<div style="text-align:center;padding:48px 20px;color:#aaa">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;display:block;margin-left:auto;margin-right:auto"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p style="font-size:16px;font-weight:600;color:#555;margin-bottom:6px">Choose a ${LEGAL_HUB[cntry].regionLabel}</p>
        <p style="font-size:14px">Select your ${LEGAL_HUB[cntry].regionLabel.toLowerCase()} above to view applicable laws</p>
      </div>`;
    } else {
      results = `<div style="text-align:center;padding:48px 20px;color:#aaa">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:14px;display:block;margin-left:auto;margin-right:auto"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg>
        <p style="font-size:16px;font-weight:600;color:#555;margin-bottom:6px">Select your country to get started</p>
        <p style="font-size:14px">Choose Canada or the United States, then pick your province or state</p>
      </div>`;
    }

    return `
      <div style="background:linear-gradient(135deg,#0e2a3d 0%,#193845 50%,#1d4140 100%);padding:80px 0 56px">
        <div class="container" style="padding-top:0;padding-bottom:0;text-align:center">
          <div style="display:inline-block;background:rgba(100,165,173,0.18);border:1px solid rgba(100,165,173,0.35);color:#80c8cf;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:6px 18px;border-radius:20px;margin-bottom:18px">Property Manager Resource</div>
          <h1 style="font-size:clamp(26px,4vw,42px);font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-.02em">Legal Reference Hub</h1>
          <div style="width:56px;height:4px;background:linear-gradient(90deg,#64A5AD,#2e6db4);border-radius:2px;margin:0 auto 20px"></div>
          <p style="color:rgba(255,255,255,0.6);font-size:17px;max-width:580px;margin:0 auto;line-height:1.6">Select your country and region to instantly access the landlord-tenant laws and housing acts that apply to you.</p>
        </div>
      </div>
      <div style="background:#f4f6f8;min-height:60vh">
        <div style="max-width:700px;margin:0 auto;padding:0 20px">
          <div style="background:#fff;border-radius:16px;box-shadow:0 4px 28px rgba(0,0,0,0.09);padding:32px;margin-top:-32px;position:relative;z-index:10">
            <div style="display:flex;gap:12px">${countryBtns}</div>
            ${regionDropdown}
          </div>
        </div>
        <div style="margin-top:40px">${results}</div>
      </div>`;
  },

  init(){
    this.initClickHandler();
    this.render();
    // Show chatbot for first-time visitors after a short delay
    if(!localStorage.getItem('kru_chatbot_seen')){
      setTimeout(()=>{ this.state.showChatbot = true; this.render(); }, 1500);
    }
  }
};

App.init();
</script>
</body>
</html>
