  const frp = DB.insert('courses', { title:'Your First Rental Property in Canada', description:'Everything you need to know before buying your first rental property. Covers market research, financing, due diligence, closing, and your first-year operating budget. Built for Canadian investors.', category:'Investing', difficulty:'beginner', is_free:false, price:49.99, is_published:true, created_by:1, created_at:new Date().toISOString() });

  const frp_m1 = DB.insert('modules', { course_id:frp.id, title:'Module 1: Building Your Investment Thesis', description:'Define your investment criteria, risk tolerance, and financial constraints before you look at a single listing.', sort_order:0 });
  DB.insert('lessons', { module_id:frp_m1.id, title:'Lesson 1.1: The Three Constraints That Define Your Buy Box', description:'Liquidity, regulatory, and return constraints', content_type:'text', text_content:'<h3>The Three Constraints</h3><p>Every first-time rental purchase is governed by three constraints. Making them explicit prevents the most common and expensive mistakes.</p><h3>1. Liquidity Constraint</h3><p>This is not your down payment — it is your survival number. How many months of negative cash flow plus one major unexpected repair can you absorb without being forced to sell? If less than six months, you are undercapitalized. Vacancies, repairs, and rate increases happen. Your liquidity buffer keeps a temporary problem from becoming a permanent loss.</p><h3>2. Regulatory Constraint</h3><p>Provincial tenancy law determines what you can and cannot do. In Ontario, rent increases are capped at an annual guideline. In Alberta, there is no cap but timing rules apply. In BC, increases are capped differently. In Quebec, the process goes through the TAL. Before you buy, understand operating in that regulatory environment day to day.</p><h3>3. Return Constraint</h3><p>Define your minimum acceptable Year 1 metrics: cap rate floor, cash-on-cash return floor, and debt service coverage ratio minimum. Then stress-test against a rate increase of 1-2%, a vacancy of 2 months, and a major repair in Year 1. If the deal still works under stress, it works.</p><h3>Exercise</h3><p>Write down your three constraints with specific numbers. These become your buy box filter for every property you evaluate.</p>', duration:20, sort_order:0, is_free_preview:true });
  DB.insert('lessons', { module_id:frp_m1.id, title:'Lesson 1.2: Long-Term Hold vs. Short-Term Flip', description:'Why long-term hold is almost always right for first-time investors', content_type:'text', text_content:'<h3>Long-Term Hold Strategy</h3><p>This course assumes a long-term hold of 5-10+ years. If considering a shorter hold, be aware of the flipped property rules.</p><p>A housing unit disposed of within 365 consecutive days of acquisition (unless a specific exception applies) can be treated as <strong>flipped property</strong>. Gains on flipped property are taxed as business income — fully taxable, not at the capital gains inclusion rate. This is a significant difference that can change deal economics entirely.</p><h3>Why Long-Term Hold</h3><ul><li>Ride out market cycles</li><li>Build equity through mortgage paydown</li><li>Benefit from appreciation</li><li>Learn operating realities before making complex decisions</li></ul>', duration:12, sort_order:1, is_free_preview:false });

  const frp_m2 = DB.insert('modules', { course_id:frp.id, title:'Module 2: Market Research and Property Selection', description:'Evaluate rental markets, select properties that reduce surprises, and build underwriting models.', sort_order:1 });
  DB.insert('lessons', { module_id:frp_m2.id, title:'Lesson 2.1: Evaluating a Rental Market', description:'Triangulation approach using CMHC, StatsCan, and local data', content_type:'text', text_content:'<h3>Market Research Triangulation</h3><p>Market research answers two questions: Will this unit rent reliably, at what price, and with what vacancy risk? What attributes reduce expensive surprises?</p><h3>Three Data Sources</h3><ol><li><strong>CMHC Rental Market Reports</strong> — Annual reports covering vacancy rates, average rents, and turnover by city. The national vacancy rate is a benchmark, but decide based on your target neighbourhood.</li><li><strong>Statistics Canada</strong> — Vacancy rate series across census metropolitan areas gives you trend data, not just a snapshot.</li><li><strong>Local Reality Checks</strong> — Property tax rates, zoning, licensing for secondary suites, short-term rental restrictions, insurance claims history. Call the municipality, an insurance broker, and a local PM. 30 minutes of local calls tells you more than 3 hours of online research.</li></ol>', duration:15, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:frp_m2.id, title:'Lesson 2.2: Property Selection Criteria', description:'Tenant demand signals, building systems risk, and legal rentability', content_type:'text', text_content:'<h3>Selection Criteria for First-Time Investors</h3><p>Bias toward simplicity, durability, and tenant demand. You want a deal that minimizes learning cost while generating stable income.</p><h3>Tenant Demand Signals</h3><p>Transit access, proximity to employment, nearby schools, quiet street, parking, storage, and laundry. Strong demand = shorter vacancies and better tenant selection.</p><h3>Building Systems Risk</h3><p>Where first-time investors lose the most unplanned money. Before offering, understand: roof age/condition, plumbing type, electrical service, heating system, water intrusion signs, foundation condition, and legacy issues (knob-and-tube, asbestos).</p><h3>Legal Rentability</h3><p>Verify the unit is legally permitted as a rental. Check secondary suite rules, bedroom egress, fire separation. If it is a condo: in Ontario, request the <strong>status certificate</strong>. In BC, request the <strong>Form B Information Certificate</strong>. Both provide critical disclosure about the condo corporation.</p>', duration:18, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:frp_m2.id, title:'Lesson 2.3: Building Your Pro Forma', description:'The single most important tool in your acquisition decision', content_type:'text', text_content:'<h3>Building a Pro Forma</h3><p>A pro forma is a projected income and expense statement. It tells you whether the deal works before you commit.</p><h3>The Formula</h3><ol><li><strong>Gross Rent</strong> — Monthly rent × 12</li><li><strong>Vacancy Allowance</strong> — 5% conservative (never use zero)</li><li><strong>Operating Expenses</strong> — Property taxes, insurance, 7% maintenance reserves, 5% capital reserves, management fees (if applicable)</li><li><strong>Net Operating Income (NOI)</strong> = Effective gross income − operating expenses (excluding mortgage)</li><li><strong>Cap Rate</strong> = NOI ÷ purchase price</li><li><strong>Cash Flow Before Tax</strong> = NOI − annual mortgage payments</li><li><strong>Cash-on-Cash Return</strong> = Annual cash flow ÷ total cash invested (down payment + closing costs + reserves)</li></ol><h3>Exercise</h3><p>Build a pro forma under two scenarios: <strong>Conservative</strong> (5% vacancy, 8% management, 5.5% rate) and <strong>Favourable</strong> (3% vacancy, self-managed, 4.5% rate). If the conservative scenario is deeply negative, the deal depends on best-case assumptions.</p>', duration:22, sort_order:2, is_free_preview:false });

  const frp_m3 = DB.insert('modules', { course_id:frp.id, title:'Module 3: Financing and Acquisition', description:'Mortgage structures, stress tests, down payment requirements, and the acquisition process.', sort_order:2 });
  DB.insert('lessons', { module_id:frp_m3.id, title:'Lesson 3.1: Mortgage Pre-Approval for Investment Properties', description:'Budget constraints and underwriting for non-owner-occupied properties', content_type:'text', text_content:'<h3>Pre-Approval for Investment Properties</h3><p>For investment properties, underwriting is more conservative than for owner-occupied homes.</p><ul><li><strong>Minimum 20% down</strong> for non-owner-occupied residential rentals — this is the baseline, not negotiable</li><li><strong>Stress test:</strong> Qualify at your contract rate + 2%, or the minimum qualifying rate floor (whichever is higher). A 4.5% rate means qualifying at 6.5%+</li><li><strong>Rental income treatment</strong> varies by lender — some add back a portion, others are conservative. Build your pro forma assuming zero rental income addback until confirmed</li></ul><p>This prevents the common mistake of qualifying for more than you can sustain if the unit sits vacant.</p>', duration:15, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:frp_m3.id, title:'Lesson 3.2: Mortgage Structures for Landlords', description:'Fixed vs variable, open vs closed, and what it means for your strategy', content_type:'text', text_content:'<h3>Mortgage Structures</h3><ul><li><strong>Fixed Rate Closed</strong> — Predictable payments and stable cash flow modeling. Breaking early triggers prepayment penalties (3 months interest or interest rate differential). Best for most first-time landlords on a long-term hold.</li><li><strong>Variable Rate Closed</strong> — Benefits when rates decline, but you accept rate variability. Pro forma must survive higher rates AND a vacancy simultaneously.</li><li><strong>Open Mortgages</strong> — Prepayment without penalty. Maximum flexibility but higher rates. Useful for planned refinances.</li></ul><p><strong>Recommendation:</strong> For first-time landlords planning a long-term hold, a fixed rate closed term that matches your hold period is the most predictable starting point. Predictability matters more than optimization when you are learning.</p>', duration:15, sort_order:1, is_free_preview:false });
  DB.insert('lessons', { module_id:frp_m3.id, title:'Lesson 3.3: The Acquisition Process', description:'From offer to closing — conditions, inspection, and closing costs', content_type:'text', text_content:'<h3>The Acquisition Process</h3><p>A disciplined process follows a sequence designed to protect you at each stage.</p><h3>Offer Conditions</h3><p>Include conditions for: financing, professional inspection, and review of condo/strata documents. These give you exit points if due diligence reveals problems.</p><h3>Inspection</h3><p>Not reassurance — a decision tool. Define what findings reduce your offer and what triggers a walk-away <em>before</em> the inspection, not after.</p><h3>Closing Costs (Province-Dependent)</h3><ul><li><strong>Ontario:</strong> Land transfer tax on prescribed brackets</li><li><strong>BC:</strong> Property transfer tax on tiered rates</li><li><strong>Quebec:</strong> Welcome tax (municipal, varies)</li></ul><h3>Typical Timeline: 12-16 Weeks</h3><p>Strategy & pre-approval (2-3 wks) → Search & offers (3-4 wks) → Conditions (1-2 wks) → Closing prep (4-5 wks) → Turnover & tenant placement (2-4 wks). Build buffer into budget and timeline.</p>', duration:20, sort_order:2, is_free_preview:false });

  const frp_m4 = DB.insert('modules', { course_id:frp.id, title:'Module 4: Your First-Year Operating Playbook', description:'Set up rental operations from day one — rent collection, bookkeeping, and management decisions.', sort_order:3 });
  DB.insert('lessons', { module_id:frp_m4.id, title:'Lesson 4.1: Self-Manage vs. Hire a Property Manager', description:'Time, compliance, and systems discipline considerations', content_type:'text', text_content:'<h3>Self-Manage vs. Hire</h3><p>The decision comes down to time, compliance comfort, and systems discipline.</p><h3>Self-Management Is Viable If:</h3><ul><li>You can respond quickly to tenant needs</li><li>You document every interaction properly</li><li>You enforce consistent standards for screening, maintenance, and legal notices</li></ul><h3>Professional Management:</h3><ul><li>Reduces tenant-facing workload</li><li>Improves compliance execution (especially Year 1)</li><li>Adds recurring cost: % of rent + leasing fees</li><li>You still need to supervise, approve policy, and review financials</li></ul><p><strong>Honest recommendation:</strong> Self-manage your first property for the first year so you understand the operating reality. Then decide whether management fees are worth it based on experience, not assumption.</p>', duration:15, sort_order:0, is_free_preview:false });
  DB.insert('lessons', { module_id:frp_m4.id, title:'Lesson 4.2: Setting Up Your Financial Systems', description:'Separate accounts, CRA reporting, and record-keeping discipline', content_type:'text', text_content:'<h3>Financial Systems From Day One</h3><p>Separate rental finances from personal finances immediately. Dedicated bank account, standardized chart of accounts, and monthly reconciliation.</p><h3>CRA Requirements</h3><ul><li>Report rental income and expenses annually on <strong>Form T776</strong></li><li>Start tracking from <strong>closing day</strong>, not first tenant move-in</li><li>Closing costs, turnover work, and setup expenses are part of your rental operation</li><li>Keep records for <strong>at least 6 years</strong> from end of tax year</li></ul><h3>Common Mistakes</h3><ul><li>Mixing personal and rental expenses</li><li>Misclassifying capital improvements as current expenses</li><li>Letting receipts pile up — process monthly, not annually</li></ul><h3>Tooling</h3><p>Start simple: organized spreadsheet with receipt folder for a single property. If you plan to scale, start with accounting software (QuickBooks Online, Wave) so you do not have to migrate later.</p>', duration:18, sort_order:1, is_free_preview:false });

    DB.update('courses', leCourse.id, { description:'Navigate landlord-tenant law, tax compliance, insurance, and dispute resolution with confidence. Covers provincial rules across Ontario, Alberta, BC, and Quebec with practical compliance checklists. Built for Canadian property managers and landlords.', difficulty:'advanced' });

    const le_m1 = DB.insert('modules', { course_id:leCourse.id, title:'Module 1: Provincial Landlord-Tenant Law', description:'The rules that govern your daily operations are provincial. Learn key differences across Ontario, Alberta, BC, and Quebec.', sort_order:0 });
    DB.insert('lessons', { module_id:le_m1.id, title:'Lesson 1.1: Standard Leases and Tenancy Agreements', description:'Provincial requirements for lease forms and enforceable terms', content_type:'text', text_content:'<h3>Standard Leases by Province</h3><ul><li><strong>Ontario:</strong> Standard lease required for most private residential tenancies signed on or after March 1, 2021</li><li><strong>Quebec:</strong> TAL lease form is mandatory for new residential leases</li><li><strong>Alberta:</strong> No single mandatory standard form, but agreements must comply with the Residential Tenancies Act</li><li><strong>BC:</strong> Agreement must comply with the RTA; non-compliant clauses are unenforceable</li></ul><p><strong>Practical rule:</strong> Always use the required form where one exists. Attach supplementary schedules for additional enforceable terms. Never use a generic internet template — provincial rules differ enough that a template from one province will miss requirements in another.</p>', duration:15, sort_order:0, is_free_preview:true });
    DB.insert('lessons', { module_id:le_m1.id, title:'Lesson 1.2: Security Deposits', description:'Deposit rules, trust requirements, and compliance risks by province', content_type:'text', text_content:'<h3>Security Deposits by Province</h3><ul><li><strong>Ontario:</strong> Rent deposit equal to one month\'s rent. Interest owed annually at the rent increase guideline rate.</li><li><strong>Alberta:</strong> Must be placed in an interest-bearing trust account within two banking days of receipt.</li><li><strong>BC:</strong> Detailed rules including critical procedural requirement: tenants must participate in condition inspection to maintain deposit claim rights.</li><li><strong>Quebec:</strong> Civil Code restricts landlords from requiring money other than rent — no damage deposit in the traditional sense.</li></ul><p><strong>Compliance risk:</strong> Mishandling a deposit is one of the most common landlord mistakes and one of the easiest for a tenant to challenge. Know your province\'s rules, follow them exactly, and document every step.</p>', duration:15, sort_order:1, is_free_preview:false });
    DB.insert('lessons', { module_id:le_m1.id, title:'Lesson 1.3: Rent Increases and Rent Control', description:'The most misunderstood area of landlord-tenant law in Canada', content_type:'text', text_content:'<h3>Rent Control Across Canada</h3><ul><li><strong>Ontario:</strong> Increases limited to annual guideline (2.1% for 2026). Units first occupied after Nov 15, 2018 are generally exempt.</li><li><strong>Alberta:</strong> No cap on amount, but cannot increase more than once per 365 days and not during a fixed-term lease.</li><li><strong>BC:</strong> Limited to annual maximum (2.3% for 2026).</li><li><strong>Quebec:</strong> Lessor can propose increase at renewal. Lessee has one month to accept or refuse; disputes go through TAL.</li></ul><h3>Strategic Takeaway</h3><p>The province you buy in determines your ability to adjust rent. In rent-controlled provinces, your <strong>initial rent level matters more</strong> because your ability to increase is constrained. In Alberta, you have more pricing flexibility but must manage the relationship carefully.</p>', duration:18, sort_order:2, is_free_preview:false });
    DB.insert('lessons', { module_id:le_m1.id, title:'Lesson 1.4: Landlord Right of Entry', description:'Notice requirements and entry rules that protect you and your tenants', content_type:'text', text_content:'<h3>Right of Entry by Province</h3><ul><li><strong>Ontario:</strong> 24 hours written notice required under specified circumstances</li><li><strong>Alberta:</strong> 24 hours written notice for entry without tenant permission, with defined permissible reasons</li><li><strong>BC:</strong> At least 24 hours but not more than 30 days before entry, between 8 AM and 9 PM</li><li><strong>Quebec:</strong> 24 hours notice (verbal or written) during lease term, with emergency exceptions</li></ul><p>Entry violations are one of the fastest ways to damage a tenant relationship and create a tribunal dispute. The cost of getting this right is minimal. The cost of getting it wrong includes formal complaints, compensation orders, and reputational damage.</p>', duration:12, sort_order:3, is_free_preview:false });

    const le_m2 = DB.insert('modules', { course_id:leCourse.id, title:'Module 2: Eviction Processes and Dispute Resolution', description:'When a tenancy goes wrong, the process is slow, procedural, and documentation-intensive.', sort_order:1 });
    DB.insert('lessons', { module_id:le_m2.id, title:'Lesson 2.1: Non-Payment Eviction by Province', description:'Timelines, procedures, and why it always takes longer than expected', content_type:'text', text_content:'<h3>Non-Payment Eviction by Province</h3><ul><li><strong>Ontario:</strong> Statutory notice → Landlord and Tenant Board (significant backlogs). First missed payment to eviction order can take months.</li><li><strong>BC:</strong> 10-day notice to end tenancy for unpaid rent. Tenant can dispute through Residential Tenancy Branch.</li><li><strong>Alberta:</strong> Non-payment triggers termination notice with minimum 14 clear days, then RTDRS or court application.</li><li><strong>Quebec:</strong> Rent more than 3 weeks late can lead to lease resiliation through TAL.</li></ul><h3>Operational Lesson</h3><p>Build an arrears protocol that triggers quickly and follows correct procedural steps from day one. Document every missed payment, every communication, and every notice. By the time you reach a tribunal, your documentation IS your case.</p>', duration:18, sort_order:0, is_free_preview:false });
    DB.insert('lessons', { module_id:le_m2.id, title:'Lesson 2.2: Building an Arrears Protocol', description:'A standardized step-by-step process that activates the moment rent is late', content_type:'text', text_content:'<h3>Arrears Protocol</h3><p>A written, step-by-step process that activates the moment rent is late:</p><ol><li>Day rent is due and grace period (if any)</li><li>Date late notice is sent</li><li>Date formal statutory notice is served</li><li>Documentation captured at each step</li><li>Trigger point for filing tribunal/court application</li></ol><h3>Why Consistency Matters</h3><p>The steps are the same for every tenant, every time. Consistency protects you <strong>legally</strong> because it demonstrates fair, standardized process — not targeted or retaliatory. It also protects your <strong>cash flow</strong> because every day you delay is a day of lost rent you may never recover.</p>', duration:15, sort_order:1, is_free_preview:false });

    const le_m3 = DB.insert('modules', { course_id:leCourse.id, title:'Module 3: Insurance and Risk Management', description:'What your insurance covers, what it does not, and how to structure coverage.', sort_order:2 });
    DB.insert('lessons', { module_id:le_m3.id, title:'Lesson 3.1: Landlord Insurance Fundamentals', description:'Policy types, coverage gaps, and tenant insurance requirements', content_type:'text', text_content:'<h3>Landlord Insurance</h3><p>Structurally different from homeowner insurance. If you rent out a property on a homeowner policy, you may have a coverage gap that only appears when you file a claim.</p><h3>Three Core Coverage Areas</h3><ol><li><strong>Building & Dwelling</strong> — Fire, water, wind, named perils. Check replacement cost vs. actual cash value. Check vacancy clauses (many policies reduce coverage when vacant).</li><li><strong>Landlord Liability</strong> — Claims from tenants or guests injured on property. Choose limits reflecting total asset exposure, not just property value.</li><li><strong>Loss of Rental Income</strong> — Compensation when a covered loss makes the unit uninhabitable during repairs.</li></ol><h3>Additional Considerations</h3><ul><li><strong>Contents coverage</strong> for landlord-owned furnishings/appliances</li><li><strong>Vacancy endorsements</strong> for periods between tenants or during renovation</li><li><strong>Tenant insurance requirement</strong> in the lease — protects the tenant and reduces disputes about damaged personal property</li></ul>', duration:20, sort_order:0, is_free_preview:false });

    const le_m4 = DB.insert('modules', { course_id:leCourse.id, title:'Module 4: Tax Compliance for Landlords', description:'T776 filing, deductible expenses, CCA decisions, record retention, and GST/HST rules.', sort_order:3 });
    DB.insert('lessons', { module_id:le_m4.id, title:'Lesson 4.1: Reporting Rental Income and Expenses', description:'Form T776, deductible expenses, and common classification mistakes', content_type:'text', text_content:'<h3>CRA Rental Income Reporting</h3><p>Report annually on <strong>Form T776</strong>. Deductible expenses include:</p><ul><li>Advertising, insurance premiums, mortgage interest (not principal)</li><li>Maintenance and repairs, property management fees, property taxes</li><li>Utilities you pay, legal and accounting fees, office expenses</li></ul><h3>Current vs. Capital Expenses</h3><p>CRA distinguishes between <strong>current expenses</strong> (fully deductible in year incurred) and <strong>capital expenses</strong> (depreciated over time). Misclassifying a capital improvement as a current expense can trigger a reassessment.</p><p><strong>Common mistake:</strong> Mixing personal and rental expenses. If you use part of your home to manage the rental, the deduction must be reasonable and proportional.</p>', duration:15, sort_order:0, is_free_preview:false });
    DB.insert('lessons', { module_id:le_m4.id, title:'Lesson 4.2: Capital Cost Allowance (CCA)', description:'Depreciation strategy and the recapture trap', content_type:'text', text_content:'<h3>Capital Cost Allowance</h3><p>CCA is the tax mechanism for depreciating capital assets over time. You can claim CCA on your rental property and capital additions.</p><h3>Critical Constraints</h3><ul><li>You <strong>cannot use CCA to create or increase a rental loss</strong>. If income after expenses is zero or negative, CCA cannot make it more negative.</li><li><strong>Recapture:</strong> When you sell, any CCA you claimed may be recaptured as income in the year of disposition. The tax savings during your hold period may come due at sale.</li></ul><p>Whether to claim CCA is a strategic decision depending on your current and projected tax situation. <strong>Discuss with your accountant before claiming it.</strong></p>', duration:12, sort_order:1, is_free_preview:false });
    DB.insert('lessons', { module_id:le_m4.id, title:'Lesson 4.3: GST/HST and Short-Term Rental Rules', description:'When GST/HST applies and the compliance double-hit for illegal STRs', content_type:'text', text_content:'<h3>GST/HST Rules</h3><p><strong>Long-term residential rentals:</strong> Rent is generally an exempt supply. You do not charge GST/HST on rent from long-term tenants.</p><p><strong>Short-term rentals:</strong> Generally taxable. If revenue exceeds the small supplier threshold ($30,000 in a 12-month period), you must register for GST/HST and begin collecting and remitting.</p><h3>The Compliance Double-Hit</h3><p>CRA has introduced rules restricting deductions for short-term rentals operating in non-compliant jurisdictions. Operating an illegal STR can result in both regulatory penalties AND denial of tax deductions — making the economics unworkable.</p><p>If you plan STR: confirm municipal compliance before listing, register for GST/HST when required, and maintain separate books.</p>', duration:15, sort_order:2, is_free_preview:false });

  if(pmfCourse){
    const pmf_m4 = DB.insert('modules', { course_id:pmfCourse.id, title:'Module 4: Tenant Screening and Onboarding', description:'A repeatable screening process and thorough onboarding experience set the tone for the entire tenancy.', sort_order:3 });
    DB.insert('lessons', { module_id:pmf_m4.id, title:'Lesson 4.1: Building a Screening Pipeline', description:'Standardized process, privacy compliance, and human rights considerations', content_type:'text', text_content:'<h3>Building a Screening Pipeline</h3><p>A screening pipeline is a repeatable, standardized process every applicant goes through in the same order.</p><h3>The Pipeline</h3><ol><li>Application form with consent for credit and reference checks</li><li>Identity verification</li><li>Credit report review</li><li>Income validation</li><li>Landlord reference verification (through an independent contact method, not the applicant-provided number)</li><li>Final decision using a consistent scoring rubric</li></ol><h3>Privacy & Human Rights Compliance</h3><p>Landlords handling personal information may be subject to <strong>PIPEDA</strong> or provincial privacy legislation. You can only collect information necessary for the tenancy decision and must have consent for credit checks.</p><p>Human rights legislation in every province prohibits discrimination based on protected grounds. Screening for income, creditworthiness, and rental history is appropriate. Screening based on race, family status, disability, or other protected grounds is not.</p>', duration:18, sort_order:0, is_free_preview:false });
    DB.insert('lessons', { module_id:pmf_m4.id, title:'Lesson 4.2: Lease Execution and Move-In', description:'Documentation, condition reports, and tenant onboarding', content_type:'text', text_content:'<h3>Lease Execution</h3><p>Use the legally required lease form where applicable. Attach supplementary schedules for enforceable additional terms: maintenance reporting protocols, tenant insurance requirements, occupancy rules.</p><h3>Move-In Documentation</h3><p>Your most important evidence file. The condition report, completed jointly with the tenant, establishes the baseline condition.</p><ul><li><strong>Alberta:</strong> Move-in and move-out inspection reports are mandatory</li><li><strong>BC:</strong> Formalized inspection process with RTB-provided template</li><li>Even where not strictly mandatory, doing it protects you in every deposit dispute</li></ul><h3>Move-In Package</h3><p>Everything the tenant needs to operate: maintenance request channel, emergency instructions, building rules, parking and storage info, garbage and recycling schedules. A properly onboarded tenant generates fewer questions, fewer complaints, and fewer maintenance requests in the first 90 days.</p>', duration:15, sort_order:1, is_free_preview:false });
  }

  // ---- 5 NEW FREE RESOURCES ----
  DB.insert('resources', { title:'Provincial Landlord-Tenant Quick Reference', description:'A side-by-side comparison of key landlord-tenant rules across Ontario, Alberta, BC, and Quebec. Covers standard leases, deposits, rent increases, entry rules, and eviction triggers in one printable reference.', type:'guide', content:'<h3>Provincial Landlord-Tenant Quick Reference</h3><table style="width:100%;border-collapse:collapse;font-size:14px;margin:16px 0"><tr style="background:var(--dark);color:#fff"><th style="padding:10px;text-align:left">Topic</th><th style="padding:10px">Ontario</th><th style="padding:10px">Alberta</th><th style="padding:10px">BC</th><th style="padding:10px">Quebec</th></tr><tr style="border-bottom:1px solid var(--border)"><td style="padding:10px;font-weight:600">Standard Lease</td><td style="padding:10px">Required (since 2021)</td><td style="padding:10px">No mandatory form</td><td style="padding:10px">Must comply with RTA</td><td style="padding:10px">TAL form mandatory</td></tr><tr style="border-bottom:1px solid var(--border);background:var(--bg-section)"><td style="padding:10px;font-weight:600">Security Deposit</td><td style="padding:10px">1 month rent; interest owed</td><td style="padding:10px">Trust account within 2 days</td><td style="padding:10px">Detailed rules; condition inspection required</td><td style="padding:10px">No damage deposit allowed</td></tr><tr style="border-bottom:1px solid var(--border)"><td style="padding:10px;font-weight:600">Rent Increases</td><td style="padding:10px">Capped at guideline (2.1% for 2026)</td><td style="padding:10px">No cap; once per 365 days</td><td style="padding:10px">Capped (2.3% for 2026)</td><td style="padding:10px">Proposed at renewal; TAL if disputed</td></tr><tr style="border-bottom:1px solid var(--border);background:var(--bg-section)"><td style="padding:10px;font-weight:600">Entry Notice</td><td style="padding:10px">24h written</td><td style="padding:10px">24h written</td><td style="padding:10px">24h-30 days; 8AM-9PM</td><td style="padding:10px">24h verbal or written</td></tr><tr style="border-bottom:1px solid var(--border)"><td style="padding:10px;font-weight:600">Non-Payment Eviction</td><td style="padding:10px">LTB (months-long process)</td><td style="padding:10px">14 days notice → RTDRS/court</td><td style="padding:10px">10-day notice → RTB dispute</td><td style="padding:10px">3+ weeks late → TAL resiliation</td></tr></table><p style="margin-top:16px"><em>For the full deep-dive on each province, enroll in Legal Essentials for Property Managers on Property Manager Academy.</em></p>', category:'all', tags:'legal,reference,provincial', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Rental Property Pre-Offer Checklist', description:'Before you make an offer on a rental property, run through this checklist. Covers tenant demand, building risk, legal rentability, financing, and insurance. One page. Print it. Use it on every viewing.', type:'guide', content:'<h3>Pre-Offer Due Diligence Checklist</h3><h4>1. Market & Demand Verification</h4><ul><li>&#9744; Rent comps confirmed (comparable units within 1km)</li><li>&#9744; Vacancy trends reviewed (CMHC/StatsCan data)</li><li>&#9744; Average days on market for rentals in this area</li><li>&#9744; Transit access, employment proximity, school access verified</li></ul><h4>2. Building Condition Red Flags</h4><ul><li>&#9744; Roof age and condition assessed</li><li>&#9744; Plumbing type identified (no galvanized/polybutylene)</li><li>&#9744; Electrical service size confirmed (100A+ minimum)</li><li>&#9744; HVAC age and service history reviewed</li><li>&#9744; No visible water intrusion or foundation issues</li><li>&#9744; No legacy issues (knob-and-tube, asbestos)</li></ul><h4>3. Legal Rentability</h4><ul><li>&#9744; Zoning permits residential rental use</li><li>&#9744; Secondary suite is permitted (if applicable)</li><li>&#9744; Bedroom egress and fire separation meet code</li><li>&#9744; Condo docs reviewed (status certificate/Form B)</li></ul><h4>4. Financing Confirmation</h4><ul><li>&#9744; Mortgage pre-approval obtained for investment property</li><li>&#9744; Stress test passed at qualifying rate</li><li>&#9744; Rental income treatment confirmed with lender</li></ul><h4>5. Insurance & Cost Confirmation</h4><ul><li>&#9744; Landlord insurance quote obtained</li><li>&#9744; Vacancy clause reviewed</li><li>&#9744; Closing costs estimated (land transfer tax, legal, etc.)</li><li>&#9744; Pro forma completed under conservative assumptions</li></ul>', category:'all', tags:'checklist,investing,due-diligence', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Move-In Documentation Package', description:'Your move-in documentation is your most important evidence file. Complete checklist covering tenant identity, financial setup, property condition, safety compliance, and operational onboarding.', type:'guide', content:'<h3>Move-In Documentation Package</h3><h4>1. Identity & Contact Information</h4><ul><li>&#9744; Government-issued ID verified and copied</li><li>&#9744; Emergency contact collected</li><li>&#9744; Vehicle information recorded (plate, make, model)</li></ul><h4>2. Financial Setup</h4><ul><li>&#9744; First month\'s rent collected</li><li>&#9744; Security deposit collected and receipted (per provincial rules)</li><li>&#9744; Payment method established (e-transfer, PAD, etc.)</li><li>&#9744; All receipts issued and filed</li></ul><h4>3. Property Condition Evidence</h4><ul><li>&#9744; Joint condition report completed with tenant</li><li>&#9744; Photo/video walkthrough completed and date-stamped</li><li>&#9744; Utility meter readings recorded</li><li>&#9744; All existing damage documented and signed by both parties</li></ul><h4>4. Safety & Compliance</h4><ul><li>&#9744; Smoke and CO detectors tested and documented</li><li>&#9744; All keys/fobs/remotes provided and documented</li><li>&#9744; Building rules and bylaws provided</li><li>&#9744; Emergency exits and procedures reviewed</li></ul><h4>5. Operational Onboarding</h4><ul><li>&#9744; Maintenance request channel explained</li><li>&#9744; Emergency instructions provided (who to call, when)</li><li>&#9744; Utility setup confirmed (tenant-responsible utilities)</li><li>&#9744; Parking, storage, garbage/recycling info provided</li><li>&#9744; Tenant insurance requirement confirmed</li></ul>', category:'all', tags:'checklist,move-in,documentation', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Tenant Screening Scorecard', description:'A consistent, human-rights-compliant scoring framework for evaluating rental applicants. Covers identity, affordability, credit, references, and risk flags. Use the same process for every applicant.', type:'guide', content:'<h3>Tenant Screening Scorecard</h3><div style="background:var(--bg-section);border-radius:8px;padding:16px;margin-bottom:16px"><strong>&#9888; Human Rights Compliance:</strong> Screening must be consistent across all applicants and must not use protected grounds (race, family status, disability, religion, etc.) as decision factors. This scorecard evaluates tenancy-relevant criteria only.</div><h4>1. Identity & Stability</h4><ul><li>&#9744; Government ID verified</li><li>&#9744; Time at current employer: ___ years</li><li>&#9744; Time at current residence: ___ years</li></ul><h4>2. Affordability</h4><ul><li>&#9744; Gross monthly income: $___</li><li>&#9744; Proposed monthly rent: $___</li><li>&#9744; Rent-to-income ratio: ___% (target: under 35%)</li></ul><h4>3. Credit & Payment Behaviour</h4><ul><li>&#9744; Credit check consent obtained</li><li>&#9744; Credit score: ___ (note: use as one factor, not sole criterion)</li><li>&#9744; Bankruptcies / collections: Y/N</li></ul><h4>4. References</h4><ul><li>&#9744; Prior landlord contacted (independently verified number)</li><li>&#9744; Paid on time? Y/N</li><li>&#9744; Maintained property? Y/N</li><li>&#9744; Would rent to them again? Y/N</li><li>&#9744; Employment reference verified</li></ul><h4>5. Risk Flags</h4><ul><li>&#9744; Inconsistencies in application</li><li>&#9744; Reluctance to provide references</li><li>&#9744; Pressure to rush process</li></ul><p><strong>Decision: &#9744; Approve &nbsp; &#9744; Decline &nbsp; &#9744; Conditional</strong></p>', category:'all', tags:'screening,tenants,scorecard', created_at:new Date().toISOString() });

  DB.insert('resources', { title:'Year-End Rental Tax Package Checklist', description:'Everything you need organized before you sit down with your accountant or file your T776. Covers rent rolls, expense categories, mortgage statements, CCA schedules, and record retention.', type:'guide', content:'<h3>Year-End Rental Tax Package Checklist</h3><h4>1. Income Documentation</h4><ul><li>&#9744; Annual rent roll (monthly amounts collected per unit)</li><li>&#9744; Vacancy periods documented (dates and duration)</li><li>&#9744; Any other rental income (parking, laundry, storage fees)</li></ul><h4>2. Expenses by CRA Category</h4><ul><li>&#9744; Advertising for tenants</li><li>&#9744; Insurance premiums</li><li>&#9744; Mortgage interest (not principal)</li><li>&#9744; Maintenance and repairs (current expenses)</li><li>&#9744; Capital improvements (must be depreciated — confirm classification)</li><li>&#9744; Property management fees</li><li>&#9744; Property taxes</li><li>&#9744; Utilities paid by landlord</li><li>&#9744; Legal and accounting fees</li></ul><div style="background:var(--bg-section);border-radius:8px;padding:12px;margin:12px 0"><strong>Repairs vs. Capital:</strong> A repair restores to original condition (deductible now). An improvement adds value or extends life (must be depreciated via CCA).</div><h4>3. Supporting Documents</h4><ul><li>&#9744; Mortgage interest statement from lender</li><li>&#9744; Property tax bill</li><li>&#9744; Insurance premium confirmation</li><li>&#9744; Management fee invoices</li><li>&#9744; All receipts organized by category</li></ul><h4>4. CCA Schedule</h4><ul><li>&#9744; CCA claimed this year? Y/N</li><li>&#9744; If yes: class, rate, UCC opening balance, additions, CCA amount</li><li>&#9744; Note: CCA cannot create/increase a rental loss. Discuss recapture risk with accountant.</li></ul><h4>5. Records Retention</h4><ul><li>&#9744; All records filed for minimum <strong>6 years</strong> from end of tax year</li><li>&#9744; Digital backups of all receipts and documents</li><li>&#9744; Audit-ready format (organized, accessible, complete)</li></ul>', category:'all', tags:'tax,CRA,checklist,year-end', created_at:new Date().toISOString() });

  const rtaRes = DB.find('resources', r => r.title === 'Understanding the Residential Tenancies Act');
  if(rtaRes){
    DB.update('resources', rtaRes.id, { type:'blog', content:'<h3>Know Your Legal Obligations</h3><p>Every province in Canada has its own Residential Tenancies Act (RTA) governing the landlord-tenant relationship. While the specifics vary, the core principles are consistent across all jurisdictions. Understanding these rules is not optional — it is a legal requirement, and ignorance is not a defense.</p><h3>What the RTA Covers</h3><p>The RTA defines the rights and responsibilities of both landlords and tenants. It covers everything from how you collect rent to how you enter the unit, handle repairs, increase rent, and end a tenancy. If you manage even one rental unit in Canada, the RTA applies to you.</p><h3>Right to Quiet Enjoyment</h3><p>Tenants have the right to reasonable peace and privacy in their home. You cannot enter without proper written notice — typically 24 hours in most provinces. Exceptions exist for genuine emergencies (e.g., a burst pipe or fire), but casual drop-ins or surprise inspections are not permitted. Repeated unauthorized entry can result in complaints to the tribunal and potential fines.</p><h3>Maintenance and Repair Standards</h3><p>Landlords must keep the property in a good state of repair, meeting all applicable health, safety, and housing standards. This includes structural elements, plumbing, heating, electrical systems, and common areas. You cannot pass these responsibilities to the tenant through the lease — the obligation is statutory and cannot be contracted away. When a tenant reports a maintenance issue, you are expected to respond within a reasonable timeframe. Failure to maintain the property can lead to rent abatement orders or municipal enforcement.</p><h3>Rent Increases</h3><p>Most provinces cap annual rent increases to a government-published guideline amount, and require written notice — typically 90 days before the increase takes effect. In Ontario, the guideline for 2024 was 2.5%. Some newer buildings may be exempt from rent control depending on when they were first occupied. Always verify the rules in your specific province, as the details differ significantly.</p><h3>Security Deposits</h3><p>Rules around deposits vary dramatically by province. Ontario does not allow security or damage deposits at all — only a last month\'s rent deposit, which must be applied to the final month of tenancy. British Columbia allows a damage deposit of up to half a month\'s rent and a pet damage deposit of the same amount. Alberta allows a security deposit of up to one month\'s rent. Know your province\'s rules before collecting anything beyond first and last month\'s rent.</p><h3>The Eviction Process</h3><p>You cannot simply evict a tenant because you want them out. There are specific legal grounds for eviction, and a formal process must be followed. Common grounds include: persistent late payment, causing damage, illegal activity, the landlord or their family moving in, or major renovations that require the unit to be vacant. In every case, proper notice must be served using the correct provincial form. If the tenant disputes the notice, the matter goes to a hearing at the provincial tribunal (e.g., the Landlord and Tenant Board in Ontario). Self-help evictions — such as changing the locks or shutting off utilities — are illegal everywhere in Canada.</p><h3>Lease Agreements and the RTA</h3><p>Any clause in a lease that contradicts the RTA is void and unenforceable, even if the tenant signed it. For example, a clause saying "no guests after 10 PM" or "tenant is responsible for all repairs" would not hold up. The RTA sets the floor — you can offer more than the minimum, but never less. Use a province-specific standard lease form where one is required (Ontario mandates this).</p><h3>Provincial Differences at a Glance</h3><ul><li><strong>Ontario</strong> — Landlord and Tenant Board (LTB) handles disputes. No security deposits. Standard lease required. Rent control on most units.</li><li><strong>British Columbia</strong> — Residential Tenancy Branch (RTB) handles disputes. Damage deposit up to half a month. Rent increase limited to annual guideline.</li><li><strong>Alberta</strong> — Residential Tenancy Dispute Resolution Service (RTDRS). Security deposit up to one month. No rent control — landlords can increase rent with proper notice.</li><li><strong>Quebec</strong> — Tribunal administratif du logement (TAL). Unique rules including automatic lease renewal and restrictions on lease transfers.</li></ul><h3>Staying Compliant</h3><p>The best way to stay out of trouble is to treat the RTA as your operating manual. Keep written records of everything — notices, communications, repair requests, inspections. Use proper provincial forms for notices. Respond to maintenance requests promptly. Never attempt to resolve disputes through self-help measures. When in doubt, consult your provincial tribunal\'s website or seek legal advice before acting.</p><p>Staying informed about your local RTA is not just good practice — it is the foundation of professional property management.</p>' });
  }
  localStorage.setItem('kru_seeded_v4', '1');
}

if(!localStorage.getItem('kru_seeded_v5')){
  const screenRes = DB.find('resources', r => r.title === 'How to Screen Tenants Like a Pro');
  if(screenRes){
    DB.update('resources', screenRes.id, { type:'blog', readTime:'12 min read', eyebrow:'PM Academy \u2014 Landlord Fundamentals', location:'Canada \u2014 Alberta Focus', description:'A step-by-step guide to background checks, income verification, reference calls, and making the right decision on applicants.', content:'<p>Choosing the wrong tenant is the most expensive mistake most first-time landlords make. Not because good judgment is hard, but because most people do not have a process. They look at one or two pieces of information, trust their gut, and hope for the best.</p><p>Professional property managers do something different. They follow the same consistent process with every applicant. They look at the same information in the same order. They make decisions based on documented evidence, not instinct. And when something goes wrong, they have a clear record showing they followed a defensible, objective process.</p><p>This guide walks you through that process, step by step, with the tools and resources to actually do each part of it. You do not need to be a professional property manager to screen like one. You just need a process you apply consistently.</p><div class="callout callout-warn"><p class="callout-label">Before You Start</p><p>Canadian landlords must comply with human rights legislation that prohibits denying a rental based on protected grounds including race, religion, family status, disability, age, gender identity, sexual orientation, and source of income. Your screening process must be consistent across all applicants. Apply the same criteria and ask the same questions of everyone. For a full list of protected grounds in Alberta, see the <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission rental housing guidelines</a>.</p></div><div class="toc-wrap"><h3>What we cover</h3><ol class="toc-list"><li><a href="#step1">Set your criteria before you advertise</a></li><li><a href="#step2">Use a consistent rental application</a></li><li><a href="#step3">Run a credit check</a></li><li><a href="#step4">Verify income and employment</a></li><li><a href="#step5">Check rental history</a></li><li><a href="#step6">Call the references properly</a></li><li><a href="#step7">Conduct a background check</a></li><li><a href="#step8">Make the decision and document it</a></li></ol></div><div id="step1" class="step-header"><div class="step-number">1</div><h2 class="step-title">Set Your Criteria Before You Advertise</h2></div><p>Most landlords start screening when applications come in. The problem with that approach is that without criteria decided in advance, you end up making ad-hoc judgments influenced by how much you liked someone in a viewing, whether they reminded you of yourself, or whether you were tired when you reviewed their paperwork.</p><p>Write your screening criteria down before the first showing. This protects you legally, keeps you consistent, and removes the emotional variability that leads to bad decisions. The criteria should be objective and financial, not personal.</p><h3>Standard criteria to define in advance:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Minimum credit score.</strong> Most landlords in Canada look for a score of 650 or above. A score between 600 and 650 warrants closer review. Below 600 is a risk signal that requires additional context.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Rent-to-income ratio.</strong> The standard benchmark is that monthly rent should not exceed one-third of gross monthly income. At $2,000/month rent, you are looking for income of at least $6,000/month.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Employment stability.</strong> You are looking for a clear income source, not necessarily a traditional employer. Employed, self-employed, retired, and receiving documented government benefits can all qualify.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Rental history standard.</strong> No evictions, no unpaid rent collections, and positive landlord references within the past three years.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Completed application required.</strong> Incomplete applications are not reviewed. This alone filters out applicants who are not serious or are trying to hide information.</span></li></ul><div class="callout callout-warn"><p class="callout-label">Important: Source of Income</p><p>In Alberta, the Human Rights Act prohibits discrimination based on source of income. You cannot refuse an applicant because they receive government assistance, AISH, disability benefits, or support payments. Your screening criteria must be applied to income level and stability, not its origin. For more detail, see the <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission guidance on rental housing</a>.</p></div><div id="step2" class="step-header"><div class="step-number">2</div><h2 class="step-title">Use a Consistent Rental Application</h2></div><p>A rental application is your foundational document. It collects the information you need to run the rest of your screening process and it creates a paper record that the applicant signed and attested to. If information on the application turns out to be false, you have grounds for rejection or, if discovered post-move-in, potential lease termination.</p><p>Every applicant should complete the same form. Not a modified version. The same form. This protects you from any claim that you applied different standards to different people.</p><h3>A complete rental application should collect:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Full legal name, date of birth, and government ID number (required for credit check)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current and previous addresses for the past three years, including dates</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current and previous landlord contact information</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Current employer or income source, contact name and number for verification</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Monthly gross income (self-declared, to be verified)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Two personal references (not family members) with contact information</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Signed consent for credit check and background check</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Declaration that all information is truthful and complete</li></ul><div class="resource-block"><h4>Application Templates</h4><ul class="resource-list"><li><a href="https://www.rentfaster.ca/blog/what-to-look-for-when-screening-a-tenant/" target="_blank" rel="noopener">RentFaster.ca &mdash; Alberta-specific landlord screening overview and forms guidance</a></li><li><a href="https://www.landlordandtenant.org/legislation/" target="_blank" rel="noopener">Centre for Public Legal Education Alberta &mdash; Provincial tenancy legislation overview</a></li><li><a href="https://open.alberta.ca/publications/rta-handbook-for-landlords-and-tenants" target="_blank" rel="noopener">Government of Alberta &mdash; RTA Handbook for Landlords and Tenants (June 2025)</a></li></ul></div><div id="step3" class="step-header"><div class="step-number">3</div><h2 class="step-title">Run a Credit Check</h2></div><p>The credit report is the most important single document in your screening process. It tells you whether this person has a pattern of paying their financial obligations on time. That pattern is the strongest available predictor of whether they will pay you on time.</p><p>You cannot pull a credit report without the applicant&#39;s written consent. That consent should be part of your rental application. Once you have it, you have two ways to proceed: use a tenant screening service, or pull directly from one of Canada&#39;s two credit bureaus.</p><div class="callout callout-info"><p class="callout-label">November 2024 Policy Update</p><p>As of November 2024, both Equifax and TransUnion have classified rental credit checks as <strong>soft inquiries</strong>. This means running a credit check on a prospective tenant no longer affects their credit score. This is a meaningful change for tenants who were previously hesitant to authorize checks when applying to multiple properties. You can share this information openly with applicants to remove any friction around consent.</p></div><h3>What to look for in a credit report:</h3><table class="decision-table"><thead><tr><th>Item</th><th>What it tells you</th><th>What to watch for</th></tr></thead><tbody><tr><td>Credit score</td><td>Overall creditworthiness on a 300&ndash;900 scale</td><td>Below 600 is elevated risk. 650+ is a reasonable baseline. Context matters.</td></tr><tr><td>Payment history</td><td>Whether they pay bills on time</td><td>Patterns of late payments or missed accounts signal chronic financial stress</td></tr><tr><td>Collections</td><td>Accounts sent to collections agencies</td><td>A rent collection specifically is a serious red flag</td></tr><tr><td>Rent tradelines</td><td>History of reported rent payments (Equifax only)</td><td>Equifax accepts rent payment reporting &mdash; unpaid rent may appear here</td></tr><tr><td>Outstanding debt</td><td>Total debt load relative to income</td><td>High debt with moderate income compresses what is available for rent</td></tr><tr><td>Bankruptcies</td><td>Prior financial restructuring</td><td>Recent bankruptcy is a risk signal. Discharged bankruptcy several years ago is less concerning.</td></tr><tr><td>Addresses</td><td>Cross-reference with application history</td><td>Significant gaps or addresses not disclosed on the application warrant questions</td></tr></tbody></table><div class="callout callout-pro"><p class="callout-label">Pro Tip: Run Both Bureaus</p><p>Equifax and TransUnion pull data from different lenders. Research shows that in more than 40% of cases, there is a 40-point or greater difference between the two scores. Running both gives you a more complete picture and reduces the chance of missing a significant red flag on one bureau that does not appear on the other. Equifax is particularly useful for rent-related tradelines and collections.</p></div><div class="resource-block"><h4>Tenant Credit Check Services (Canada)</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/en-ca/tenant-report/" target="_blank" rel="noopener">SingleKey &mdash; Full Equifax and TransUnion dual reports, eviction records, public document scan</a></li><li><a href="https://frontlobby.com/frontlobby-tenant-credit-check/" target="_blank" rel="noopener">FrontLobby &mdash; Equifax credit reports with rental tradeline data</a></li><li><a href="https://www.tenantverification.ca/tenant-screening.html" target="_blank" rel="noopener">TVS (Tenant Verification Service) &mdash; Canadian credit and criminal screening</a></li><li><a href="https://learn.openroom.ca/post/equifax-vs-tranunion" target="_blank" rel="noopener">Openroom &mdash; Guide to understanding Equifax vs TransUnion for landlords</a></li></ul></div><div id="step4" class="step-header"><div class="step-number">4</div><h2 class="step-title">Verify Income and Employment</h2></div><p>A credit score tells you about past behaviour. Income verification tells you about current capacity. Even an applicant with an excellent credit history can end up unable to pay rent if their financial situation has recently changed. You need both.</p><p>The standard benchmark is that gross monthly income should be at least three times the monthly rent. At $1,800/month, you are looking for income of $5,400/month or better. Use this as a starting floor, not an absolute threshold &mdash; a well-qualified applicant with strong credit and a slightly lower income ratio may still be an excellent choice.</p><h3>Documents to request based on income type:</h3><table class="decision-table"><thead><tr><th>Applicant type</th><th>What to request</th></tr></thead><tbody><tr><td>Traditionally employed</td><td>Last two or three pay stubs, plus an employment letter on company letterhead confirming position, salary, and start date</td></tr><tr><td>Recently hired</td><td>Signed offer letter from employer on company letterhead, stating salary and start date; most recent pay stubs from previous employer</td></tr><tr><td>Self-employed / freelance</td><td>Last two years of CRA Notice of Assessment (NOA) or T1 General, plus three to six months of bank statements showing consistent deposits</td></tr><tr><td>Retired</td><td>Pension statement or government benefit letter, plus bank statements confirming regular deposits</td></tr><tr><td>Receiving benefits or support</td><td>Official government benefit documentation or court-ordered support documents; bank statements confirming receipt</td></tr><tr><td>Gig / platform worker</td><td>Three to six months of bank statements showing deposit consistency, platform payout statements if available</td></tr></tbody></table><h3>How to verify the documents are real:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Cross-reference pay stubs with bank statements.</strong> The net pay on the stub should match the deposit amounts in the account. If the numbers do not align, ask about it directly.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Call the employer directly.</strong> Do not call the number on the letter. Look up the company independently and call their HR or main line. Ask to confirm the person&#39;s employment and salary. Most employers will confirm this with the employee&#39;s written consent, which you already have from the application.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Watch for document red flags.</strong> Pay stubs with round numbers and no cents, inconsistent fonts, missing year-to-date totals, or addresses that do not match public records are common signs of altered documents.</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span><strong>Do not rely on a single document.</strong> Request at least two different types for every applicant. A pay stub alone does not confirm employment. A bank statement alone does not confirm the income source. Together, they do.</span></li></ul><div class="callout callout-info"><p class="callout-label">CRA Verification for Self-Employed Applicants</p><p>Self-employed applicants can request a <strong>Proof of Income Statement</strong> or <strong>Notice of Assessment (NOA)</strong> directly from the Canada Revenue Agency. These documents are difficult to falsify and provide a reliable picture of declared income. Applicants can request their own documents at <a href="https://www.canada.ca/en/revenue-agency/services/e-services/e-services-individuals/account-individuals.html" target="_blank" rel="noopener">CRA My Account</a>.</p></div><div class="resource-block"><h4>Income Verification Resources</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/income-verification-rental-app/" target="_blank" rel="noopener">SingleKey &mdash; Canadian landlord&#39;s guide to income verification by applicant type</a></li><li><a href="https://royalyorkpropertymanagement.ca/news-article/how-do-you-prove-income-to-rent-in-canada" target="_blank" rel="noopener">Royal York Property Management &mdash; How tenants prove income in Canada</a></li><li><a href="https://www.canada.ca/en/revenue-agency/services/e-services/e-services-individuals/account-individuals.html" target="_blank" rel="noopener">Canada Revenue Agency &mdash; CRA My Account (for applicants to request NOA)</a></li><li><a href="https://rentals.ca/blog/what-are-some-alternatives-for-proof-of-income" target="_blank" rel="noopener">Rentals.ca &mdash; Alternative income verification options for non-traditional earners</a></li></ul></div><div id="step5" class="step-header"><div class="step-number">5</div><h2 class="step-title">Check Rental History</h2></div><p>Rental history is the most direct predictor of how someone will behave as a tenant. Someone who paid on time, communicated well, and left a unit in good condition for the past five years is more likely to do the same for you than someone about whom you know nothing beyond their credit score.</p><p>Rental history also catches things that credit checks sometimes miss. A landlord who was not paid may not have reported it to a credit bureau. But they will usually tell you directly if you call them.</p><h3>What to look up before you call:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Search the applicant&#39;s name on <a href="https://openroom.ca" target="_blank" rel="noopener">Openroom</a>, which aggregates publicly available court-ordered landlord-tenant dispute records across Canada</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Check for past eviction orders on <a href="https://www.canlii.org/en/" target="_blank" rel="noopener">CanLII</a>, which contains publicly searchable tribunal and court decisions including landlord-tenant board rulings</span></li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span>Verify that the previous landlord names and addresses on the application match the applicant&#39;s credit report address history</span></li></ul><div class="callout callout-warn"><p class="callout-label">Important: &quot;Bad Tenant&quot; Lists</p><p>Alberta&#39;s Office of the Information and Privacy Commissioner advises landlords to avoid using informal &quot;bad tenant&quot; lists circulated on social media or private forums. These lists raise significant privacy concerns under PIPA and the information may be inaccurate, unverified, or collected without proper consent. Stick to public records platforms like CanLII and Openroom. See the <a href="https://oipc.ab.ca/resource/guidance-for-landlords-and-tenants/" target="_blank" rel="noopener">OIPC guidance for landlords and tenants</a> for detail.</p></div><div id="step6" class="step-header"><div class="step-number">6</div><h2 class="step-title">Call the References Properly</h2></div><p>Most landlords either skip reference calls entirely or treat them as a formality. Neither approach is defensible. A reference call, done correctly, is one of the most valuable pieces of information in your screening process.</p><p>The key is asking the right questions. Most previous landlords are willing to tell you exactly what you need to know if you give them clear, specific questions to answer. Vague questions get vague answers. Specific questions get useful ones.</p><div class="pull-quote"><p>A previous landlord who hesitates, deflects, or sticks to bare minimum confirmation is telling you something. Pay attention to what people do not say.</p></div><h3>For previous landlords, ask:</h3><div class="question-grid"><div class="q-card"><strong>On-time payment</strong>&quot;Did they pay rent on time consistently? Were there ever months where you had to follow up?&quot;</div><div class="q-card"><strong>Property condition</strong>&quot;What was the condition of the unit when they moved out? Were there any damage charges beyond normal wear and tear?&quot;</div><div class="q-card"><strong>Communication</strong>&quot;How did they communicate when something came up? Were they responsive and easy to reach?&quot;</div><div class="q-card"><strong>Neighbours and building</strong>&quot;Were there any noise complaints or issues with other residents during their tenancy?&quot;</div><div class="q-card"><strong>The direct question</strong>&quot;Would you rent to them again? If not, why not?&quot;</div><div class="q-card"><strong>Closing</strong>&quot;Is there anything I should know about them as a tenant that I have not asked about?&quot;</div></div><h3>For employers (income verification call), ask:</h3><div class="question-grid"><div class="q-card"><strong>Confirm employment</strong>&quot;Can you confirm that [name] is currently employed with your organization?&quot;</div><div class="q-card"><strong>Confirm income</strong>&quot;Can you confirm their approximate salary or hourly rate? They have authorized this inquiry in writing.&quot;</div><div class="q-card"><strong>Employment type</strong>&quot;Is their employment full-time, permanent? Or is it contract or seasonal?&quot;</div></div><h3>Red flags on reference calls:</h3><ul class="red-flags"><li><span class="flag-dot"></span>Previous landlord will only confirm dates and nothing else</li><li><span class="flag-dot"></span>Previous landlord says they would not rent to the person again but cannot or will not explain why</li><li><span class="flag-dot"></span>Phone numbers for previous landlords are disconnected, personal mobile phones only, or go to voicemail with no callback</li><li><span class="flag-dot"></span>The contact at the previous landlord address is the applicant&#39;s friend or family member, not an actual landlord</li><li><span class="flag-dot"></span>Employment line number does not match the company&#39;s publicly listed number</li><li><span class="flag-dot"></span>Employer cannot confirm the applicant&#39;s role or salary even with signed written consent provided</li><li><span class="flag-dot"></span>Applicant listed only personal friends or family members as references rather than professional contacts or landlords</li></ul><div class="callout callout-pro"><p class="callout-label">Pro Tip: The Current Landlord Problem</p><p>Applicants who know they are problem tenants sometimes list their current landlord knowing the landlord will say nice things to get them out. Ask about the landlord before their current one as well. Two data points are more reliable than one. Also note whether the previous tenancy ended by the tenant&#39;s choice or the landlord&#39;s.</p></div><div id="step7" class="step-header"><div class="step-number">7</div><h2 class="step-title">Conduct a Background Check</h2></div><p>A background check broadens the picture beyond financial history and rental track record. For most residential landlords with standard properties, a credit check, income verification, and thorough reference calls will be sufficient. A background check adds an additional layer that is worth considering for higher-risk situations.</p><p>Background checks in Canada can cover criminal history, public court records, and eviction records. They must be conducted with written consent and must comply with PIPA and provincial privacy legislation.</p><h3>What a background check typically covers:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Criminal record searches via the Canadian Police Information Centre (CPIC)</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Publicly available court decisions including prior eviction orders</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Fraud history from public documents and court records</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Previous addresses verified against stated history</li></ul><div class="callout callout-warn"><p class="callout-label">Human Rights Caution</p><p>A criminal record is not an automatic basis for rejecting a tenant. Alberta&#39;s Human Rights Act requires landlords to assess each situation individually. A conviction for a minor offence from fifteen years ago is different from a recent conviction for property-related violence. If a criminal record is a factor in your decision, make sure the connection to tenancy risk is clear, direct, and documented. For detailed guidance, see <a href="https://albertahumanrights.ab.ca/issues-with-housing/rental-housing/" target="_blank" rel="noopener">Alberta Human Rights Commission &mdash; Rental Housing</a>.</p></div><div class="resource-block"><h4>Background Check Services (Canada)</h4><ul class="resource-list"><li><a href="https://www.singlekey.com/en-ca/tenant-report/" target="_blank" rel="noopener">SingleKey &mdash; Background checks including criminal, fraud, and 200,000+ public databases</a></li><li><a href="https://www.tenantverification.ca/tenant-screening.html" target="_blank" rel="noopener">TVS Tenant Verification Service &mdash; Credit and criminal checks for Canadian landlords</a></li><li><a href="https://openroom.ca" target="_blank" rel="noopener">Openroom &mdash; Eviction record search from LTB decisions across Canada</a></li><li><a href="https://www.canlii.org/en/" target="_blank" rel="noopener">CanLII &mdash; Free searchable database of Canadian court and tribunal decisions</a></li><li><a href="https://oipc.ab.ca/resource/guidance-for-landlords-and-tenants/" target="_blank" rel="noopener">Alberta OIPC &mdash; Privacy guidance for landlords using third-party screening services</a></li></ul></div><div id="step8" class="step-header"><div class="step-number">8</div><h2 class="step-title">Make the Decision and Document It</h2></div><p>You have run the process. Now you need to decide. And however you decide, you need to document the reason.</p><p>Documentation protects you. If an unsuccessful applicant later claims they were rejected for a discriminatory reason, your documentation showing the objective criteria that led to your decision is your defence. It does not need to be elaborate. It needs to exist.</p><h3>How to evaluate what you have:</h3><table class="decision-table"><thead><tr><th>Signal</th><th>Weight it carries</th><th>What to do with it</th></tr></thead><tbody><tr><td>Strong credit + verified income + positive landlord references</td><td>High confidence</td><td>Approve. Document what you confirmed and how.</td></tr><tr><td>Low credit score but strong income and excellent rental history</td><td>Acceptable with context</td><td>Ask about the credit history. A specific past event explains differently than a chronic pattern.</td></tr><tr><td>Great income but no rental history (first-time renter)</td><td>Moderate risk, manageable</td><td>Consider a co-signer or larger security deposit (subject to provincial limits). Weighted income requirement.</td></tr><tr><td>Prior eviction on record</td><td>Serious risk signal</td><td>Ask directly. Understand the circumstances. Recent evictions for non-payment are a dealbreaker for most landlords.</td></tr><tr><td>Incomplete application or inability to verify key information</td><td>Automatic disqualification</td><td>Do not proceed. Document that the application was incomplete or unverifiable.</td></tr><tr><td>Inconsistencies between documents and application</td><td>High-risk signal</td><td>Ask for clarification in writing. If the explanation is unsatisfactory, decline and document.</td></tr></tbody></table><h3>For every applicant, keep on file:</h3><ul class="art-checklist"><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>The completed and signed rental application</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Credit report and the score or condition that informed your decision</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Income documents received and verified</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>Notes from all reference and employer calls, including who you spoke with and when</li><li><span class="art-check"><svg viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#2e6db4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>A brief written note explaining the reason for approval or denial, referencing your objective criteria</li></ul><div class="callout callout-info"><p class="callout-label">Declining an Application</p><p>In Alberta, you are not required to provide a reason for declining an applicant, but you are required to ensure your decision was not based on a protected ground. A written note for your own records that states the objective basis for denial (such as &quot;income below the minimum ratio&quot; or &quot;negative landlord reference from most recent tenancy&quot;) is good practice even when not shared with the applicant.</p></div><div class="art-divider"></div><h2>The Bigger Picture</h2><p>Tenant screening is not about finding a perfect person. It is about gathering enough reliable information to make an informed, defensible decision. The landlords who struggle most with tenants are usually the ones who skipped a step, moved too fast, or let optimism substitute for process.</p><p>A screening process also signals something to good tenants. Applicants who pay on time, maintain properties well, and communicate honestly are generally happy to provide documentation. The process itself filters for people who take the relationship seriously.</p><p>Run the same process with every applicant. Document what you find and what you decided. Keep those records for the duration of the tenancy and for a reasonable period after. That habit, done consistently, is what separates landlords who handle problems well from landlords who are surprised by them.</p><div class="kru-note"><div class="kru-note-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><p><strong>Once a tenant moves in, the next challenge is maintenance coordination.</strong> Kru helps landlords manage maintenance requests, approvals, contractor communication, and documentation in one place &mdash; so you are not chasing updates or rebuilding history from text threads. <a href="https://mykru.ca" target="_blank" rel="noopener">Learn how Kru works at mykru.ca</a>.</p></div><div class="art-cta"><h3>More guides like this, in your inbox</h3><p>PM Academy covers the operational side of being a landlord. Tenant screening, maintenance coordination, documentation, and what professional property management actually looks like.</p><a href="https://mykru.ca" class="art-cta-btn" target="_blank" rel="noopener">Visit PM Academy at mykru.ca</a></div>' });
  }
  localStorage.setItem('kru_seeded_v5', '1');
}

if(!localStorage.getItem('kru_seeded_v6')){
  const amc = DB.find('courses', c => c.title === 'Advanced Maintenance Coordination');
