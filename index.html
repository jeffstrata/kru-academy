const c2_m3 = DB.insert('modules', { course_id:c2.id, title:'Module 3: The Acquisition Process', description:'From pre-approval to closing day — the step-by-step process of buying an investment property in Canada.', sort_order:2 });
DB.insert('lessons', { module_id:c2_m3.id, title:'Lesson 3.1: Pre-Approval for Investment Properties', description:'How investor underwriting differs from owner-occupied and what OSFI CAR 2026 means', content_type:'text', text_content:'<h3>Investor Pre-Approval Is Not the Same</h3><p>When you call a mortgage broker and say you want to buy a rental property, the conversation changes immediately. The underwriting process for investment properties is fundamentally different from owner-occupied purchases, and understanding these differences before you start shopping prevents wasted time and disappointment.</p><h3>How Investor Underwriting Differs</h3><h4>Higher Scrutiny on Income Verification</h4><p>Lenders want to see <strong>two years of Notice of Assessments (NOAs)</strong> from CRA, T4s or T1 Generals, and — if you are self-employed — two years of financial statements. The bar for income verification is higher because the lender knows you will not be living in the property, which increases perceived default risk.</p><h4>Rental Income Treatment Varies by Lender</h4><p>This is where it gets nuanced. Different lenders treat projected rental income differently:</p><ul><li><strong>Add-back method (50–80%):</strong> The lender adds 50–80% of projected gross rent to your qualifying income. A $2,000/month rental adds $1,000–$1,600 to monthly qualifying income.</li><li><strong>Offset method:</strong> Rental income offsets the mortgage payment dollar-for-dollar, up to a maximum percentage. If rent is $2,000 and the mortgage payment is $1,800, the lender treats the property as roughly neutral.</li><li><strong>DCR method:</strong> Used mainly for multi-unit. The property must demonstrate a Debt Coverage Ratio of 1.10+, meaning NOI exceeds debt service by at least 10%.</li></ul><p>The method your lender uses significantly impacts how much you qualify for. A good mortgage broker will know which lenders use which method and match you to the best fit.</p><h3>OSFI CAR 2026 Clarification</h3><p>The Office of the Superintendent of Financial Institutions (OSFI) released updated Capital Adequacy Requirements (CAR) in 2026 that affect how federally regulated banks assess risk-weighted assets for investor mortgages. The key change: <strong>investor mortgages now carry a higher risk weight</strong> than owner-occupied mortgages of the same LTV tier. This means banks must hold more capital against investor loans, which increases their cost — and that cost is passed to borrowers through slightly higher rates or tighter qualification standards.</p><p>In practice, this means:</p><ul><li>Some lenders have tightened GDS/TDS caps specifically for investment properties</li><li>Rate premiums for investor mortgages have widened at some institutions</li><li>Lenders are more selective about which markets and property types they will finance</li></ul><p>The impact is modest but real. It reinforces the importance of shopping multiple lenders through a broker rather than going to your primary bank alone.</p><h3>What to Bring to Your Pre-Approval Meeting</h3><ol><li>Two years of NOAs from CRA</li><li>Recent pay stubs or T4s (employed) or two years of T1 Generals with financial statements (self-employed)</li><li>Current mortgage statement (if you own your home)</li><li>List of all debts with balances and monthly payments</li><li>Down payment proof — bank statements showing the funds and their source (gift, savings, RRSP, etc.)</li><li>A target property price range and market area</li></ol><h3>Pre-Approval vs. Pre-Qualification</h3><p>A <strong>pre-qualification</strong> is an estimate based on information you provide verbally. It means very little. A <strong>pre-approval</strong> involves the lender pulling your credit, verifying your documents, and issuing a conditional commitment for a specific mortgage amount. Get the pre-approval. It gives you confidence in your budget and signals to sellers that you are a serious buyer.</p>', duration:12, sort_order:0, is_free_preview:false });
DB.insert('lessons', { module_id:c2_m3.id, title:'Lesson 3.2: Offer Conditions and Due Diligence', description:'Financing conditions, inspection strategy, condo document review, and walk-away criteria', content_type:'text', text_content:'<h3>Writing an Offer on an Investment Property</h3><p>Your offer to purchase should include conditions that protect you while keeping the offer competitive. In a balanced or buyer&#39;s market, you have room for thorough conditions. In a hot market, you may need to narrow your conditions — but <strong>never waive them entirely on an investment property</strong>. The stakes are too high and the downside of a bad purchase too severe.</p><h3>Essential Conditions</h3><h4>1. Financing Condition (5–10 business days)</h4><p>Even with a pre-approval, include a financing condition. Your pre-approval is based on your financial profile — the lender still needs to approve the specific property. Appraisals can come in low, the property may not meet lender criteria (e.g., zoning issues, age, condition), or your lender may have restrictions on the specific market. A financing condition gives you a clean exit if the mortgage falls through.</p><h4>2. Inspection Condition (7–10 business days)</h4><p>A home inspection on an investment property is a <strong>decision tool, not a reassurance exercise</strong>. You are not looking for a perfect building — you are looking for information that changes your financial model. The inspection should answer: (1) Are there any major systems (roof, foundation, HVAC, plumbing, electrical) that need replacement in the next 3–5 years? (2) What is the estimated cost? (3) Does that cost change my cash flow projections enough to kill the deal?</p><p>Define your <strong>walk-away criteria before the inspection</strong>, not after. For example: "I will walk away if the inspection reveals more than $15,000 in deferred maintenance not already reflected in my purchase price." This prevents emotional decision-making when the inspector finds issues — and they will always find issues.</p><h4>3. Condo/Strata Document Review (if applicable)</h4><p>If buying a condo for rental purposes, the status certificate (Ontario), estoppel certificate (Alberta), or Form B Information Certificate (BC) is critical. Review:</p><ul><li><strong>Reserve fund study:</strong> Is the fund adequately funded? An underfunded reserve means special assessments in your future.</li><li><strong>Rental restrictions:</strong> Some condos cap the number of units that can be rented. If the cap is reached, you cannot rent your unit.</li><li><strong>Upcoming special assessments:</strong> Any planned major repairs that will require owner contributions.</li><li><strong>Condo corporation financials:</strong> Look for rising fees, legal disputes, or management problems.</li><li><strong>Insurance certificate:</strong> Confirm adequate coverage and check the deductible — high deductibles shift cost to unit owners.</li></ul><h3>Due Diligence Beyond the Inspection</h3><ul><li><strong>Rental market verification:</strong> Check actual asking rents on Rentals.ca, Kijiji, and Facebook Marketplace for comparable units in the same neighbourhood. Do not rely on the seller&#39;s claimed rental income.</li><li><strong>Municipal zoning confirmation:</strong> Verify the property is legally zoned for the number of units being rented. An illegal suite can create insurance, liability, and CRA problems.</li><li><strong>Property tax verification:</strong> Confirm current property taxes with the municipality. Reassessment after purchase can increase taxes significantly.</li><li><strong>Insurance quote:</strong> Get a landlord insurance quote before you finalize. Some properties (knob-and-tube wiring, aluminum wiring, oil tanks) are difficult or expensive to insure.</li></ul><h3>Making the Decision</h3><p>After due diligence, you have three options: proceed, renegotiate, or walk away. If the inspection or document review reveals issues that change your numbers, renegotiate the price or request repairs. If the issues are too large or the seller will not negotiate, use your condition to exit cleanly. The cost of walking away is a few hundred dollars in inspection fees. The cost of buying a problem property is tens of thousands.</p>', duration:15, sort_order:1, is_free_preview:false });
DB.insert('lessons', { module_id:c2_m3.id, title:'Lesson 3.3: Closing Costs and the First 30 Days', description:'Province-specific costs, the 12-16 week timeline, and what to set up before your first tenant', content_type:'text', text_content:'<h3>Closing Costs: What to Budget</h3><p>Closing costs on an investment property in Canada typically run <strong>2–4% of the purchase price</strong>. On a $400,000 property, budget $8,000–$16,000 above your down payment. These costs are often underestimated by first-time investors.</p><h3>Province-Specific Costs</h3><h4>Land Transfer Tax</h4><p>This is usually the largest closing cost. Rates vary significantly by province:</p><ul><li><strong>Ontario:</strong> Graduated rate — 0.5% on first $55,000, 1.0% on $55,001–$250,000, 1.5% on $250,001–$400,000, 2.0% on $400,001–$2,000,000. Plus Toronto municipal LTT if in the City of Toronto. On a $400,000 property in Toronto, combined LTT is approximately $11,300. First-time buyer rebates do not apply to investment properties.</li><li><strong>British Columbia:</strong> 1% on first $200,000, 2% on $200,001–$2,000,000. On $400,000: $6,000. Plus the Speculation and Vacancy Tax may apply depending on how the property is used.</li><li><strong>Alberta:</strong> No land transfer tax. Alberta charges a land title transfer fee of approximately $50 + $2 per $5,000 of property value. On $400,000: roughly $210. This is a major cost advantage for Alberta investors.</li><li><strong>Quebec:</strong> Graduated "Welcome Tax" (droits de mutation) — rates vary by municipality. Budget approximately 1.5% of purchase price.</li></ul><h4>Other Closing Costs</h4><ul><li><strong>Legal fees:</strong> $1,500–$2,500 for a real estate lawyer</li><li><strong>Title insurance:</strong> $300–$500</li><li><strong>Home inspection:</strong> $400–$600 (already paid during due diligence)</li><li><strong>Appraisal fee:</strong> $350–$500 (sometimes covered by lender)</li><li><strong>Property insurance:</strong> First year premium, often required before closing — $1,200–$2,400 for a rental property</li><li><strong>Utility hookups and deposits:</strong> $200–$500</li><li><strong>Mortgage broker fee:</strong> Usually $0 — brokers are compensated by the lender. If a broker charges you directly, ask why.</li></ul><h3>The 12–16 Week Acquisition Timeline</h3><p>From the day you decide to buy to the day you have a tenant paying rent, expect <strong>12 to 16 weeks</strong>:</p><ol><li><strong>Weeks 1–2:</strong> Pre-approval, define buy box, begin property search</li><li><strong>Weeks 3–6:</strong> View properties, run analysis on each, submit offers</li><li><strong>Weeks 6–8:</strong> Offer accepted, due diligence period (inspection, financing, document review)</li><li><strong>Weeks 8–10:</strong> Conditions waived, lawyer prepares closing documents</li><li><strong>Weeks 10–12:</strong> Closing day — keys in hand, mortgage funded, property registered</li><li><strong>Weeks 12–16:</strong> Prepare property for rental, list for tenants, screen applicants, sign lease</li></ol><h3>What to Set Up Before Your First Tenant</h3><p>Between closing and your first tenant, establish these systems:</p><ul><li><strong>Landlord insurance policy:</strong> Confirm coverage is active. Standard homeowner insurance does not cover rental properties.</li><li><strong>Separate bank account:</strong> Open a dedicated account for rental income and expenses. This simplifies tax reporting and protects you in disputes.</li><li><strong>Provincial lease template:</strong> Use the government-issued standard lease (mandatory in Ontario; recommended everywhere). Customize permitted clauses only.</li><li><strong>Tenant screening process:</strong> Credit check, employment verification, landlord references, income verification (minimum 3x monthly rent).</li><li><strong>Maintenance contacts:</strong> Licensed plumber, electrician, and general handyperson. Have these ready before something breaks.</li><li><strong>Documentation system:</strong> Digital folder structure for lease, inspection photos, receipts, and correspondence. You will need this for CRA reporting and any disputes.</li></ul><div class="content-bridge"><strong>Next up:</strong> You own the property. Now you are a landlord. Module 4 covers the operational systems you need in place before your first tenant moves in.</div>', duration:15, sort_order:2, is_free_preview:false });

DB.insert('lessons', { module_id:c2_m4.id, title:'Lesson 4.1: Self-Manage vs. Hire a Property Manager', description:'Time, compliance, and systems considerations — and an honest recommendation for year one', content_type:'text', text_content:'<h3>The Decision That Shapes Your First Year</h3><p>Within the first week of owning a rental property, you will face this question: should I manage this myself, or hire a property manager? The answer depends on three factors — your available time, your willingness to learn landlord-tenant law, and your tolerance for direct tenant interaction. There is no universally correct answer, but there is a recommended starting point.</p><h3>What a Property Manager Does</h3><p>A professional property manager handles:</p><ul><li>Tenant sourcing, screening, and lease signing</li><li>Rent collection and arrears follow-up</li><li>Maintenance coordination and contractor management</li><li>Routine inspections (typically quarterly)</li><li>Legal compliance — notices, rent increase procedures, dispute response</li><li>Move-in/move-out documentation and deposit handling</li></ul><p>The typical fee is <strong>8–12% of gross monthly rent</strong> plus a lease-up fee of 50–100% of one month&#39;s rent for placing a new tenant. On a $2,000/month rental, that is $160–$240/month ongoing plus $1,000–$2,000 each time a new tenant is placed.</p><h3>Time Commitment of Self-Management</h3><p>For a single well-maintained unit with a good tenant, self-management requires approximately <strong>3–5 hours per month</strong> during stable periods. That time goes to: rent tracking, responding to maintenance requests, coordinating repairs, and maintaining financial records. During tenant turnover, expect 15–25 hours over 2–3 weeks for listing, showing, screening, lease signing, and move-in documentation.</p><h3>Compliance Considerations</h3><p>Provincial landlord-tenant legislation is detailed and changes frequently. Self-managing means you are responsible for:</p><ul><li>Serving legally compliant notices (correct forms, correct timelines)</li><li>Following rent increase procedures exactly (90 days notice in most provinces, specific forms in Ontario)</li><li>Understanding grounds for and process of eviction (this varies dramatically by province)</li><li>Maintaining the property to provincial minimum housing standards</li><li>Handling security deposits according to provincial rules (some provinces require interest; others prohibit last-month&#39;s-rent deposits entirely)</li></ul><p>Getting any of these wrong can result in fines, void notices, or decisions against you at a landlord-tenant tribunal.</p><h3>The Honest Recommendation: Self-Manage Year One</h3><p>For your first rental property, <strong>self-manage for the first year</strong>. Here is why:</p><ol><li><strong>You will learn the business:</strong> Every landlord-tenant interaction, maintenance call, and CRA filing teaches you something you cannot learn from a course. This operational knowledge is essential even if you later hire a manager — because you need to evaluate whether your manager is doing a good job.</li><li><strong>You will understand your numbers:</strong> When you handle every expense, you know exactly where money goes. This makes your financial projections for future properties far more accurate.</li><li><strong>You will know when to delegate:</strong> After a year, you will know which tasks drain your time and which you handle efficiently. This lets you make an informed decision about what to outsource.</li><li><strong>You will save money:</strong> On a $2,000/month rental, self-management saves $2,400–$3,600/year. In Year 1, when cash flow is tightest, this matters.</li></ol><h3>When to Hire Immediately</h3><p>Skip the self-management learning year if: you live more than an hour from the property, you own multiple properties already, or your employment makes you genuinely unavailable for tenant communication during business hours. In these cases, the management fee is a necessary operating cost from day one.</p>', duration:12, sort_order:0, is_free_preview:false });
DB.insert('lessons', { module_id:c2_m4.id, title:'Lesson 4.2: Financial Systems From Day One', description:'Separate accounts, CRA T776 reporting, deductible expenses, and record retention requirements', content_type:'text', text_content:'<h3>Separate Everything</h3><p>On the day you close, open a <strong>dedicated bank account</strong> for your rental property. All rental income goes in. All property expenses come out. This is not legally required, but it is practically essential. Commingling rental income with personal funds creates an accounting nightmare at tax time and weakens your position in any CRA review.</p><p>Consider a business credit card for property expenses as well. This creates a second layer of documentation and often provides purchase protection on appliances and supplies.</p><h3>CRA T776 Reporting</h3><p>Every year, you must file <strong>Form T776: Statement of Real Estate Rentals</strong> with your personal tax return. This form reports your gross rental income, eligible expenses, and net rental income (or loss). Key sections:</p><ul><li><strong>Part 1:</strong> Identification — property address, ownership percentage, number of units</li><li><strong>Part 2:</strong> Income — gross rents received during the calendar year</li><li><strong>Part 3:</strong> Expenses — all deductible operating costs</li><li><strong>Part 4:</strong> Capital Cost Allowance (CCA) — depreciation of the building (optional; see below)</li></ul><h3>Deductible Expenses</h3><p>CRA allows you to deduct <strong>reasonable expenses incurred to earn rental income</strong>. The key deductible categories:</p><ul><li><strong>Mortgage interest:</strong> Only the interest portion of your payment — not the principal</li><li><strong>Property taxes:</strong> Fully deductible</li><li><strong>Insurance premiums:</strong> Landlord insurance policy costs</li><li><strong>Repairs and maintenance:</strong> Fixing or restoring something to its original condition (e.g., replacing a broken faucet, patching drywall, repainting)</li><li><strong>Property management fees:</strong> If you hire a manager</li><li><strong>Advertising:</strong> Costs to find tenants (listing fees, signage)</li><li><strong>Professional fees:</strong> Accounting, legal, and property management consulting</li><li><strong>Utilities:</strong> Any utilities you pay as the landlord (heat, water, electricity, internet if included in rent)</li><li><strong>Travel:</strong> Mileage to and from the property for management purposes (keep a log)</li></ul><h3>Current vs. Capital Expense Classification</h3><p>This distinction catches many new landlords. CRA classifies expenses as either <strong>current</strong> (fully deductible in the year incurred) or <strong>capital</strong> (added to the property&#39;s cost base and depreciated over time):</p><h4>Current Expenses (Deduct Immediately)</h4><p>Repairs that restore the property to its original condition. Replacing a broken window with the same type of window. Repainting in the same or similar colour. Fixing a leaky pipe. Replacing worn carpet with similar carpet.</p><h4>Capital Expenses (Depreciate Over Time)</h4><p>Improvements that enhance the property beyond its original condition, extend its useful life, or change its use. Adding a deck. Replacing a standard furnace with a high-efficiency model. Finishing a basement to create a new living space. New appliances where none existed before.</p><p>The test is: did you <strong>restore</strong> (current) or <strong>improve</strong> (capital)? When in doubt, consult an accountant — misclassification can trigger CRA reassessment.</p><h3>Record Retention: 6 Years Minimum</h3><p>CRA requires you to keep all supporting documents for <strong>six years from the end of the tax year</strong> to which they relate. For a 2026 tax filing, keep records until at least the end of 2032. Digital copies are acceptable — scan every receipt, invoice, and statement. Use a consistent folder structure: Year &gt; Month &gt; Category. This is not optional; failure to produce records during an audit results in denied deductions.</p>', duration:15, sort_order:1, is_free_preview:false });
DB.insert('lessons', { module_id:c2_m4.id, title:'Lesson 4.3: Setting Up Your Maintenance System', description:'Request channels, approval workflows, contractor lists, and an introduction to the Kru platform', content_type:'text', text_content:'<h3>Why Systems Matter From Day One</h3><p>Maintenance is the operational core of property management. A broken furnace at 11 PM in January, a leaking pipe on a Saturday morning, a tenant reporting mould in the bathroom — these are not hypotheticals. They will happen. The question is whether you have a system to handle them efficiently or whether each event becomes a stressful, improvised response.</p><h3>Single Request Channel</h3><p>Establish <strong>one channel</strong> for all maintenance requests from your tenant. Not text messages, not phone calls, not emails — one designated channel. Options:</p><ul><li><strong>Property management software:</strong> Platforms like Kru provide a tenant portal where requests are submitted, tracked, and documented automatically</li><li><strong>Dedicated email address:</strong> e.g., maintenance@yourdomain.com — simple but requires manual tracking</li><li><strong>Shared form:</strong> A Google Form or similar that captures the issue, location, urgency, and photos</li></ul><p>The single-channel rule exists for documentation. When all requests come through one system, you have a timestamped record of every issue reported, every response given, and every resolution completed. This protects you legally and operationally.</p><h3>Approval Workflow</h3><p>Define a clear approval process based on cost thresholds:</p><ul><li><strong>Under $200:</strong> Tenant can proceed with minor fixes (e.g., replacing a light switch cover) and submit receipt for reimbursement, or you handle directly without formal approval</li><li><strong>$200–$1,000:</strong> Contractor quotes required. You approve before work begins. Aim for 24–48 hour turnaround on approval.</li><li><strong>Over $1,000:</strong> Two to three quotes required. You approve before work begins. Timeline communicated to tenant.</li><li><strong>Emergency (any cost):</strong> Authorized immediately. Emergencies include water leaks, no heat in winter, gas leaks, fire damage, and security breaches (broken locks or windows).</li></ul><h3>Building Your Contractor List</h3><p>Before your first tenant moves in, have contact information for:</p><ul><li><strong>Licensed plumber</strong> — the most common emergency call</li><li><strong>Licensed electrician</strong> — required for any electrical work by code</li><li><strong>HVAC technician</strong> — furnace and AC service and repair</li><li><strong>General handyperson</strong> — minor repairs, painting, caulking, fixture replacement</li><li><strong>Locksmith</strong> — lockouts and rekeying</li><li><strong>Appliance repair</strong> — if you provide appliances</li></ul><p>For each contractor, record: name, phone, email, hourly rate, availability (including after-hours), and whether they invoice or require payment on completion. Ask other landlords in your area for referrals — reliability is more important than the lowest rate.</p><h3>Emergency Protocol</h3><p>Create a simple one-page emergency protocol and provide it to your tenant at move-in:</p><ol><li>If there is immediate danger to life (fire, gas leak, flood), call 911 first</li><li>Contact the landlord/manager immediately via phone (not the regular maintenance channel)</li><li>For after-hours emergencies: provide a direct phone number that will be answered</li><li>Shut off the water main if there is an active leak (show the tenant where the shut-off valve is during move-in)</li></ol><h3>Documentation System</h3><p>Every maintenance interaction should be documented: the original request, your response, the work performed, the cost, and the resolution. This documentation serves three purposes: (1) CRA expense records for tax deductions, (2) legal protection in tenant disputes, and (3) building a maintenance history that informs your capital planning and future property purchases.</p><h3>Introduction to Kru</h3><p>The Kru property management platform integrates maintenance request tracking, contractor management, expense documentation, and tenant communication into a single system. For a first-time landlord, it replaces the spreadsheets, email folders, and manual tracking that otherwise consume hours each month. As your portfolio grows, the centralized system scales with you.</p><div class="content-bridge"><strong>Next up:</strong> You have completed the course. Take the final exam below to test your knowledge and earn your Landlord Academy Certificate.</div>', duration:12, sort_order:2, is_free_preview:false });

const c3_m1 = DB.insert('modules', { course_id:c3.id, title:'The Alberta Residential Tenancies Act', description:'Understand the foundational legislation that governs every landlord-tenant relationship in Alberta — from lease formation to rent increases.', sort_order:0 });

DB.insert('lessons', { module_id:c3_m1.id, title:'Lease Agreements and Non-Waivable Rights', description:'Written vs oral agreements, required lease terms, what clauses are automatically void, the hierarchy of RTA over private contracts.', content_type:'text', text_content:'<h3>The Foundation of Every Tenancy</h3><p>Every professional property manager in Alberta must understand one fundamental truth: the <strong>Residential Tenancies Act (RTA)</strong> sits above every private contract you will ever draft. It does not matter what a tenant signs, what a landlord insists upon, or what both parties verbally agree to — if a clause in your lease contradicts the RTA, that clause is <strong>automatically void and unenforceable</strong>.</p><p>This is the concept of <strong>non-waivable rights</strong>, and it is the single most important legal principle in Alberta residential tenancy law. Section 5 of the RTA states clearly that any agreement that waives or modifies a tenant\'s rights under the Act is void. A tenant cannot \"agree\" to give up their protections, even voluntarily.</p><h3>Written vs. Oral Agreements</h3><p>Alberta law recognizes both written and oral tenancy agreements as legally binding. However, the practical difference is enormous. An oral agreement still creates a valid tenancy, but it makes proving the specific terms — rent amount, included utilities, pet permissions, parking — extremely difficult if a dispute arises before the <strong>Residential Tenancy Dispute Resolution Service (RTDRS)</strong>.</p><p>As a property manager, you should <strong>always use a written lease</strong>. The RTA requires that if a written agreement exists, the landlord must provide the tenant with a copy within 21 days of signing. Failure to do so does not void the tenancy, but it weakens your legal position and signals poor practice.</p><h4>Required Lease Terms</h4><p>While Alberta does not mandate a specific government-issued lease form (unlike Ontario), your written agreement should include:</p><ul><li>Full legal names of all tenants and the landlord or property management company</li><li>The civic address of the rental premises</li><li>The amount of rent and when it is due</li><li>The term of the tenancy (fixed-term end date or periodic basis)</li><li>The amount of any security deposit collected</li><li>What utilities or services are included in the rent</li><li>Rules regarding pets, smoking, guests, and parking</li></ul><h3>Clauses That Are Automatically Void</h3><p>This is where new property managers get into serious trouble. You cannot contract around the RTA. The following types of clauses, even if signed by the tenant, are <strong>unenforceable</strong>:</p><ul><li><strong>Waiving the right to dispute:</strong> Any clause that says the tenant gives up the right to file with the RTDRS is void.</li><li><strong>Excessive security deposits:</strong> Any clause requiring more than one month\'s rent as a security deposit violates Section 46 and is void to the extent it exceeds the maximum.</li><li><strong>Unauthorized entry:</strong> Clauses granting the landlord unlimited or unrestricted access to the unit override the 24-hour notice requirement and are void.</li><li><strong>Accelerated rent clauses:</strong> Requiring the tenant to pay the entire remaining lease balance upon a single missed payment is not permitted.</li><li><strong>Automatic lease renewal penalties:</strong> Charging a fee for failing to renew a fixed-term lease contradicts the tenant\'s right to vacate at the end of the term.</li></ul><h3>The Hierarchy: RTA Over Private Contracts</h3><p>Think of Alberta tenancy law as a layered system. At the top sits the RTA and its regulations. Below that are any applicable municipal bylaws (such as property standards). Below that is your lease agreement. And at the bottom are any verbal understandings or informal arrangements.</p><p>When there is a conflict between layers, the higher authority wins — always. This means your lease can add terms that the RTA does not address (like pet deposits within legal limits, or specific quiet hours), but it <strong>cannot remove or reduce</strong> protections that the RTA provides.</p><h4>Practical Implication</h4><p>Before you use any lease template — whether purchased online, provided by a landlord association, or drafted by a lawyer — you must review every clause against the current RTA. Templates from other provinces are particularly dangerous because tenancy law varies dramatically across Canada. An Ontario lease clause about last month\'s rent deposits, for example, has no legal basis in Alberta.</p><p>The safest approach is to use the standard lease template provided by the <strong>Service Alberta</strong> website as your starting point, then customize it with additional lawful terms specific to your property.</p>', duration:15, sort_order:0, is_free_preview:true });

DB.insert('lessons', { module_id:c3_m1.id, title:'Entry Rights and Quiet Enjoyment', description:'24-hour notice rules, acceptable reasons for entry, tenant\'s right to peace, practical protocols for inspections and showings.', content_type:'text', text_content:'<h3>The Tenant\'s Right to Quiet Enjoyment</h3><p>Section 29 of the Alberta RTA establishes one of the most important tenant protections in residential tenancy law: the <strong>right to quiet enjoyment</strong>. This does not mean the unit must be silent. It means the tenant has the right to use and enjoy the rental premises without substantial interference from the landlord, the landlord\'s agents, or other tenants in the building.</p><p>For property managers, this right creates a legal boundary. You own (or manage) the property, but once a tenancy begins, the tenant has <strong>exclusive possession</strong> of their unit. You cannot treat it as your own space. Every entry must be legally justified and properly noticed.</p><h3>The 24-Hour Written Notice Rule</h3><p>Under Section 27 of the RTA, a landlord must provide the tenant with <strong>at least 24 hours\' written notice</strong> before entering the rental premises. This notice must include:</p><ul><li>The date of entry</li><li>A reasonable time window (not \"anytime Tuesday\" — specify a window such as 10:00 AM to 12:00 PM)</li><li>The reason for entry</li></ul><p>The notice must be in writing. A text message or email can satisfy this requirement if that is an established communication method, but a verbal mention in the hallway does not. Best practice is to use a standard entry notice form delivered to the tenant\'s door or mailbox, with a copy retained in your files.</p><h4>Acceptable Reasons for Entry</h4><p>The RTA limits the reasons a landlord may enter to the following:</p><ol><li><strong>To inspect the condition of the premises</strong> — but only at reasonable intervals, typically no more than once per quarter unless there is cause for concern.</li><li><strong>To make repairs or perform maintenance</strong> — this includes both scheduled maintenance and necessary repairs that the tenant has reported.</li><li><strong>To show the unit to prospective tenants or buyers</strong> — but only after proper notice has been given to terminate the tenancy, or if the property is listed for sale.</li><li><strong>Emergency entry</strong> — in the case of fire, flood, gas leak, or other emergencies that threaten life or property, no notice is required.</li></ol><h3>When You Do Not Need Notice</h3><p>There are limited circumstances where the 24-hour rule does not apply:</p><ul><li><strong>Emergency:</strong> Immediate danger to persons or property (e.g., burst pipe, fire, carbon monoxide alarm).</li><li><strong>Tenant consent:</strong> The tenant expressly agrees to the entry at that time. However, relying on verbal consent is risky — document it.</li><li><strong>Abandonment:</strong> If you have reasonable grounds to believe the tenant has abandoned the premises, you may enter to verify.</li></ul><h3>Practical Protocols for Inspections</h3><p>Professional property managers should establish clear, repeatable protocols for unit entry:</p><ul><li>Use a <strong>standard inspection form</strong> that documents the date, time, attendees, and condition of each room.</li><li>Take <strong>dated photographs</strong> during every inspection — these become critical evidence if a security deposit dispute arises later.</li><li>Schedule inspections at <strong>move-in, quarterly (or semi-annually), and move-out</strong> at minimum.</li><li>Always knock and announce yourself before entering, even when you have provided proper notice and the tenant is not home.</li></ul><h3>Showings During Active Tenancies</h3><p>When a tenancy is ending and you need to show the unit to prospective tenants, the RTA allows this with 24-hour notice. However, you must be reasonable. Scheduling showings every day for three weeks will likely constitute a violation of quiet enjoyment, even with proper notice each time.</p><p>A practical approach is to <strong>batch showings</strong> into designated time slots (e.g., Saturdays from 1:00 PM to 3:00 PM) and communicate the schedule to the current tenant in advance. This respects both your business need and their legal right to peaceful possession.</p><h4>Consequences of Violating Entry Rights</h4><p>A tenant who believes their entry rights have been violated can file a complaint with the RTDRS. If the adjudicator finds that you entered without proper notice or without a valid reason, you may be ordered to pay compensation to the tenant and be warned against future violations. Repeated violations can support a tenant\'s application to terminate the lease early on the grounds that the landlord has substantially breached the agreement.</p>', duration:12, sort_order:1, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m1.id, title:'Rent Increases and Fee Restrictions', description:'Alberta\'s no-cap but timing-restricted approach, once per 365 days rule, restrictions on additional fees, comparison to rent-controlled provinces.', content_type:'text', text_content:'<h3>Alberta\'s Unique Approach to Rent Regulation</h3><p>Alberta is one of the few Canadian provinces with <strong>no rent control</strong>. There is no cap on how much a landlord can increase rent — not 2%, not tied to CPI, not limited by any formula. This surprises many property managers who move to Alberta from British Columbia, Ontario, Manitoba, or Prince Edward Island, where rent increase caps are strictly enforced.</p><p>However, \"no cap\" does not mean \"no rules.\" The RTA imposes <strong>strict procedural requirements</strong> on rent increases, and violating these procedures makes the increase unenforceable even if the amount itself would otherwise be lawful.</p><h3>The 365-Day Rule</h3><p>Under Section 37 of the RTA, a landlord may increase rent <strong>no more than once in any 365-day period</strong>. This is calculated from the last rent increase, not from the start of the tenancy. So if a tenant moved in on January 1 and you increased rent on July 1, the next increase cannot take effect until at least July 1 of the following year.</p><p>Additionally, the landlord must provide the tenant with <strong>written notice at least 12 full tenancy periods</strong> before the increase takes effect. For a month-to-month tenancy, this means a full 12 months\' notice. For a weekly tenancy, it means 12 weeks\' notice.</p><h4>Notice Requirements</h4><p>The rent increase notice must:</p><ul><li>Be in writing (not verbal)</li><li>State the new rent amount (not just the increase amount)</li><li>State the effective date of the increase</li><li>Be served at least 12 full tenancy periods in advance</li></ul><p>If you fail to give proper notice, the increase is <strong>void</strong>. The tenant continues paying the current rent, and you must start the notice process over from the beginning.</p><h3>Fixed-Term Leases and Rent Increases</h3><p>A critical point that many landlords misunderstand: rent cannot be increased during a <strong>fixed-term lease</strong> unless the lease agreement specifically includes a rent increase clause with the amount or formula stated. If the lease says \"$1,500 per month for 12 months\" and contains no escalation clause, the rent stays at $1,500 for the entire term regardless of market conditions.</p><p>This is why sophisticated property managers include a <strong>rent escalation clause</strong> in fixed-term leases — for example, \"Rent will increase to $1,600 per month beginning in month 13 if the tenancy continues.\" Without such a clause, you must wait until the fixed term expires and provide proper notice for the new periodic tenancy.</p><h3>Restrictions on Additional Fees</h3><p>Alberta landlords cannot simply add fees on top of rent to increase revenue. The RTA restricts the types of charges a landlord can impose:</p><ul><li><strong>Late fees:</strong> The RTA does not authorize late payment fees. While some landlords include them in leases, their enforceability at the RTDRS is inconsistent. A safer approach is to pursue the actual remedy: serving a <strong>14-day notice for substantial breach</strong> (non-payment of rent).</li><li><strong>NSF charges:</strong> A reasonable NSF fee (typically $25–$50) is generally accepted if it reflects the landlord\'s actual bank charges.</li><li><strong>Pet deposits:</strong> Alberta allows a <strong>non-refundable pet fee</strong>, but the total of the security deposit and pet fee combined cannot exceed one month\'s rent. Many landlords misunderstand this — the pet fee is not in addition to the one-month cap; it comes out of it.</li><li><strong>Key replacement fees:</strong> Reasonable charges for lost keys or fobs are generally permissible if stated in the lease and reflecting actual cost.</li></ul><h3>Comparison to Rent-Controlled Provinces</h3><p>Understanding where Alberta sits in the national landscape helps you advise property owners:</p><ul><li><strong>British Columbia:</strong> Annual cap tied to CPI (e.g., 3.5% for 2024), applies to existing tenancies only.</li><li><strong>Ontario:</strong> Guideline increase of 2.5% (2024), but units first occupied after November 15, 2018 are exempt.</li><li><strong>Manitoba:</strong> Annual guideline set by the Residential Tenancies Branch.</li><li><strong>Alberta:</strong> No cap. Increase by any amount, but only once per 365 days with 12 tenancy periods\' notice.</li></ul><p>Alberta\'s model gives landlords pricing flexibility but demands procedural discipline. The most common legal errors are not about the amount of an increase — they are about <strong>timing and notice</strong>.</p><div class="content-bridge"><strong>Next up:</strong> You understand the legal framework governing the relationship. Module 2 covers the two areas where landlords make the most expensive mistakes: security deposits and lease termination.</div>', duration:12, sort_order:2, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m2.id, title:'Security Deposit Rules', description:'Maximum amount, trust account requirement, no increases with rent increases, interest obligations.', content_type:'text', text_content:'<h3>The One-Month Maximum</h3><p>Section 46 of the Alberta RTA sets an absolute ceiling on security deposits: a landlord may collect <strong>no more than one month\'s rent</strong> as a security deposit. This is calculated based on the rent at the time the deposit is collected — not future rent, not market rent, and not some aspirational amount.</p><p>If the monthly rent is $1,800, the maximum security deposit is $1,800. Collecting $2,000 violates the Act, and the tenant can file with the RTDRS to have the excess returned. More importantly for property managers, this limit includes any non-refundable pet fee. The total of the security deposit plus any pet damage deposit <strong>cannot exceed one month\'s rent</strong>.</p><h3>The Trust Account Requirement</h3><p>This is the rule that catches more landlords off guard than any other. Under Section 47 of the RTA, a landlord must deposit the security deposit into a <strong>trust account at an approved financial institution</strong> within <strong>2 banking days</strong> of receiving it. Not two calendar days — two <strong>banking days</strong>. If you collect a deposit on Friday, it must be deposited by the end of business on Tuesday (assuming Monday is not a holiday).</p><p>The trust account must be:</p><ul><li>Held at a bank, credit union, or trust company in Alberta</li><li>Designated as a trust account (not the landlord\'s personal or operating account)</li><li>Used solely for holding security deposits</li></ul><h4>Why This Matters</h4><p>Failure to deposit into a trust account within 2 banking days gives the tenant the right to demand the <strong>full return of the deposit immediately</strong>, regardless of the condition of the unit. This is not a theoretical risk — RTDRS adjudicators enforce this provision routinely. A landlord who kept a $1,500 deposit in their personal account for even one extra day has lost the legal right to retain any of it for damages.</p><h3>No Increases With Rent Increases</h3><p>When you raise the rent, you <strong>cannot</strong> demand an additional security deposit to match the new amount. The deposit is fixed at the amount collected at the start of the tenancy. If the original rent was $1,400 and you collected a $1,400 deposit, then later raise the rent to $1,600, the deposit remains $1,400. You have no legal basis to request an additional $200.</p><p>This is a significant difference from some other jurisdictions and is a common source of landlord error in Alberta.</p><h3>Interest on Security Deposits</h3><p>Alberta requires landlords to pay <strong>interest on security deposits</strong>. The interest rate is set annually by regulation and published by Service Alberta. In recent years, rates have ranged from 0% to approximately 1.5%, depending on market conditions.</p><p>Key rules for interest:</p><ul><li>Interest accrues from the date the deposit is received to the date the tenancy ends.</li><li>Interest must be paid to the tenant when the deposit is returned, or applied against any lawful deductions.</li><li>The landlord must use the rate prescribed for each calendar year the deposit was held — not a single blended rate.</li><li>Failing to pay required interest is a breach of the Act and can result in the landlord being ordered to return the full deposit.</li></ul><h3>Documenting the Deposit</h3><p>Best practice requires meticulous documentation:</p><ul><li><strong>Issue a receipt</strong> to the tenant immediately upon collecting the deposit, showing the amount, date, and method of payment.</li><li><strong>Record the trust account deposit</strong> with the bank receipt showing the date it was deposited (proof of the 2-banking-day compliance).</li><li><strong>Conduct a move-in inspection</strong> with the tenant present, using a detailed checklist with photographs. This is your baseline for any future damage claim.</li><li><strong>Retain all records</strong> for at least three years after the tenancy ends, as the RTDRS allows claims within a two-year limitation period.</li></ul><p>The security deposit is the most litigated issue in Alberta residential tenancy law. Getting these rules right is not optional — it is the minimum standard of professional property management.</p>', duration:15, sort_order:0, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m2.id, title:'The 10-Day and 30-Day Accounting Rules', description:'Return timeline, detailed statement requirements, estimated vs final statements, what happens when you miss the deadline.', content_type:'text', text_content:'<h3>The Clock Starts at Move-Out</h3><p>When a tenancy ends in Alberta, the landlord has a strict, two-stage timeline for dealing with the security deposit. Understanding these deadlines is critical because <strong>missing them means you lose the deposit entirely</strong> — regardless of actual damages to the unit.</p><h3>The 10-Day Inspection Report</h3><p>Within <strong>10 days</strong> after the tenant vacates and returns the keys, the landlord must conduct a move-out inspection and provide the tenant with a written inspection report. This report should detail the condition of every area of the unit and identify any damage beyond normal wear and tear.</p><p>The 10-day inspection is your opportunity to document the state of the property. Best practices include:</p><ul><li>Use the <strong>same inspection form</strong> you used at move-in, allowing side-by-side comparison.</li><li>Take <strong>dated, high-resolution photographs</strong> of every room, appliance, fixture, and any area of concern.</li><li>Note specific damages with descriptions: \"3-inch hole in bedroom drywall\" is enforceable; \"unit was damaged\" is not.</li><li>If the tenant is available, conduct the inspection <strong>jointly</strong> and have both parties sign the report.</li></ul><h3>The Statement of Account</h3><p>After completing the inspection, the landlord must provide the tenant with a <strong>statement of account</strong> and return the deposit (or the balance after lawful deductions) within <strong>30 days</strong> of the tenancy ending. This 30-day period runs from the date the tenant surrenders possession, not from the date of the inspection.</p><p>The statement of account must include:</p><ul><li>The original deposit amount plus accrued interest</li><li>An itemized list of each deduction with the specific amount</li><li>The reason for each deduction (referencing specific damage or unpaid rent)</li><li>Receipts or invoices supporting repair costs, where available</li><li>The balance being returned to the tenant</li></ul><h4>Estimated vs. Final Statements</h4><p>Sometimes repair costs are not known within the 30-day window — for example, if you are waiting for a contractor\'s invoice. In this case, you may provide an <strong>estimated statement</strong> within the 30-day period, followed by a <strong>final statement</strong> once actual costs are confirmed. However, you must still return any undisputed portion of the deposit within 30 days.</p><p>The estimated statement must clearly indicate it is an estimate, specify which items are estimated, and provide a reasonable timeline for the final accounting.</p><h3>What Happens When You Miss the Deadline</h3><p>This is the most punitive provision in the Alberta RTA for landlords. If you fail to provide the statement of account and return the deposit (or balance) within <strong>30 days</strong>, the tenant is entitled to the <strong>full return of the deposit plus interest</strong>. You lose the right to make any deductions — even if the tenant caused $5,000 in damages.</p><p>RTDRS adjudicators enforce this strictly. \"I was busy,\" \"I was waiting for quotes,\" and \"I didn\'t have the tenant\'s forwarding address\" are not accepted excuses.</p><h3>Permissible Deductions</h3><p>You may only deduct from the security deposit for:</p><ul><li><strong>Unpaid rent</strong> — documented with your rent ledger</li><li><strong>Damage beyond normal wear and tear</strong> — supported by move-in vs. move-out inspection comparison and repair invoices</li><li><strong>Unpaid utilities</strong> that the tenant was responsible for under the lease</li><li><strong>Cleaning costs</strong> — but only if the unit was left in a condition substantially worse than at move-in</li></ul><p>You <strong>cannot</strong> deduct for normal wear and tear: minor scuffs on walls, worn carpet in high-traffic areas, faded paint, or minor nail holes from hanging pictures.</p>', duration:12, sort_order:1, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m2.id, title:'Terminating a Tenancy in Alberta', description:'Fixed-term vs periodic, tenant vs landlord notice periods, valid grounds for landlord termination, 14-day substantial breach process, tenant dispute rights.', content_type:'text', text_content:'<h3>Two Types of Tenancies, Two Sets of Rules</h3><p>Alberta recognizes two fundamental tenancy types, and the termination rules differ significantly between them.</p><h4>Fixed-Term Tenancies</h4><p>A fixed-term lease has a defined start and end date — typically 12 months. When the term expires, the tenancy ends <strong>automatically</strong> unless both parties agree to renew. Neither the landlord nor the tenant is required to give notice for the tenancy to end at the expiration of a fixed term. However, if the tenant remains in possession after the term expires and the landlord accepts rent, the tenancy converts to a <strong>periodic (month-to-month) tenancy</strong> by operation of law.</p><h4>Periodic Tenancies</h4><p>A periodic tenancy has no fixed end date and continues indefinitely until properly terminated by either party. The notice periods depend on the tenancy period:</p><ul><li><strong>Monthly tenancy:</strong> Tenant must give at least 1 full calendar month\'s notice. Landlord must give at least 3 full calendar months\' notice without cause.</li><li><strong>Weekly tenancy:</strong> Tenant must give at least 1 full tenancy week\'s notice. Landlord must give at least 3 full tenancy weeks\' notice.</li></ul><h3>Landlord Termination: Valid Grounds</h3><p>A landlord can terminate a tenancy before the natural end of the term only for specific reasons recognized by the RTA:</p><ol><li><strong>Non-payment of rent:</strong> The landlord may issue a <strong>14-day notice</strong> to terminate for substantial breach when rent is overdue. If the tenant pays all arrears within the 14-day period, the notice is voided and the tenancy continues.</li><li><strong>Substantial breach:</strong> Conduct that materially violates the lease — such as unauthorized occupants, illegal activity, or serious property damage — justifies a 14-day notice.</li><li><strong>Landlord\'s own use:</strong> The landlord or an immediate family member intends to occupy the unit. Requires proper notice (3 months for periodic tenancies) and must be a genuine intention.</li><li><strong>Demolition or major renovation:</strong> The unit will be demolished or renovated to such an extent that it cannot be occupied. Requires 365 days\' notice.</li></ol><h3>The 14-Day Substantial Breach Process</h3><p>This is the most commonly used termination mechanism, and it must be followed precisely:</p><ol><li><strong>Identify the breach</strong> — non-payment, unauthorized pets, illegal activity, excessive noise complaints documented with evidence.</li><li><strong>Serve the 14-day notice</strong> — in writing, specifying the breach, the remedy required, and the date by which the tenant must comply.</li><li><strong>Wait the full 14 days</strong> — the tenant has the legal right to this cure period.</li><li><strong>If unresolved, file with the RTDRS</strong> — apply for a termination order. You cannot change the locks, remove the tenant\'s belongings, or shut off utilities. Only the RTDRS can order a tenant to vacate.</li></ol><h3>Tenant Dispute Rights</h3><p>A tenant who receives a termination notice has the right to <strong>dispute it at the RTDRS</strong>. Common disputes include:</p><ul><li>The notice was not properly served (wrong method, insufficient time)</li><li>The breach has been remedied within the 14-day period</li><li>The landlord\'s \"own use\" claim is not genuine</li><li>The alleged breach does not constitute a substantial breach under the Act</li></ul><p>As a property manager, you must never attempt a <strong>self-help eviction</strong>. Changing locks, removing doors, shutting off heat or water, or physically removing a tenant\'s belongings are all illegal in Alberta and expose you to significant liability.</p><div class="content-bridge"><strong>Next up:</strong> You know how to handle deposits and termination correctly. But the most legally dangerous phase is before the tenancy even starts. Module 3 covers tenant screening in a way that protects you from human rights complaints.</div>', duration:18, sort_order:2, is_free_preview:false });

const c3_m3 = DB.insert('modules', { course_id:c3.id, title:'Tenant Screening and Human Rights Compliance', description:'Learn how to collect applicant information lawfully under PIPA, avoid human rights violations during screening, and build a defensible process.', sort_order:2 });

DB.insert('lessons', { module_id:c3_m3.id, title:'PIPA Compliance — Collecting Tenant Information', description:'Express consent requirement, purpose disclosure, what data you can collect, landlord reference verification protocols.', content_type:'text', text_content:'<h3>Privacy Law Applies to Landlords</h3><p>Many property managers are unaware that Alberta has its own private-sector privacy legislation: the <strong>Personal Information Protection Act (PIPA)</strong>. Unlike the federal PIPEDA, which applies to federally regulated organizations, PIPA governs how <strong>all private organizations in Alberta</strong> — including landlords and property management companies — collect, use, and disclose personal information.</p><p>Every rental application you process involves collecting sensitive personal data: full legal names, dates of birth, Social Insurance Numbers, employment details, income figures, credit history, and references. PIPA sets strict rules on how you handle this information.</p><h3>The Three Pillars of PIPA Compliance</h3><h4>1. Express Consent</h4><p>Before collecting any personal information from a prospective tenant, you must obtain their <strong>express, informed consent</strong>. This means:</p><ul><li>The applicant must know <strong>what information</strong> you are collecting.</li><li>They must understand the <strong>purpose</strong> for which it will be used.</li><li>They must agree <strong>voluntarily</strong> — consent obtained under duress or as a non-negotiable condition may not satisfy PIPA.</li></ul><p>Best practice is to include a <strong>clear, plain-language consent clause</strong> at the top of your rental application form, separate from the rest of the application, with a dedicated signature line.</p><h4>2. Purpose Limitation</h4><p>You may only collect information that is <strong>reasonably necessary</strong> for the stated purpose — in this case, evaluating the applicant\'s suitability as a tenant. You cannot collect information \"just in case\" or for unrelated purposes.</p><p>For example, you need to verify income to assess ability to pay rent. You do not need to know the applicant\'s medical history, religious affiliation, or political beliefs. Collecting such information — even if the applicant volunteers it — creates legal risk under both PIPA and the Alberta Human Rights Act.</p><h4>3. Retention and Destruction</h4><p>Personal information collected during screening must be:</p><ul><li><strong>Stored securely</strong> — locked filing cabinets for paper records, encrypted storage for digital records.</li><li><strong>Retained only as long as necessary</strong> — if the applicant is not selected, their information should be destroyed within a reasonable period (typically 90 days).</li><li><strong>Destroyed securely</strong> — shredding for paper, secure deletion for digital files.</li></ul><h3>Landlord Reference Verification</h3><p>Calling previous landlords is one of the most valuable screening tools, but it must be done carefully:</p><ul><li><strong>Only contact references the applicant has provided</strong> — calling a landlord the applicant did not list may violate their consent.</li><li><strong>Ask factual questions:</strong> Did the tenant pay rent on time? Did they give proper notice? Was there damage beyond normal wear and tear? Would you rent to them again?</li><li><strong>Do not ask about</strong> the tenant\'s personal life, family status, health, or any protected ground under the Human Rights Act.</li><li><strong>Document the conversation</strong> — note the date, time, who you spoke with, and their responses.</li></ul><h3>Credit Checks</h3><p>Running a credit check requires the applicant\'s <strong>written consent</strong>. You must use a licensed credit reporting agency (such as Equifax or TransUnion) and you must have a permissible purpose. Evaluating a rental application is a permissible purpose. Sharing the results with anyone other than decision-makers involved in the application is not.</p>', duration:12, sort_order:0, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m3.id, title:'Alberta Human Rights Act and Protected Grounds', description:'Full list of protected grounds, source of income discrimination, rent-to-income ratio as discrimination, credit check misuse.', content_type:'text', text_content:'<h3>Human Rights Law Applies to Housing</h3><p>The <strong>Alberta Human Rights Act (AHRA)</strong> prohibits discrimination in the provision of housing, accommodation, and services customarily available to the public. Section 5 of the Act makes it unlawful to deny tenancy, impose different terms, or treat an applicant adversely based on any <strong>protected ground</strong>.</p><p>This applies to landlords, property managers, building managers, and anyone involved in the tenant selection process. The intention to discriminate is not required — <strong>the effect of your actions</strong> is what matters.</p><h3>The Full List of Protected Grounds</h3><p>Under the AHRA, it is illegal to discriminate in housing based on:</p><ul><li><strong>Race</strong></li><li><strong>Colour</strong></li><li><strong>Ancestry</strong></li><li><strong>Place of origin</strong></li><li><strong>Religious beliefs</strong></li><li><strong>Gender</strong> (including gender identity and gender expression)</li><li><strong>Physical disability</strong></li><li><strong>Mental disability</strong></li><li><strong>Age</strong> (18 and over)</li><li><strong>Marital status</strong></li><li><strong>Family status</strong> (including having children)</li><li><strong>Sexual orientation</strong></li><li><strong>Source of income</strong></li></ul><h3>Source of Income Discrimination</h3><p>Refusing to rent to someone because their income comes from government benefits (such as AISH, Income Support, CPP Disability, or the Canada Child Benefit) is <strong>discrimination based on source of income</strong>. It does not matter that you have had bad experiences with tenants on assistance programs.</p><p>Common violations include:</p><ul><li>Stating in an advertisement: \"employed applicants only\" or \"no government assistance\"</li><li>Asking applicants whether they receive social assistance</li><li>Automatically rejecting applicants whose income comes from non-employment sources</li><li>Requiring a co-signer only for applicants on government assistance</li></ul><h4>Rent-to-Income Ratio as Discrimination</h4><p>Using a <strong>rent-to-income ratio</strong> (e.g., \"applicants must earn at least 3x the monthly rent\") is one of the most legally risky screening tools in Alberta. While not inherently unlawful, applying this ratio inflexibly can amount to discrimination based on source of income, disability, family status, or age.</p><p>For example, a person receiving AISH may have a fixed monthly income of approximately $1,863. A rigid 3:1 ratio would exclude them from any unit renting above $621 — effectively excluding them from the entire market. The Alberta Human Rights Commission has found this type of blanket policy to be discriminatory.</p><p>A safer approach is to evaluate <strong>the applicant\'s overall ability to pay</strong>, considering their total income from all lawful sources, any co-signers they offer, their payment history, and their credit record — without applying an automatic numerical cutoff.</p><h3>Credit Check Misuse</h3><p>Credit checks are a legitimate screening tool, but they become discriminatory when:</p><ul><li>You apply different credit standards to different applicants based on a protected ground</li><li>You use credit history as a proxy for source of income</li><li>You reject applicants with no credit history, which disproportionately affects newcomers to Canada (place of origin), young adults (age), and recently separated individuals (marital status)</li></ul><p>The key legal concept is <strong>adverse effect discrimination</strong>: a neutral-seeming policy (like a credit score cutoff of 650) can disproportionately impact protected groups, making it discriminatory in effect even without discriminatory intent.</p>', duration:15, sort_order:1, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m3.id, title:'Building a Legally Defensible Screening Process', description:'Consistent application, scoring rubric, documentation of decisions, what to do if you receive a complaint.', content_type:'text', text_content:'<h3>Consistency Is Your Best Defense</h3><p>The single most important principle in legally defensible tenant screening is <strong>consistency</strong>. Every applicant must be evaluated using the same criteria, the same process, and the same standards. The moment you deviate — even with good intentions — you create an opening for a discrimination complaint.</p><h3>Building a Scoring Rubric</h3><p>A scoring rubric converts subjective judgment into an objective, documented process:</p><h4>Category 1: Rental History (0–30 points)</h4><ul><li>Positive references from 2+ previous landlords: 30 points</li><li>Positive reference from 1 landlord: 20 points</li><li>No rental history (first-time renter): 15 points</li><li>Negative reference or eviction history: 0–5 points</li></ul><h4>Category 2: Income Verification (0–25 points)</h4><ul><li>Verified income sufficient to pay rent from any lawful source: 25 points</li><li>Income verification pending or partially confirmed: 15 points</li><li>Unable to verify income: 5 points</li></ul><h4>Category 3: Credit Assessment (0–25 points)</h4><ul><li>No outstanding collections or judgments related to housing: 25 points</li><li>Minor issues, no housing-related defaults: 15 points</li><li>Significant housing-related collections or judgments: 5 points</li><li>No credit history: 15 points (do not penalize newcomers or young adults)</li></ul><h4>Category 4: Application Completeness (0–20 points)</h4><ul><li>All fields completed, all documentation provided: 20 points</li><li>Minor items missing but cooperative in follow-up: 15 points</li><li>Significant missing information despite requests: 5 points</li></ul><p>Notice that this rubric evaluates <strong>tenancy-related factors only</strong>. It does not reference any protected ground and gives fair scores to first-time renters and people without credit history.</p><h3>Documenting Every Decision</h3><p>For every application you process, create a file that includes:</p><ul><li>The completed application form with the signed consent clause</li><li>Your completed scoring rubric with the total score</li><li>Notes from reference checks (dated, with the name of the person contacted)</li><li>The credit report (stored securely per PIPA requirements)</li><li>A written record of the decision (approved/denied) and the reason</li></ul><p>If you deny an application, the reason should reference <strong>specific, objective criteria</strong>: \"Application denied — unable to verify income; landlord reference reported unpaid rent arrears of 3+ months.\"</p><h3>What to Do When You Receive a Complaint</h3><p>Under the Alberta Human Rights Act, an individual has <strong>one year from the date of the alleged discriminatory act</strong> to file a complaint with the Alberta Human Rights Commission.</p><p>If you receive a complaint:</p><ol><li><strong>Do not panic, and do not contact the complainant directly.</strong></li><li><strong>Gather your documentation</strong> — your scoring rubric, reference notes, and written decision record become invaluable.</li><li><strong>Prepare a written response</strong> explaining your screening process and why this applicant was denied based on lawful, non-discriminatory criteria.</li><li><strong>Consider mediation</strong> — the Commission offers an early resolution process.</li><li><strong>Consult a lawyer</strong> who specializes in human rights law if the complaint proceeds to a tribunal hearing.</li></ol><div class="content-bridge"><strong>Next up:</strong> Your screening is compliant and your tenancies are properly structured. But disputes will still happen. Module 4 teaches you the RTDRS process so you are prepared when they do.</div>', duration:15, sort_order:2, is_free_preview:false });

const c3_m4 = DB.insert('modules', { course_id:c3.id, title:'Dispute Resolution Through the RTDRS', description:'Navigate the Residential Tenancy Dispute Resolution Service from filing to enforcement — jurisdiction, service rules, hearings, and collecting on orders.', sort_order:3 });

DB.insert('lessons', { module_id:c3_m4.id, title:'RTDRS Jurisdiction and Filing', description:'What the RTDRS can and cannot adjudicate, $100,000 cap, two-year limitation, choosing the right application form, filing fees.', content_type:'text', text_content:'<h3>What Is the RTDRS?</h3><p>The <strong>Residential Tenancy Dispute Resolution Service (RTDRS)</strong> is Alberta\'s specialized tribunal for resolving disputes between landlords and tenants. It operates under the authority of the RTA and the <em>Provincial Court Act</em>, providing a faster and less formal alternative to the court system for most residential tenancy matters.</p><h3>Jurisdiction: What the RTDRS Can Adjudicate</h3><p>The RTDRS has authority over disputes arising from residential tenancy agreements, including:</p><ul><li><strong>Recovery of unpaid rent</strong> — including rent arrears and compensation for holdover periods.</li><li><strong>Security deposit disputes</strong> — claims by either landlords or tenants regarding deposit deductions.</li><li><strong>Property damage claims</strong> — damage beyond normal wear and tear caused by the tenant.</li><li><strong>Termination orders</strong> — applications by landlords to terminate a tenancy for breach.</li><li><strong>Possession orders</strong> — orders requiring the tenant to vacate the premises.</li><li><strong>Breach of quiet enjoyment</strong> — tenant claims against landlords for unauthorized entry or interference.</li><li><strong>Repair and maintenance orders</strong> — tenant claims that the landlord has failed to maintain the premises.</li></ul><h3>The $100,000 Cap</h3><p>The RTDRS can award monetary remedies up to <strong>$100,000</strong>. If your claim exceeds this amount, you must file in the <strong>Court of King\'s Bench</strong> instead.</p><h3>The Two-Year Limitation Period</h3><p>Under the <strong>Limitations Act</strong>, you have <strong>two years from the date the claim arose</strong> to file an application with the RTDRS. For unpaid rent, the limitation runs from the date each rent payment was due. For property damage, it runs from the date you discovered or should have discovered the damage.</p><h3>Choosing the Right Application Form</h3><ul><li><strong>Landlord Application for Recovery of Money</strong> — for unpaid rent, damages, or other monetary claims.</li><li><strong>Landlord Application for Possession</strong> — to obtain an order requiring the tenant to vacate.</li><li><strong>Landlord Application for Both</strong> — seeking possession and monetary compensation simultaneously.</li><li><strong>Tenant Application</strong> — for return of deposit, repair orders, or compensation for breach of quiet enjoyment.</li></ul><h3>Filing Fees</h3><ul><li><strong>Claims up to $7,500:</strong> $75 filing fee</li><li><strong>Claims over $7,500:</strong> $150 filing fee</li></ul><p>Filing fees may be recoverable as part of your claim if you are successful.</p><h3>Preparing Your Application</h3><p>A strong RTDRS application includes:</p><ul><li>A <strong>clear, chronological summary</strong> of the facts</li><li><strong>Copies of all supporting documents:</strong> the lease agreement, inspection reports, photographs, rent ledger, correspondence, receipts for repairs</li><li>A <strong>specific dollar amount</strong> you are claiming, with a breakdown</li><li>The tenant\'s <strong>current address</strong> for service (or last known address)</li></ul>', duration:15, sort_order:0, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m4.id, title:'The Service Requirement', description:'Three clear days, acceptable methods, why regular mail and door-slipping get cases dismissed, substituted service, Declaration of Service.', content_type:'text', text_content:'<h3>Service: The Step That Wins or Loses Cases</h3><p>You can have the strongest case in Alberta — clear lease violations, perfect documentation, thousands of dollars in proven damages — and lose it entirely because you did not serve the other party correctly. <strong>Improper service is the single most common reason RTDRS applications are dismissed.</strong></p><h3>The Three Clear Days Rule</h3><p>The responding party must receive the application at least <strong>three clear days</strong> before the hearing date. \"Clear days\" means you do not count the day of service or the day of the hearing. So if your hearing is on a Thursday, the respondent must be served no later than the previous Sunday.</p><h3>Acceptable Methods of Service</h3><h4>Personal Service (Most Reliable)</h4><p>Handing the documents directly to the respondent. This is the gold standard because it is virtually impossible to dispute. The cost of a process server ($50–$100) is trivial compared to the cost of having your case dismissed.</p><h4>Registered Mail</h4><p>Sending the documents by <strong>registered mail</strong> (Canada Post) to the respondent\'s address. You will receive a tracking number and delivery confirmation.</p><h4>Posting at the Premises Plus Regular Mail</h4><p>Affixing a copy to the door of the rental premises <strong>and</strong> sending a copy by regular mail. Both steps must be completed — posting alone is not sufficient.</p><h3>Why Regular Mail Alone Fails</h3><p>Sending documents by <strong>regular mail only</strong> is not an accepted method of service for RTDRS proceedings. You have no proof of delivery, no tracking number, and no signature. If the respondent claims they never received it, you have no evidence to counter that claim.</p><h3>Substituted Service</h3><p>Sometimes you genuinely cannot locate the respondent. In these cases, you can apply to the RTDRS for an order allowing <strong>substituted service</strong> — service by email, through a family member, or other alternative methods. You must demonstrate that you have made <strong>reasonable efforts</strong> to serve through standard methods and those efforts have failed.</p><h3>The Declaration of Service</h3><p>After completing service, you must file a <strong>Declaration of Service</strong> with the RTDRS. This sworn document states:</p><ul><li>The name of the person served</li><li>The date and time of service</li><li>The method of service used</li><li>The address where service was effected</li><li>A description of the documents served</li></ul><p>The Declaration of Service must be filed <strong>before the hearing</strong>. If you arrive without it, the adjudicator may adjourn the matter.</p><h3>Best Practices</h3><ul><li><strong>Use a process server</strong> for any claim over $1,000</li><li><strong>Serve early</strong> — do not wait until the three-clear-day minimum</li><li><strong>Keep copies of everything</strong> — documents served, tracking receipts, the process server\'s affidavit</li><li><strong>Photograph door postings</strong> with a timestamp showing the date, time, and location</li></ul>', duration:15, sort_order:1, is_free_preview:false });

DB.insert('lessons', { module_id:c3_m4.id, title:'Hearing, Orders, and Enforcement', description:'Telephone hearing procedure, evidence presentation, in absentia proceedings, Order types, filing at Court of King\'s Bench, Civil Enforcement Agency.', content_type:'text', text_content:'<h3>The Hearing Process</h3><p>RTDRS hearings are typically conducted by <strong>telephone</strong>, making them accessible regardless of where the parties are located in Alberta. Hearings generally last 30 to 60 minutes, depending on complexity.</p><h4>Before the Hearing</h4><ul><li><strong>Organize your evidence chronologically</strong> — create a numbered bundle with a table of contents.</li><li><strong>Prepare a brief written summary</strong> of your claim (1–2 pages).</li><li><strong>Have all original documents accessible</strong> — the lease, inspection reports, photographs, rent ledger, correspondence, invoices, and your Declaration of Service.</li><li><strong>Calculate your exact claim amount</strong> with a line-by-line breakdown.</li><li><strong>Anticipate the other party\'s arguments</strong> and prepare your responses with supporting evidence.</li></ul><h4>During the Hearing</h4><ol><li><strong>Confirm identities</strong> and verify the Declaration of Service.</li><li><strong>Applicant presents first:</strong> State your claim clearly and walk through your evidence.</li><li><strong>Respondent responds:</strong> The other party presents their side and their evidence.</li><li><strong>Rebuttal:</strong> Both parties may respond to the other\'s evidence.</li><li><strong>Adjudicator\'s questions:</strong> Additional questions before closing.</li></ol><h3>In Absentia Proceedings</h3><p>If the respondent does not attend (and proper service has been confirmed), the hearing proceeds <strong>in absentia</strong>. The adjudicator will hear your evidence and, if it supports your claim, issue an order in your favor.</p><h3>Types of Orders</h3><ul><li><strong>Monetary Order:</strong> Requiring one party to pay a specific amount.</li><li><strong>Possession Order:</strong> Requiring the tenant to vacate by a specific date (typically 24 hours to 14 days).</li><li><strong>Compliance Order:</strong> Requiring a party to perform or cease a specific action.</li><li><strong>Dismissal:</strong> If the evidence does not support the claim.</li></ul><h3>Enforcing an RTDRS Order</h3><h4>Step 1: File at the Court of King\'s Bench</h4><p>An RTDRS order must be <strong>filed with the Court of King\'s Bench</strong> to become enforceable as a court judgment. This involves taking the original order to the courthouse and paying a filing fee.</p><h4>Step 2: Civil Enforcement Agency</h4><p>Once you have a filed court judgment, you can engage a <strong>Civil Enforcement Agency (CEA)</strong> — a private agency licensed to enforce court orders in Alberta. The CEA can:</p><ul><li><strong>Garnish wages:</strong> Redirect a portion of the debtor\'s employment income.</li><li><strong>Seize bank accounts:</strong> Freeze and withdraw funds from the debtor\'s accounts.</li><li><strong>Execute a Writ of Possession:</strong> Physically remove a tenant who has not complied with a possession order.</li><li><strong>Seize and sell personal property:</strong> In extreme cases, seize the debtor\'s assets.</li></ul><p>Judgments in Alberta are valid for <strong>10 years</strong> and can be renewed. A debtor who is judgment-proof today may have attachable assets in the future. Always file and attempt enforcement.</p><div class="content-bridge"><strong>Next up:</strong> You have completed all four modules. Take the final exam to test your knowledge of Alberta tenancy law and earn your certificate.</div>', duration:15, sort_order:2, is_free_preview:false });
